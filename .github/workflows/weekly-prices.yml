name: Weekly prices

# Refreshes KPDN PriceCatcher prices and Jaya Grocer online prices (personal use),
# rebuilds the prototype bundle, and commits the result.
on:
  schedule:
    - cron: "17 19 * * 0"   # Sunday 19:17 UTC = Monday 03:17 Malaysia time
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PriceCatcher (data.gov.my) + GeoNames postcodes
        run: python3 scripts/build_prices.py
      - name: Jaya Grocer online prices (personal use, polite, once a week)
        run: python3 scripts/fetch_jayagrocer.py
      - name: Rebuild prototype
        run: python3 scripts/build_prototype.py
      - name: Commit if changed
        run: |
          git config user.name "masakje-bot"
          git config user.email "masakje-bot@users.noreply.github.com"
          git add public/data prototype/index.html
          git diff --cached --quiet || git commit -m "Weekly price refresh $(date -u +%F)"
          git push
