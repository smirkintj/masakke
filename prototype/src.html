<title>MasakJe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first single column; from 900px a two-column week (dinners left, sticky "next step" and budget right).
   Direction — Product: plans a week of Malaysian home dinners, prices them at shops near you, guides the cooking.
   Character: warm, appetising, encouraging. World: a busy home kitchen, chili and sambal, a Saturday pasar.
   Moment: the "Tonight" card in soft chili tint. Signature: the chili-orange progress line (budget, steps, cooking). */
:root {
  --bg: #ffffff; --surface: #f5f5f4; --card: #ffffff; --raised: #f0efed; --line: rgba(28, 25, 23, 0.10);
  --fg: #1c1917; --fg2: #57534e; --muted: #737373;
  --accent: #c8420c; --accent-bright: #f26a1b; --accent-ink: #ffffff; --accent-soft: #fff1e8; --accent-line: rgba(200, 66, 12, 0.22);
  --pos: #15803d; --neg: #dc2626; --shadow: rgba(28, 25, 23, 0.08);
  --font: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212; --surface: #191919; --card: #1e1e1e; --raised: #2a2a2a; --line: rgba(245, 245, 245, 0.10);
    --fg: #f5f5f5; --fg2: #c2c2c2; --muted: #969696;
    --accent: #ff8a4c; --accent-bright: #ff8a4c; --accent-ink: #1f0e04; --accent-soft: rgba(255, 138, 76, 0.13); --accent-line: rgba(255, 138, 76, 0.35);
    --pos: #4ade80; --neg: #f87171; --shadow: rgba(0, 0, 0, 0.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121212; --surface: #191919; --card: #1e1e1e; --raised: #2a2a2a; --line: rgba(245, 245, 245, 0.10);
  --fg: #f5f5f5; --fg2: #c2c2c2; --muted: #969696;
  --accent: #ff8a4c; --accent-bright: #ff8a4c; --accent-ink: #1f0e04; --accent-soft: rgba(255, 138, 76, 0.13); --accent-line: rgba(255, 138, 76, 0.35);
  --pos: #4ade80; --neg: #f87171; --shadow: rgba(0, 0, 0, 0.5); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body {
  color: var(--fg); font: 400 16px/24px var(--font); font-variant-numeric: tabular-nums;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-font-smoothing: antialiased; overflow-wrap: anywhere;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; opacity: 0.5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.money-v { white-space: nowrap; }
.app { max-width: 600px; margin: 0 auto; padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
.app.bare { padding-bottom: 32px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 60px; }
.logo { font-weight: 600; font-size: 20px; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 4px 0; color: var(--fg); }
.logo svg { color: var(--accent-bright); }
.where { display: inline-flex; align-items: center; gap: 6px; min-width: 0; height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: var(--surface); color: var(--fg2); font-size: 14px; font-weight: 500; transition: background-color 150ms var(--ease); }
.where span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.where:hover { background: var(--raised); }

h1 { font-size: 30px; line-height: 1.15; font-weight: 500; margin: 12px 0 4px; text-wrap: balance; }
.sub { color: var(--fg2); font-size: 15px; margin: 0 0 20px; }
.link { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; background: none; border: 0; padding: 0; font-size: inherit; font-weight: 500; }

/* week layout */
.week-grid { display: grid; gap: 24px; }
.week-grid > *, .side > *, .next > *, .days > *, .day > * { min-width: 0; }
.btn.big { white-space: normal; text-align: center; line-height: 20px; }
.side { display: grid; gap: 16px; align-content: start; }

/* flow + next */
.flow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.flow div { display: grid; gap: 6px; font-size: 13px; font-weight: 500; color: var(--muted); }
.flow i { display: block; height: 4px; border-radius: 2px; background: var(--raised); }
.flow .done i, .flow .now i { background: var(--accent-bright); }
.flow .now { color: var(--accent); }
.flow .done { color: var(--fg2); }
.next { background: var(--accent-soft); border-radius: 20px; padding: 20px; display: grid; gap: 16px; }
.next .k { font-size: 14px; font-weight: 500; color: var(--accent); }
.next .t { font-size: 22px; line-height: 28px; font-weight: 500; margin-top: 4px; }
.next .d { font-size: 15px; color: var(--fg2); margin-top: 6px; }

/* summary */
.summary { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; }
.summary .k { font-size: 14px; color: var(--fg2); }
.summary .big { font-size: 36px; line-height: 1.1; font-weight: 500; margin: 4px 0 16px; white-space: nowrap; }
.meter { height: 8px; border-radius: 4px; background: var(--raised); overflow: hidden; }
.meter div { height: 100%; border-radius: 4px; background: var(--accent-bright); transform-origin: left; transition: transform 400ms var(--ease); }
.meter.over div { background: var(--neg); }
.budget { margin-top: 8px; font-size: 14px; color: var(--fg2); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.budget.over { color: var(--neg); }
.srows { display: grid; gap: 4px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; color: var(--fg2); }
.srows div { display: flex; justify-content: space-between; gap: 12px; }
.srows b { font-weight: 500; color: var(--fg); white-space: nowrap; }

/* days */
.section-h { display: flex; justify-content: space-between; align-items: center; margin: 0 0 12px; gap: 12px; }
.section-h h2 { font-size: 20px; font-weight: 500; margin: 0; }
.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font-size: 15px; font-weight: 500; transition: background-color 150ms var(--ease), transform 120ms var(--ease); white-space: nowrap; }
.btn:hover { background: var(--surface); }
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.big { height: 52px; width: 100%; font-size: 16px; }
.days { display: grid; gap: 12px; }
.day { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 14px 14px 12px 16px; display: grid; gap: 4px; }
.day.off { background: var(--surface); border-color: transparent; }
.day.today { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.dhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 2px; }
.dlabel { font-size: 14px; font-weight: 600; color: var(--fg); }
.dlabel span { color: var(--muted); font-weight: 400; margin-left: 4px; }
.dishes { display: grid; gap: 2px; min-width: 0; }
.dish { display: grid; grid-template-columns: 1fr auto 40px; align-items: center; gap: 8px; min-height: 52px; }
.dish-main { min-width: 0; text-align: left; background: none; border: 0; padding: 4px 0; border-radius: 8px; }
.dish-main .n { display: block; font-weight: 500; font-size: 16px; line-height: 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dish-main .e { display: block; font-size: 14px; line-height: 20px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.missing { display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start; background: var(--card); border-radius: 12px; padding: 12px; font-size: 14px; color: var(--fg2); }
.missing svg { color: var(--accent); margin-top: 2px; }
.missing b { display: block; font-weight: 500; color: var(--fg); font-size: 15px; }
.prep .nb { font-size: 12px; font-weight: 500; color: var(--accent); margin-left: 6px; }
.dish.pickable { grid-template-columns: minmax(0, 1fr) auto; }
.next .dish-main .n, .next .dish-main .e { white-space: normal; }
.dish .c { font-size: 14px; color: var(--fg2); white-space: nowrap; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; border: 0; background: transparent; color: var(--muted); transition: background-color 150ms var(--ease), color 150ms var(--ease); }
.icon-btn:hover { background: var(--surface); color: var(--fg); }
.day-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; font-size: 14px; color: var(--muted); }
.day-foot .acts { display: flex; gap: 20px; }
.day-foot .link { color: var(--fg2); text-decoration: none; display: inline-flex; gap: 6px; align-items: center; min-height: 32px; }
.day-foot .link:hover { color: var(--fg); }
.day-foot .link.go { color: var(--accent); font-weight: 600; }
.verdict { background: var(--surface); border-radius: 16px; padding: 14px; margin: 4px 0 16px; display: grid; gap: 8px; }
.vh { font-size: 15px; font-weight: 500; }
.vtags { display: flex; gap: 6px; flex-wrap: wrap; }
.toggle.three { grid-template-columns: repeat(3, 1fr); display: grid; }
.toggle.three button { min-width: 0; }
.toggle.three button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.rate { border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: grid; gap: 12px; margin-bottom: 12px; }
.rate .rh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rate .rh b { font-weight: 500; font-size: 16px; }
.rate .rh span { font-size: 13px; color: var(--muted); }
.rbtns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rbtns button { height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font-size: 15px; font-weight: 500; }
.rbtns button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.rnote { font-size: 13px; color: var(--fg2); }
.rnote.good { color: var(--pos); }
.offline { display: flex; gap: 10px; align-items: flex-start; background: var(--fg); color: var(--bg); border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 20px; margin: 8px 0 4px; }
.offline svg { flex: none; margin-top: 1px; }
.offline b { font-weight: 500; }
.pending { color: var(--accent); }
.warnbox { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; border: 1px solid rgba(220, 38, 38, 0.25); background: rgba(220, 38, 38, 0.05); border-radius: 16px; padding: 14px 14px 14px 16px; font-size: 14px; color: var(--fg2); }
.warnbox b { display: block; font-weight: 500; color: var(--neg); font-size: 15px; margin-bottom: 2px; }
.offrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; background: var(--surface); font-size: 14px; color: var(--muted); }
.offrow b { font-weight: 500; color: var(--fg2); }
.offrow .link { text-decoration: none; font-size: 14px; }
.off-msg { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted); font-size: 15px; min-height: 44px; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 11px; background: var(--surface); color: var(--fg2); font-size: 12px; font-weight: 500; line-height: 16px; white-space: nowrap; }
.tag.ok { background: var(--accent-soft); color: var(--accent); }
.tag.good { color: var(--pos); }
.pedas { color: var(--neg); }

/* shopping list */
.groups { display: block; }
.group { margin-bottom: 24px; break-inside: avoid; }
.group h3 { font-size: 14px; font-weight: 600; color: var(--fg2); margin: 0 0 8px; display: flex; justify-content: space-between; gap: 12px; }
.list { background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.item { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; min-height: 60px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item input { width: 22px; height: 22px; accent-color: var(--accent); margin: 0; }
.item .n { font-size: 16px; line-height: 22px; font-weight: 500; }
.item .q { font-size: 13px; color: var(--muted); line-height: 18px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
.item .p { font-size: 15px; font-weight: 500; text-align: right; white-space: nowrap; }
.item.done .n, .item.done .p { color: var(--muted); text-decoration: line-through; }
.totals { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 12px 12px 12px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; box-shadow: 0 8px 24px var(--shadow); }
.totals .v { font-size: 22px; font-weight: 600; white-space: nowrap; }
.totals .k { font-size: 13px; color: var(--muted); }

/* recipes */
.search { width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px 0 42px; font-size: 16px; }
.search-wrap { position: relative; margin-bottom: 12px; }
.search-wrap svg { position: absolute; left: 14px; top: 16px; color: var(--muted); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; scrollbar-width: none; }
.chip { flex: none; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--card); color: var(--fg2); font-size: 14px; font-weight: 500; transition: background-color 150ms var(--ease); }
.rtabs { display: flex; gap: 20px; border-bottom: 1px solid var(--line); margin: 4px 0 12px; overflow-x: auto; scrollbar-width: none; }
.rtabs button { flex: none; background: none; border: 0; padding: 8px 0 10px; font-size: 15px; font-weight: 500; color: var(--fg2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.rtabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.rx-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; margin-bottom: 12px; }
.rx-bar .search-wrap { margin: 0; }
.rx-bar .btn { height: 44px; padding: 0 12px; white-space: nowrap; }
.rx-count { font-size: 13px; color: var(--muted); margin: 4px 0 8px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-weight: 500; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip svg { vertical-align: -1px; margin-left: 2px; }
.seg.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.rx-foot { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; margin-top: 20px; position: sticky; bottom: 0; background: var(--card); padding: 8px 0; }
.rx-foot .btn { height: 52px; }
.rx-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.rx-head .btn { height: 40px; padding: 0 14px; }
.tag.hh { background: var(--accent-soft, #fff1e8); color: var(--accent); }
.hhbox { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin: 16px 0 4px; }
.ed .ed-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 4px 0 8px; }
.ed .linkbtn { display: inline-flex; align-items: center; gap: 4px; }
.ed-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 12px 0 4px; }
.ed-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 10px; }
.ed-sel { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
.ed-sel select, .ed-sel .inp { height: 44px; width: 100%; min-width: 0; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 0 10px; font: 400 15px/1 inherit; font-family: inherit; box-sizing: border-box; }
.ed-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 20px; }
.ed-h h3 { margin: 0; }
.ed-ing { display: grid; grid-template-columns: minmax(0, 1fr) 84px 34px 36px; gap: 6px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.ed-ing .n { font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
.ed-ing .inp { height: 40px; text-align: right; padding: 0 10px; width: 100%; box-sizing: border-box; }
.ed-ing .u { font-size: 13px; color: var(--muted); }
.ed-res { border: 1px solid var(--line); border-radius: 14px; margin-top: 6px; overflow: hidden; }
.ed-hit { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; padding: 10px 14px; background: var(--card); border: 0; border-top: 1px solid var(--line); text-align: left; font-size: 15px; color: var(--fg); }
.ed-hit:first-child { border-top: 0; }
.ed-step { border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-top: 10px; }
.ed-sh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.ed-sh span { display: flex; gap: 14px; font-size: 14px; }
.ed-step textarea { width: 100%; box-sizing: border-box; min-height: 64px; resize: vertical; padding: 10px 12px; font: 400 15px/1.4 inherit; font-family: inherit; }
.ed-step .k { margin: 10px 0 6px; }
.chip.sm { height: 30px; padding: 0 10px; font-size: 13px; }
.btn.dashed { border-style: dashed; color: var(--accent); margin-top: 10px; background: none; }
.btn.danger { background: var(--neg); color: #fff; border-color: transparent; }
.ed-err { color: var(--neg); font-size: 14px; min-height: 20px; margin: 12px 0 4px; }
.ed .btn.big + .btn.big { margin-top: 8px; }
.chip, .seg button, .toggle button, .rrow, .tab, .ed-hit, .rtabs button, .icon-btn { transition: background-color 150ms var(--ease), color 150ms var(--ease), transform 120ms var(--ease); }
.chip:active, .seg button:active, .toggle button:active, .tab:active, .ed-hit:active, .icon-btn:active { transform: scale(0.94); }
.rrow:active { transform: scale(0.985); }
@media (prefers-reduced-motion: reduce) { .chip:active, .seg button:active, .toggle button:active, .tab:active, .rrow:active, .icon-btn:active { transform: none; } }
.thaw { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; padding: 14px 16px; border-radius: 18px; background: #eef6ff; color: #12395c; margin: 0 0 16px; overflow: hidden; }
.thaw > svg { width: 22px; height: 22px; margin-top: 2px; }
.thaw b { display: block; font-weight: 500; font-size: 16px; }
.thaw span { display: block; font-size: 14px; margin-top: 2px; opacity: 0.85; }
.thaw-acts { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.thaw .btn { height: 38px; background: #fff; border-color: rgba(18, 57, 92, 0.15); color: #12395c; }
.thaw .linkbtn { color: #12395c; text-decoration: underline; text-underline-offset: 3px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .thaw { background: rgba(96, 165, 250, 0.12); color: #cfe3ff; } :root:not([data-theme="light"]) .thaw .btn { background: transparent; color: #cfe3ff; border-color: rgba(207, 227, 255, 0.25); } :root:not([data-theme="light"]) .thaw .linkbtn { color: #cfe3ff; } }
.btn.wa { width: 100%; margin-top: 12px; }
.setrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
.setrow:last-of-type { margin-bottom: 20px; }
.setrow b { display: block; font-weight: 500; }
.setrow span { display: block; font-size: 14px; color: var(--muted); }
.switch { width: 52px; height: 32px; border-radius: 16px; border: 0; background: var(--line); position: relative; transition: background-color 180ms var(--ease); padding: 0; }
.switch i { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 13px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform 220ms cubic-bezier(.34,1.56,.64,1); }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"] i { transform: translateX(20px); }
.pickme { display: grid; gap: 8px; margin: 16px 0 8px; }
.pickme .mrow { grid-template-columns: 36px minmax(0, 1fr) 16px; width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); text-align: left; color: var(--fg); }
.pickme .mrow > svg { transform: rotate(180deg); color: var(--muted); }
.pickme .mrow b { display: block; font-weight: 500; }

    const lauk = pool("lauk"), sayur = pool("sayur"), one = pool("onepot");
    const nights = S.settings.nights.filter(Boolean).length;
    // Build a shuffled list of protein groups for the week, then fill each night from that group.
    const tgt = mixTarget(nights), slots = [];
    for (const [g, n] of Object.entries(tgt)) for (let i = 0; i < n; i++) slots.push(g);
    for (let i = slots.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [slots[i], slots[j]] = [slots[j], slots[i]]; }
    for (let i = 1; i < slots.length; i++) if (slots[i] === slots[i - 1]) { const j = slots.findIndex((g, k) => k > i && g !== slots[i]); if (j > 0) [slots[i], slots[j]] = [slots[j], slots[i]]; }
    const used = new Set(); let onepots = 0, si = 0; const days = [];
    for (let i = 0; i < 7; i++) {
      if (!S.settings.nights[i]) { days.push({ off: true }); continue; }
      const want = slots[si++] || "chicken";
      const fits = arr => arr.filter(x => !used.has(x.id) && GROUP(x) === want);
      if (onepots < 1 && Math.random() < 0.18) {
        const r = pickW(fits(one));
        if (r) { used.add(r.id); onepots++; days.push({ onepot: r.id }); continue; }
      }
      let c = fits(lauk);
      if (!c.length) c = lauk.filter(x => !used.has(x.id) && GROUP(x) !== "light");  // group excluded by preferences
      if (!c.length) c = lauk.filter(x => !used.has(x.id));
      if (!c.length || !sayur.length) { const o = rand(one.filter(x => !used.has(x.id))); if (o) { used.add(o.id); days.push({ onepot: o.id }); } else days.push({ off: true }); continue; }
      const l = pickW(c); used.add(l.id);
      const s = pickW(sayur.filter(x => !used.has(x.id))) || rand(sayur); used.add(s.id);
      days.push({ lauk: l.id, sayur: s.id });
    }
    return { days };
  }
  function score(plan) {
    const t = totals(plan), b = S.settings.budget;
    if (t.toBuy > b) return 1000 + (t.toBuy - b);
    const mains = plan.days.flatMap(d => dayItems(d).filter(r => r.kind !== "sayur"));
    const light = mains.filter(r => GROUP(r) === "light").length;
    const useK = plan.days.flatMap(d => dayItems(d)).reduce((a, r) => a + r.ing.filter(([k]) => S.kitchen[k] && !ING[k].pantry).reduce((x, [k]) => x + (S.kitchen[k].soon ? 2 : 1), 0), 0);
    // Price matters, but only a little: the mix above decides what kind of week it is.
    return light * 6 + t.toBuy * 0.06 - useK * 2 + Math.random() * 6;
  }
  function makePlan() {
    let best = null, bs = Infinity;
    for (let i = 0; i < 250; i++) { const p = randomPlan(), s = score(p); if (s < bs) { bs = s; best = p; } }
    return best;
  }
  // A plan belongs to a calendar week (Monday start). "Plan next week" makes one for next Monday;
  // replanning keeps the plan's own week, or this week if that one has already ended.
  const mondayAfter = d => { const n = new Date(d); n.setDate(n.getDate() + 7); return n; };
  function newWeek(start) { const st = start || (S.plan && todayIdx() < 7 ? planStart() : weekStart()); S.plan = makePlan(); S.plan.start = ymd(st); S.bought = {}; S.pantryNeed = {}; S.flow = { locked: false, shopped: false, cooked: {} }; save(); }
  function inPlan() { return new Set(S.plan.days.flatMap(d => [d.lauk, d.sayur, d.onepot]).filter(Boolean)); }
  function swap(di, slot) {
    const day = S.plan.days[di]; const used = inPlan();
    const cands = pool(slot).filter(r => !used.has(r.id)).sort(() => Math.random() - 0.5);
    if (!cands.length) return toast("No other dishes match your preferences");
    let pick = cands[0];
    for (const r of cands) { const t = totals({ days: S.plan.days.map((d, i) => i === di ? { ...d, [slot]: r.id } : d) }); if (t.toBuy <= S.settings.budget) { pick = r; break; } }
    day[slot] = pick.id; save(); render();
  }
  function toggleOff(di) {
    if (S.plan.days[di].off) {
      const used = inPlan();
      S.plan.days[di] = { lauk: (rand(pool("lauk").filter(r => !used.has(r.id))) || rand(pool("lauk"))).id, sayur: (rand(pool("sayur").filter(r => !used.has(r.id))) || rand(pool("sayur"))).id };
    } else S.plan.days[di] = { off: true };
    save(); render();
  }

  // ---------- dates & formatting ----------
  function weekStart() { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; }
  function planStart() { const st = S.plan && S.plan.start; if (st) { const [y, m, d] = st.split("-").map(Number); return new Date(y, m - 1, d); } return weekStart(); }
  const dateOf = i => { const d = planStart(); d.setDate(d.getDate() + i); return d; };
  const fmtDate = d => d.toLocaleDateString("en-MY", { day: "numeric", month: "short" });
  const todayIdx = () => { const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((t - planStart()) / 864e5); };   // negative before the plan starts, 7+ after it ends
  function qty(q, unit, key) {
    if (unit === "pc") {
      const n = key === "egg" ? Math.ceil(q - 1e-9) : Math.max(1, Math.round(q));
      const word = { egg: n === 1 ? "egg" : "eggs", lemongrass: n === 1 ? "stalk" : "stalks", curry_leaves: n === 1 ? "sprig" : "sprigs", tempe: n === 1 ? "pack" : "packs" }[key] || "pcs";
      return `${n} ${word}`;
    }
    const base = unit === "g" ? ["g", "kg"] : ["ml", "L"];
    if (q >= 1000) return `${Math.round(q / 100) / 10} ${base[1]}`;
    const r = q >= 50 ? Math.round(q / 10) * 10 : Math.max(1, Math.round(q / 5) * 5);
    return `${r} ${base[0]}`;
  }
  const fmtClock = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

  // ---------- flow ----------
  function nextCookDay() {
    const t = todayIdx();
    for (let i = Math.max(t, 0); i < 7; i++) if (!S.plan.days[i].off && !S.flow.cooked[i]) return i;
    return -1;
  }
  function flowStage() { if (!S.flow.locked) return 0; if (!S.flow.shopped) return 1; return 2; }

  // ---------- views ----------
  function viewWeek() {
    const t = totals(S.plan), b = S.settings.budget, diff = b - t.toBuy;
    const fresh = t.rows.filter(r => !r.pantry && r.buy), needP = t.rows.filter(r => r.pantry && S.pantryNeed[r.k]);
    const all = [...fresh, ...needP], left = all.filter(r => !S.bought[r.k]).length;
    const ti = todayIdx(), di = nextCookDay();
    const dishRow = (r, i, slot) => `<div class="dish pickable"><button class="dish-main" data-recipe="${r.id}"><span class="n">${esc(r.name)}${r.spicy >= 2 ? ' <span class="pedas" title="Pedas">•</span>' : ""}</span><span class="e">${esc(r.en)} · ${r.mins} min</span></button><button class="btn" style="height:36px;padding:0 12px" data-pick="${i}:${slot}">Change</button></div>`;
    const dishesOf = (d, i) => d.onepot ? dishRow(RX[d.onepot], i, "onepot") : dishRow(RX[d.lauk], i, "lauk") + dishRow(RX[d.sayur], i, "sayur");
    let hero;
    if (di < 0) hero = ti >= 7
      ? `<div class="next"><div><div class="k">This week</div><div class="t">Not planned yet</div><div class="d">Last week's plan has ended. Plan this week to get a shopping list</div></div><button class="btn primary big" id="newweek">Plan this week</button></div>`
      : `<div class="next"><div><div class="k">This week</div><div class="t">${S.plan.days.some((d, i) => i >= ti && !d.off) ? "Every dinner is cooked" : "No more dinners planned"}</div><div class="d">Next week starts ${fmtDate(mondayAfter(planStart()))}. Plan it now and shop this weekend</div></div><button class="btn primary big" id="newweek">Plan next week</button></div>`;
    else {
      const d = S.plan.days[di], items = dayItems(d), mins = items.reduce((a, r) => a + r.mins, 0);
      const when = di === ti ? "Tonight" : ti < 0 ? `${DAYS_LONG[di]}, ${fmtDate(dateOf(di))}` : DAYS_LONG[di];
      hero = `<div class="next"><div class="k">${when}</div>
        <div class="dishes" style="margin-top:-4px">${dishesOf(d, di)}</div>
        <div class="d" style="margin-top:-4px">${d.onepot ? "One-pot dinner" : "With rice"} · about ${Math.max(...items.map(r => r.mins)) + (d.onepot ? 0 : 10)} min · about ${items.reduce((a, r) => a + r.macro[0], 0) + (d.onepot ? 0 : riceMacro()[0])} kcal and ${items.reduce((a, r) => a + r.macro[1], 0) + (d.onepot ? 0 : riceMacro()[1])} g protein a person</div>
        ${(() => { const miss = missingFor(di);
          if (!miss.length) return `<button class="btn primary big" data-cookday="${di}">${ic("flame")}Start cooking</button>`;
          const names = miss.slice(0, 3).map(m => esc(ING[m.k].name.replace(/ \(.*\)/, ""))).join(", ") + (miss.length > 3 ? ` and ${miss.length - 3} more` : "");
          return `<div class="missing">${ic("cart")}<div><b>Still need ${miss.length} ${miss.length === 1 ? "item" : "items"}</b><span>${names}</span></div></div>
            <button class="btn primary big" data-tonight="${di}">Get ${di === ti ? "tonight's" : "the"} items</button>
            <button class="btn big" data-cookday="${di}">${ic("flame")}Start cooking anyway</button>`; })()}</div>`;
    }
    const shopCard = S.flow.shopped ? `<div class="summary" style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><div class="k">Groceries for the week</div><div style="font-size:18px;font-weight:500;margin-top:2px">${ic("check", 16)} Shopping done</div></div><button class="btn" data-go="shop">View list</button></div>`
      : all.length ? `<div class="summary" style="display:grid;gap:12px">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline"><div><div class="k">Groceries for the week</div><div style="font-size:20px;font-weight:500;margin-top:2px">${left ? `${left} of ${all.length} left to buy` : "All bought"}</div></div><div style="text-align:right"><div class="money-v" style="font-weight:500" data-tw="wktotal" data-v="${t.toBuy.toFixed(2)}">${rm(t.toBuy)}</div><div class="k ${diff < 0 ? "pedas" : ""}" style="font-size:13px">${diff >= 0 ? `${rm(diff)} under budget` : `${rm(-diff)} over budget`}</div></div></div>
        <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="${all.length}" aria-valuenow="${all.length - left}" aria-label="Groceries bought"><div data-tw="grocbar" data-s="${((all.length - left) / all.length).toFixed(3)}" style="transform:scaleX(${((all.length - left) / all.length).toFixed(3)})"></div></div>
        ${left ? shopLine() : ""}
        ${left ? `<button class="btn big" data-go="shop">${ic("cart")}${left === all.length ? "Start shopping" : "Continue shopping"}</button>` : ""}
      </div>` : "";
    const past = S.plan.days.map((d, i) => i < ti && i !== di ? `${DAYS[i]} ${S.flow.cooked[i] ? "cooked" : d.off ? "off" : "not cooked"}` : null).filter(Boolean);
    const days = S.plan.days.map((d, i) => {
      if (i === di || i < ti) return "";
      if (d.off) return `<div class="offrow"><span><b>${i === ti ? "Today" : DAYS_LONG[i]}</b> ${fmtDate(dateOf(i))} · Not cooking</span><button class="link" data-off="${i}">Add dinner</button></div>`;
      const head = `<div class="dhead"><div class="dlabel">${i === ti ? "Today" : DAYS_LONG[i]}<span>${fmtDate(dateOf(i))}</span></div>${S.flow.cooked[i] ? `<span class="tag">${ic("check", 12)}Cooked</span>` : ""}</div>`;
      if (d.off) return `<div class="day off">${head}<div class="off-msg"><span>Not cooking</span><button class="btn" data-off="${i}">Plan a dinner</button></div></div>`;
      return `<div class="day ${S.flow.cooked[i] ? "off" : ""}">${head}<div class="dishes">${dishesOf(d, i)}</div><div class="day-foot"><span>${d.onepot ? "One-pot" : "With rice"}</span><span class="acts">${S.flow.cooked[i] ? "" : `<button class="link go" data-cookday="${i}">${ic("flame", 15)}Cook</button><button class="link" data-off="${i}">Skip</button>`}</span></div></div>`;
    }).join("");
    const pct = Math.min(1, t.toBuy / b);
    return `<div class="enter">
      ${offlineBanner()}
      <h1>${new Date().toLocaleDateString("en-MY", { weekday: "long", day: "numeric", month: "short" })}</h1>
      <p class="sub">${todayIdx() < 0 ? `Next week's plan, from ${fmtDate(planStart())}` : `Dinner for ${S.settings.people}`} · prices from ${esc(priceLabel())}</p>
      ${householdLine()}
      ${thawCard()}
      ${S.guideSeen ? "" : `<div class="guide"><div class="gh"><b>How your week works</b><button class="link" id="guideOk">Got it</button></div>
        <ol class="how small">
          <li><b>Check tonight's dinner</b><span>Tap Change on any dish to swap it. Tap a dish name to see the recipe</span></li>
          <li><b>Shop once for the week</b><span>Tap Start shopping at the shop and tick items as they go in the trolley</span></li>
          <li><b>Cook at dinner time</b><span>Tap Start cooking. Missing something? We'll tell you first</span></li>
        </ol></div>`}
      <div class="week-grid">
        <aside class="side">${hero}${budgetWarning(t)}${shopCard}
        </aside>
        <section class="week-main"><div class="section-h"><h2>Rest of the week</h2><button class="btn" id="regen">${ic("swap")}New plan</button></div>${past.length ? `<p class="sub" style="margin:-4px 0 12px;font-size:14px">Earlier this week: ${past.join(" · ")}</p>` : ""}<div class="days">${days || `<p class="sub">That's the week. Plan next week from Settings</p>`}</div></section>
      </div>
    </div>`;
  }

  // What tonight's dinner still needs: not ticked as bought, not enough in the kitchen.
  // Pantry staples count as at home unless marked Need on the shopping list.
  function missingFor(di) {
    const need = {};
    for (const r of dayItems(S.plan.days[di])) for (const [k, q] of r.ing) need[k] = (need[k] || 0) + q * scale();
    return Object.entries(need).filter(([k, q]) => {
      const it = ING[k];
      if (it.pantry && !S.pantryNeed[k]) return false;
      if (S.bought[k]) return false;
      return !(S.kitchen[k] && S.kitchen[k].q >= q * 0.9);
    }).map(([k, q]) => ({ k, q }));
  }
  function openTonightList(di) {
    const miss = missingFor(di), root = document.getElementById("sheetRoot");
    const cost = miss.reduce((a, m) => { const it = ING[m.k], p = price(m.k), pack = p.src === "Jaya Grocer" ? JG.items[m.k].size : it.pack; return a + Math.max(1, Math.ceil(m.q / pack - 1e-9)) * pack * p.unit; }, 0);
    root.innerHTML = `<div class="scrim open" id="scrim"></div><div class="sheet open" role="dialog" aria-modal="true" aria-labelledby="tl-t"><div class="sheet-in">
      <div class="grab"></div><button class="icon-btn close" id="shClose" aria-label="Close">${ic("x", 18)}</button>
      <h2 id="tl-t">For ${di === todayIdx() ? "tonight" : DAYS_LONG[di]}</h2>
      <p class="sub" style="margin:4px 0 16px">${dayItems(S.plan.days[di]).map(r => esc(r.name)).join(" + ")} · about ${rm(cost)}. Tick items as you get them; they're ticked on the week's list too</p>
      <div class="list">${miss.map(m => `<label class="item"><input type="checkbox" data-bought="${m.k}"><div><div class="n">${esc(ING[m.k].name)}</div><div class="q">${qty(m.q, ING[m.k].unit, m.k)} · ${unitPrice(m.k)}</div></div><span></span></label>`).join("")}</div>
      <button class="btn primary big" id="tlDone" style="margin-top:16px">Done</button>
      <button class="btn big" style="margin-top:8px" data-pickday="${di}">Change tonight's dishes instead</button>
    </div></div>`;
    const close = () => { root.innerHTML = ""; render(); };
    document.getElementById("scrim").onclick = close; document.getElementById("shClose").onclick = close; document.getElementById("tlDone").onclick = close;
  }

  // Over budget: keep the variety, but suggest the one swap (same protein group) that saves the most.
  function bestSaving() {
    const base = totals(S.plan).toBuy, used = inPlan(), ti = todayIdx();
    let best = null;
    S.plan.days.forEach((d, i) => {
      if (d.off || i < ti || S.flow.cooked[i]) return;
      ["lauk", "sayur", "onepot"].forEach(slot => {
        if (!d[slot]) return;
        const cur = RX[d[slot]];
        pool(slot).filter(r => !used.has(r.id) && (slot === "sayur" || GROUP(r) === GROUP(cur))).forEach(r => {
          const save = base - totals({ days: S.plan.days.map((x, j) => j === i ? { ...x, [slot]: r.id } : x) }).toBuy;
          if (save > 0.5 && (!best || save > best.save)) best = { i, slot, from: cur, to: r, save };
        });
      });
    });
    return best;
  }
  function budgetWarning(t) {
    const over = t.toBuy - S.settings.budget;
    if (over <= 0) return "";
    const b = bestSaving();
    return `<div class="warnbox" role="status"><div><b>${rm(over)} over your ${rm0(S.settings.budget)} budget</b>
      <span>${b ? `Swap ${esc(b.from.name)} for ${esc(b.to.name)} on ${DAYS_LONG[b.i]} to save ${rm(b.save)}` : "Prices at your shop are high this week. Raise the budget in Settings or change a dish"}</span></div>
      ${b ? `<button class="btn" data-applysave="${b.i}:${b.slot}:${b.to.id}">Apply</button>` : `<button class="btn" data-go="setup">Settings</button>`}</div>`;
  }

  // ---------- dish picker (replaces random swap) ----------
  function openPicker(di, slot) {
    const cur = RX[S.plan.days[di][slot]];
    const grp = slot === "sayur" ? "all" : cur.protein === "mutton" ? "beef" : ["tofu", "veg"].includes(cur.protein) ? "egg" : cur.protein;
    S.pick = { di, slot, f: grp, q: "" }; renderPicker();
  }
  function renderPicker() {
    const P0 = S.pick; if (!P0) return;
    const day = S.plan.days[P0.di], cur = RX[day[P0.slot]], used = inPlan();
    const base = totals(S.plan).toBuy;
    const fridge = new Set(Object.keys(S.kitchen).filter(k => !ING[k].pantry));
    let list = pool(P0.slot, true).filter(r => r.id !== cur.id && !used.has(r.id));
    if (P0.slot !== "sayur" && P0.f !== "all") list = list.filter(r => P0.f === "beef" ? (r.protein === "beef" || r.protein === "mutton") : P0.f === "egg" ? ["egg", "tofu", "veg"].includes(r.protein) : r.protein === P0.f);
    if (P0.q) list = list.filter(r => (r.name + " " + r.en).toLowerCase().includes(P0.q.toLowerCase()));
    const rows = list.map(r => {
      const delta = totals({ days: S.plan.days.map((d, i) => i === P0.di ? { ...d, [P0.slot]: r.id } : d) }).toBuy - base;
      const fr = r.ing.filter(([k]) => fridge.has(k)).length;
      return { r, delta, fr };
    }).sort((a, b) => (b.fr - a.fr) || (a.delta - b.delta));
    const F = P0.slot === "sayur" ? [] : [["all", "All"], ["chicken", "Ayam"], ["fish", "Ikan"], ["seafood", "Udang & sotong"], ["beef", "Daging"], ["egg", "Telur & tauhu"]];
    const root = document.getElementById("sheetRoot");
    const html = `<div class="scrim open" id="scrim"></div><div class="sheet open" role="dialog" aria-modal="true" aria-labelledby="pk-t"><div class="sheet-in">
      <div class="grab"></div><button class="icon-btn close" id="shClose" aria-label="Close">${ic("x", 18)}</button>
      <h2 id="pk-t">Change ${P0.slot === "sayur" ? "sayur" : P0.slot === "onepot" ? "one-pot" : "lauk"}</h2>
      <p class="sub" style="margin:4px 0 12px">${DAYS_LONG[P0.di]} · now ${esc(cur.name)}. Price change is for the whole week's shopping.</p>
      <div class="search-wrap">${ic("search")}<input class="search" id="pkq" type="search" placeholder="Search dishes" value="${esc(P0.q)}" aria-label="Search dishes"></div>
      ${F.length ? `<div class="chips" role="group">${F.map(([k, l]) => `<button class="chip" data-pkf="${k}" aria-pressed="${P0.f === k}">${l}</button>`).join("")}</div>` : ""}
      <button class="btn big" id="pkRandom" style="margin-bottom:12px">${ic("swap")}Surprise me</button>
      <div class="rlist" style="grid-template-columns:1fr">${rows.map(({ r, delta, fr }) => `<button class="rrow" data-pkid="${r.id}"><div><div class="n">${esc(r.name)}${r.spicy >= 2 ? ' <span class="pedas">•</span>' : ""}</div><div class="e">${esc(r.en)} · ${r.mins} min · ${r.macro[0]} kcal</div>${fr || verdicts(r.id).length ? `<div class="vtags" style="margin-top:6px">${fr ? `<span class="tag ok">${ic("fridge", 12)}Uses ${fr} from your fridge</span> ` : ""}${verdictTags(r.id)}</div>` : ""}</div><div class="m"><div style="font-weight:600;color:${Math.abs(delta) < 0.005 ? "var(--fg2)" : delta < 0 ? "var(--pos)" : "var(--fg)"}">${Math.abs(delta) < 0.005 ? "Same price" : (delta < 0 ? "−" : "+") + rm(Math.abs(delta))}</div></div></button>`).join("") || `<div class="sub" style="padding:12px 0">No other dishes match</div>`}</div>
    </div></div>`;
    const y = root.querySelector(".sheet") ? root.querySelector(".sheet").scrollTop : 0;
    root.innerHTML = html; root.querySelector(".sheet").scrollTop = y;

    document.getElementById("scrim").onclick = close; document.getElementById("shClose").onclick = close;
    root.querySelectorAll("[data-pkf]").forEach(b => b.onclick = () => { S.pick.f = b.dataset.pkf; renderPicker(); });
    root.querySelectorAll("[data-pkid]").forEach(b => b.onclick = () => { day[P0.slot] = b.dataset.pkid; save(); close(); render(); toast(`Changed to ${RX[b.dataset.pkid].name}`); });
    document.getElementById("pkRandom").onclick = () => { close(); swap(P0.di, P0.slot); };
    const q = document.getElementById("pkq");
    q.oninput = () => { S.pick.q = q.value; const pos = q.selectionStart; renderPicker(); const n = document.getElementById("pkq"); n.focus(); n.setSelectionRange(pos, pos); };
  }

  function viewShop() {
    const t = totals(S.plan);
    const fresh = t.rows.filter(r => !r.pantry), pantry = t.rows.filter(r => r.pantry);
    const needP = pantry.filter(r => S.pantryNeed[r.k]);
    const all = [...fresh.filter(r => r.buy), ...needP];
    const got = all.filter(r => S.bought[r.k]).length;
    const spent = all.filter(r => S.bought[r.k]).reduce((s, r) => s + r.cost, 0);
    const groups = {};
    const covered = fresh.filter(r => !r.buy);

  // ---------- sound (Web Audio, no files) ----------
  const SFX = (() => {
    let ctx = null;
    const on = () => S.settings.sound !== false;
    const ac = () => { try { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === "suspended") ctx.resume(); } catch (e) { ctx = null; } return ctx; };
    function tone(f, start, dur, vol = 0.07, type = "sine") {
      const c = ac(); if (!c) return;
      const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + start;
      o.type = type; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
    }
    let alarmTimer = null;
    return {
      unlock: ac,
      tap() { if (on()) { tone(980, 0, 0.035, 0.028, "triangle"); } },
      tick() { if (on()) { tone(1320, 0, 0.07, 0.05, "triangle"); } },
      untick() { if (on()) { tone(660, 0, 0.06, 0.035, "triangle"); } },
      step() { if (on()) { tone(587, 0, 0.09, 0.05); tone(784, 0.07, 0.12, 0.05); } },
      done() { if (on()) { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.11, 0.35, 0.06)); } },
      alarm(start) {
        if (!start) { clearInterval(alarmTimer); alarmTimer = null; return; }
        if (alarmTimer || !on()) return;
        const ring = () => { tone(880, 0, 0.18, 0.12); tone(1175, 0.2, 0.18, 0.12); tone(880, 0.4, 0.18, 0.12); };
        ring(); alarmTimer = setInterval(ring, 1600);
      },
    };
  })();

  // ---------- motion (GSAP when available, respects reduced motion) ----------
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const G = !reduce && window.gsap ? window.gsap : null;
  const EASE = "power3.out";
  const tweenMem = {};
  function captureTweens() {
    document.querySelectorAll("[data-tw]").forEach(el => { tweenMem[el.dataset.tw] = { s: +el.dataset.s || 0, v: +el.dataset.v || 0 }; });
  }
  function playTweens(enter) {
    if (!G) return;
    if (enter) G.from(".enter > *, .enter .side > *", { y: 8, opacity: 0, duration: 0.4, stagger: { each: 0.05, amount: 0.25 }, ease: EASE, clearProps: "transform,opacity" });
    document.querySelectorAll("[data-tw]").forEach(el => {
      const prev = tweenMem[el.dataset.tw]; if (!prev) return;
      if (el.dataset.s !== undefined && prev.s !== +el.dataset.s) G.fromTo(el, { scaleX: prev.s }, { scaleX: +el.dataset.s, duration: 0.5, ease: EASE });
      if (el.dataset.v !== undefined && prev.v !== +el.dataset.v) {
        const o = { v: prev.v }, fmt = el.dataset.fmt === "int" ? (x => String(Math.round(x))) : (x => rm(x));
        G.to(o, { v: +el.dataset.v, duration: 0.5, ease: EASE, onUpdate: () => { el.textContent = fmt(o.v); } });
      }
    });
  }
  const pop = el => { if (G && el) G.fromTo(el, { scale: 0.9 }, { scale: 1, duration: 0.2, ease: EASE }); };

  // ---------- cooking mode: one combined dinner run ----------
  let C = null; // { ids, day, steps, step (-1 get ready, steps.length done), timers, prepped, started, dir }
  let wakeLock = null;
  function buildRun(ids, day) {
    const n = S.settings.people, sc = scale(), steps = [];
    const withRice = day != null && !S.plan.days[day].onepot;
    if (withRice) steps.push({ dish: "rice", t: `Rinse ${qty(RICE_PER_PERSON * n, "g", "rice")} rice and start the rice cooker`, ing: [["rice", RICE_PER_PERSON * n]], sec: 0 });
    const fromGuide = r => r.guide.map(st => ({ dish: r.id, t: st.t, ing: st.ing.map(k => [k, r.ing.find(x => x[0] === k)[1] * sc]), sec: st.sec, cue: st.cue || "" }));
    const main = RX[ids[0]], side = ids[1] ? RX[ids[1]] : null;
    const ms = fromGuide(main);
    if (side) {
      const prep = { dish: side.id, parallel: true, t: `While that cooks, wash and cut what you need for the ${side.name.toLowerCase()}`, ing: side.ing.filter(([k]) => !ING[k].pantry).map(([k, q]) => [k, q * sc]), sec: 0 };
      let at = -1, longest = 0; ms.forEach((s, i) => { if (s.sec > longest) { longest = s.sec; at = i; } });
      if (longest >= 300) ms.splice(at + 1, 0, prep); else ms.push(prep);
      steps.push(...ms, ...fromGuide(side));
    } else steps.push(...ms);
    return steps;
  }
  function startCooking(ids, day) {
    closeSheet(); SFX.unlock();
    C = { ids, day, steps: buildRun(ids, day), step: -1, timers: {}, prepped: {}, started: null, dir: 1 };
    C.clock = setInterval(cookTick, 250);
    try { navigator.wakeLock && navigator.wakeLock.request("screen").then(l => { wakeLock = l; }).catch(() => {}); } catch (e) {}
    renderCook();
  }
  function stopCooking() {
    if (C && C.clock) clearInterval(C.clock);
    SFX.alarm(false);
    C = null; document.getElementById("cookRoot").innerHTML = "";
    try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null;
    document.body.style.overflow = "";
  }
  function cookTick() {
    if (!C) return;
    let ringing = false, changed = false;
    for (const [i, t] of Object.entries(C.timers)) {
      if (t.running) {
        t.left = Math.max(0, Math.round((t.end - Date.now()) / 1000));
        if (t.left === 0) { t.running = false; t.rang = true; changed = true; try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {} }
      }
      if (t.rang && !t.acked) ringing = true;
      document.querySelectorAll(`[data-tclock="${i}"]`).forEach(el => { el.textContent = fmtClock(t.left); });
    }
    SFX.alarm(ringing);
    const el = document.getElementById("elapsed"); if (el && C.started) el.textContent = fmtClock(Math.floor((Date.now() - C.started) / 1000));
    if (changed) renderCook(true);
  }
  const dishLabel = s => s.dish === "rice" ? "Rice" : RX[s.dish].name;
  const dishKind = s => s.dish === "rice" ? "rice" : RX[s.dish].kind;
  function renderCook(keep) {
    const root = document.getElementById("cookRoot");
    if (!C) return;
    document.body.style.overflow = "hidden";
    const n = S.settings.people, total = C.steps.length;
    const names = C.ids.map(id => RX[id].name).join(" + ");
    const est = Math.max(...C.ids.map(id => RX[id].mins)) + (C.ids.length > 1 ? 10 : 0);
    const elapsed = C.started ? `<span class="tag ok" style="height:28px;font-size:14px;padding:0 10px">${ic("clock", 14)}<span id="elapsed">${fmtClock(Math.floor((Date.now() - C.started) / 1000))}</span>&nbsp;/ ~${est} min</span>` : `<span class="tag">About ${est} min</span>`;
    const segs = `<div class="segs">${[-1, ...C.steps.map((_, i) => i)].map(i => `<i class="${i <= C.step ? "on" : ""}"></i>`).join("")}</div>`;
    const other = Object.entries(C.timers).filter(([i, t]) => +i !== C.step && (t.running || (t.rang && !t.acked)));
    const strip = other.length ? `<div class="tstrip">${other.map(([i, t]) => `<button class="tchip ${t.rang ? "ring" : ""}" data-jump="${i}">${ic(t.rang ? "flame" : "clock", 14)}${esc(dishLabel(C.steps[i]))} · step ${+i + 1}<b data-tclock="${i}">${fmtClock(t.left)}</b></button>`).join("")}</div>` : "";
    const sound = `<button class="icon-btn" id="ckSound" aria-label="${S.settings.sound === false ? "Turn sound on" : "Mute sound"}" aria-pressed="${S.settings.sound !== false}">${ic(S.settings.sound === false ? "mute" : "sound", 18)}</button>`;
    let body, foot;
    if (C.step === -1) {
      const merged = {};
      C.steps.forEach(s => s.ing.forEach(([k, q]) => { merged[k] = Math.max(merged[k] || 0, 0); }));
      C.ids.forEach(id => RX[id].ing.forEach(([k, q]) => { merged[k] = (merged[k] || 0) + q * scale(); }));
      if (C.steps[0] && C.steps[0].dish === "rice") merged.rice = RICE_PER_PERSON * n;

    if (el.id === "leave") { A.confirmLeave = true; render(); setTimeout(() => { A.confirmLeave = false; }, 4000); return; }
    if (el.id === "leaveYes") { A.confirmLeave = false; return signOut(false); }
    if (el.id === "savehood") { const name = (S.hoodDraft || "").trim(), b = lookupPostcode(s.postcode); if (name.length >= 3 && b) { s.hood = { pc: s.postcode, name, lat: b.lat, lng: b.lng }; S.typingHood = false; S.hoodDraft = ""; save(); render(); } return; }
    if (el.dataset.hide !== undefined) { e.preventDefault(); const i = +el.dataset.hide; s.hidden = s.hidden || {}; s.hidden[i] = true; if (s.shop === -3 && s.osm === i) s.shop = -1; save(); render(); toast("Hidden. It won't be listed again"); return; }
    if (el.id === "logo") { if (!S.onboarded) { S.ob = -1; render(); } else go("week"); return; }
    if (el.id === "guideOk") { S.guideSeen = true; save(); const g = document.querySelector(".guide"); if (G && g) G.to(g, { opacity: 0, y: -6, duration: 0.25, ease: EASE, onComplete: render }); else render(); return; }
    if (el.id === "obBack") { S.ob = Math.max(-1, S.ob - 1); render(); return window.scrollTo({ top: 0 }); }
    if (el.id === "obNext") {

      S.onboarded = true; newWeek(); return go("week");

  document.addEventListener("change", e => {
    const t = e.target, s = S.settings;
    if (t.dataset.bought) { captureTweens(); if (t.checked) S.bought[t.dataset.bought] = CLOUD ? { by: myName(), at: Date.now() } : true; else delete S.bought[t.dataset.bought]; save(); render(); pop(document.querySelector(`[data-bought="${t.dataset.bought}"]`));
      const allDone = t.checked && document.querySelectorAll("[data-bought]").length && !document.querySelectorAll("[data-bought]:not(:checked)").length;
