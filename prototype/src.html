<title>MasakJe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one phone-width column, receipt card as the single rich moment, quiet tab bar at the bottom.
   Direction — Product: plans a week of home dinners for a 2–4 person Malaysian household and prices the list at real local shops.
   Character: thrifty, homely, exact. World: wet market stall and kitchen counter, banana leaf and receipt paper.
   Moment: the weekly receipt with masak vs tapau. Signature: dotted price leaders, like a printed receipt. */
:root {
  --bg: #f3f4f0; --card: #ffffff; --raised: #eaece6; --line: rgba(26, 29, 25, 0.10);
  --fg: #1a1d19; --fg2: #4d544b; --muted: #656c62;
  --accent: #2c6a3f; --accent-ink: #ffffff; --accent-soft: rgba(44, 106, 63, 0.10);
  --neg: #b8382a; --paper: #fffffc; --shadow: rgba(20, 24, 18, 0.10);
  --font: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121411; --card: #1a1c19; --raised: #242722; --line: rgba(236, 239, 233, 0.10);
    --fg: #eceee9; --fg2: #aab1a7; --muted: #8b9288;
    --accent: #79c58f; --accent-ink: #0e1a11; --accent-soft: rgba(121, 197, 143, 0.14);
    --neg: #e8705f; --paper: #1d201c; --shadow: rgba(0, 0, 0, 0.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121411; --card: #1a1c19; --raised: #242722; --line: rgba(236, 239, 233, 0.10);
  --fg: #eceee9; --fg2: #aab1a7; --muted: #8b9288;
  --accent: #79c58f; --accent-ink: #0e1a11; --accent-soft: rgba(121, 197, 143, 0.14);
  --neg: #e8705f; --paper: #1d201c; --shadow: rgba(0, 0, 0, 0.4); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--fg); font: 400 15px/22px var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.app { max-width: 560px; margin: 0 auto; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 56px; }
.logo { font-weight: 600; font-size: 18px; letter-spacing: 0; display: flex; align-items: center; gap: 8px; }
.logo svg { color: var(--accent); }
.where { display: inline-flex; align-items: center; gap: 6px; min-width: 0; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg2); font-size: 13px; transition: background-color 150ms var(--ease); }
.where span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.where:hover { background: var(--raised); }

h1 { font-size: 28px; line-height: 1.15; font-weight: 500; margin: 16px 0 4px; text-wrap: balance; }
.sub { color: var(--fg2); font-size: 14px; margin: 0 0 20px; }
.sub a, .link { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; background: none; border: 0; padding: 0; font-size: inherit; }

.note { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-soft); color: var(--fg); border-radius: 10px; padding: 12px; font-size: 14px; margin-bottom: 16px; }
.note svg { flex: none; color: var(--accent); margin-top: 2px; }

/* receipt */
.receipt-wrap { filter: drop-shadow(0 1px 1px var(--shadow)) drop-shadow(0 6px 16px var(--shadow)); margin-bottom: 28px; }
.receipt {
  background: var(--paper); border-radius: 14px 14px 0 0; padding: 20px 20px 28px;
  -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - 8px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 16px 8px repeat-x;
          mask: linear-gradient(#000 0 0) top / 100% calc(100% - 8px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 16px 8px repeat-x;
}
.r-head { display: flex; justify-content: space-between; gap: 12px; font-family: var(--mono); font-size: 12px; line-height: 16px; color: var(--muted); margin-bottom: 16px; }
.r-head span:last-child { text-align: right; }
.lead-row { display: flex; align-items: baseline; gap: 8px; font-size: 14px; line-height: 24px; }
.lead-row .l { color: var(--fg2); white-space: nowrap; }
.lead-row .dots { flex: 1; min-width: 12px; border-bottom: 1.5px dotted var(--muted); opacity: 0.6; transform: translateY(-4px); }
.lead-row .v { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.r-rule { border: 0; border-top: 1.5px dashed var(--line); margin: 12px 0; }
.r-big { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.r-big .l { font-size: 14px; color: var(--fg2); }
.r-big .v { font-family: var(--mono); font-size: 30px; line-height: 1; font-weight: 500; font-variant-numeric: tabular-nums; }
.r-big .v small { font-size: 14px; color: var(--muted); font-weight: 400; }
.compare { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 8px 12px; margin-top: 20px; font-size: 13px; }
.compare .track { height: 10px; border-radius: 5px; background: var(--raised); overflow: hidden; }
.compare .bar { height: 100%; border-radius: 5px; background: var(--fg2); transition: transform 400ms var(--ease); transform-origin: left; }
.compare .bar.masak { background: var(--accent); }
.compare .v { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--fg2); text-align: right; }
.keep { margin-top: 16px; font-size: 15px; }
.keep b { font-weight: 600; color: var(--accent); }
.budget { margin-top: 4px; font-size: 13px; color: var(--muted); }
.budget.over { color: var(--neg); }

/* days */
.section-h { display: flex; justify-content: space-between; align-items: center; margin: 0 0 12px; }
.section-h h2 { font-size: 17px; font-weight: 500; margin: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font-size: 14px; font-weight: 500; transition: background-color 150ms var(--ease), transform 120ms var(--ease); }
.btn:hover { background: var(--raised); }
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent); filter: brightness(1.06); }
.btn.big { height: 48px; width: 100%; font-size: 15px; }
.days { display: grid; gap: 8px; }
.day { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 12px 16px; display: grid; grid-template-columns: 44px 1fr; gap: 12px; }
.day.off { background: transparent; border-style: dashed; }
.dlabel { font-size: 13px; line-height: 18px; color: var(--muted); padding-top: 4px; }
.dlabel b { display: block; font-weight: 500; font-size: 15px; color: var(--fg); }
.dishes { display: grid; gap: 4px; min-width: 0; }
.dish { display: grid; grid-template-columns: 1fr auto 32px; align-items: center; gap: 8px; min-height: 44px; }
.dish-main { min-width: 0; text-align: left; background: none; border: 0; padding: 4px 0; border-radius: 6px; }
.dish-main .n { display: block; font-weight: 500; font-size: 15px; line-height: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dish-main .e { display: block; font-size: 13px; line-height: 18px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dish .c { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--fg2); }
.icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; border: 0; background: transparent; color: var(--muted); transition: background-color 150ms var(--ease), color 150ms var(--ease); }
.icon-btn:hover { background: var(--raised); color: var(--fg); }
.day-foot { grid-column: 2; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; font-size: 13px; color: var(--muted); }
.day-foot .link { color: var(--fg2); text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
.day-foot .link:hover { color: var(--fg); }
.off-msg { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; min-height: 44px; }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 5px; background: var(--raised); color: var(--fg2); font-size: 12px; line-height: 16px; white-space: nowrap; }
.pedas { color: var(--neg); }

/* shopping list */
.group { margin-bottom: 24px; }
.group h3 { font-size: 13px; font-weight: 500; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; }
.list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.item { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px 14px; min-height: 52px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
.item .n { font-size: 15px; line-height: 20px; }
.item .q { font-size: 13px; color: var(--muted); line-height: 18px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.item .p { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 14px; text-align: right; }
.item.done .n, .item.done .p { color: var(--muted); text-decoration: line-through; }
.src-shop { background: var(--accent-soft); color: var(--accent); }
.totals { position: sticky; bottom: calc(68px + env(safe-area-inset-bottom, 0px)); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 8px 24px var(--shadow); }
.totals .v { font-family: var(--mono); font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }

/* recipes */
.search { width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); padding: 0 14px 0 40px; font-size: 15px; }
.search-wrap { position: relative; margin-bottom: 12px; }
.search-wrap svg { position: absolute; left: 12px; top: 13px; color: var(--muted); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; scrollbar-width: none; }
.chip { flex: none; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg2); font-size: 14px; transition: background-color 150ms var(--ease); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: transparent; }
.rlist { display: grid; gap: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.rrow { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; width: 100%; transition: background-color 150ms var(--ease); }
.rrow:first-child { border-top: 0; }
.rrow:hover { background: var(--raised); }
.rrow .n { font-weight: 500; }
.rrow .e { font-size: 13px; color: var(--muted); }
.rrow .m { text-align: right; font-size: 13px; color: var(--fg2); line-height: 18px; }

/* setup */
.field { margin-bottom: 20px; }
.field > label, .field > .lbl { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
.field .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button { min-width: 44px; height: 40px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); font-size: 15px; transition: background-color 150ms var(--ease); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: transparent; }
.inp { width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); padding: 0 12px; font-size: 15px; }
.money { position: relative; }
.money span { position: absolute; left: 12px; top: 11px; color: var(--muted); font-family: var(--mono); }
.money .inp { padding-left: 44px; font-family: var(--mono); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fine { font-size: 13px; color: var(--muted); line-height: 20px; margin: 24px 0 0; }

/* tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; background: none; color: var(--muted); font-size: 12px; line-height: 16px; transition: color 150ms var(--ease); }
.tab[aria-current="page"] { color: var(--accent); }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(10, 12, 9, 0.4); z-index: 20; opacity: 0; transition: opacity 200ms var(--ease); }
.scrim.open { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 88vh; overflow-y: auto; background: var(--card); border-radius: 18px 18px 0 0; padding: 8px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); transform: translateY(16px); opacity: 0; transition: transform 300ms var(--ease), opacity 300ms var(--ease); }
.sheet.open { transform: none; opacity: 1; }
.sheet-in { max-width: 560px; margin: 0 auto; }
.grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 12px; }
.sheet h2 { font-size: 24px; line-height: 1.2; font-weight: 500; margin: 0 0 4px; }
.sheet .meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 20px; }
.sheet h3 { font-size: 15px; font-weight: 500; margin: 20px 0 8px; }
.ing { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.ing:first-of-type { border-top: 0; }
.ing .q { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--fg2); }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 10px; font-size: 15px; }
.steps li::marker { font-family: var(--mono); color: var(--muted); }
.close { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 12px; }

.enter { animation: rise 360ms var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 380px) { .day { grid-template-columns: 1fr; } .day-foot { grid-column: 1; } .dlabel b { display: inline; margin-right: 6px; } }
</style>

<div class="app">
  <header class="top">
    <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11h18"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 4v3"/><path d="M8.5 5.5l1 2.2"/><path d="M15.5 5.5l-1 2.2"/></svg>MasakJe</div>
    <button class="where" id="where" type="button"></button>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="tabs-in" id="tabs"></div></nav>
<div id="sheetRoot"></div>

<script>
const DATA = /*__DATA__*/null;
(() => {
  const ING = DATA.ingredients, RECIPES = DATA.recipes, PR = DATA.prices;
  const RX = Object.fromEntries(RECIPES.map(r => [r.id, r]));
  const KEYIDX = Object.fromEntries(PR.keys.map((k, i) => [k, i]));
  const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const RICE_PER_PERSON = 80;
  const STORE = "masakje.proto.v1";

  // ---------- icons (lucide, 1.5 stroke) ----------
  const P = {
    swap: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
    week: '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>',
    list: '<path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>',
    book: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
    sliders: '<path d="M21 4h-7"/><path d="M10 4H3"/><path d="M21 12h-9"/><path d="M8 12H3"/><path d="M21 20h-5"/><path d="M12 20H3"/><path d="M14 2v4"/><path d="M8 10v4"/><path d="M16 18v4"/>',
    pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
    search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    utensils: '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
    store: '<path d="M2 7l2-4h16l2 4"/><path d="M4 7v13h16V7"/><path d="M2 7h20"/><path d="M9 20v-6h6v6"/>',
    info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
    clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  };
  const ic = (n, s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const rm = v => "RM\u00a0" + (Math.round(v * 100) / 100).toFixed(2);
  const rm0 = v => "RM\u00a0" + Math.round(v);

  // ---------- state ----------
  const DEFAULTS = { people: 3, nights: [true, true, true, true, true, true, false], budget: 150, tapau: 9,
    state: "Selangor", district: "Petaling", shop: -1, avoid: { beef: false, mutton: false, seafood: false, pedas: false } };
  let S = { settings: JSON.parse(JSON.stringify(DEFAULTS)), plan: null, bought: {}, pantryNeed: {}, tab: "week", isExample: true, filter: "all", q: "" };
  try { const raw = localStorage.getItem(STORE); if (raw) Object.assign(S, JSON.parse(raw), { tab: "week" }); } catch (e) {}
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify({ settings: S.settings, plan: S.plan, bought: S.bought, pantryNeed: S.pantryNeed, isExample: S.isExample })); } catch (e) {} };

  // ---------- prices ----------
  function area() {
    const st = PR.states[S.settings.state]; const d = st && st.d[S.settings.district];
    return { st, d, shop: d && S.settings.shop >= 0 ? d.shops[S.settings.shop] : null };
  }
  function price(key) {
    const it = ING[key]; const i = KEYIDX[key]; const a = area();
    const pick = (arr, src) => (arr && i !== undefined && arr[i] != null) ? { per: arr[i], src } : null;
    const hit = (a.shop && pick(a.shop[2], "Shop")) || (a.d && pick(a.d.m, "District")) || (a.st && pick(a.st.m, "State")) || pick(PR.national, "Malaysia") || { per: it.fallback, src: "Estimate" };
    return { unit: hit.per / it.size, src: hit.src };
  }
  function priceLabel() {
    const a = area();
    if (a.shop) return a.shop[0];
    return `${S.settings.district} average`;
  }

  // ---------- costing ----------
  const scale = () => S.settings.people / 4;
  function dishCost(r) { return r.ing.reduce((s, [k, q]) => s + q * scale() * price(k).unit, 0); }
  function dayItems(day) {
    if (day.off) return [];
    if (day.onepot) return [RX[day.onepot]];
    return [RX[day.lauk], RX[day.sayur]].filter(Boolean);
  }
  function dayCost(day) {
    if (day.off) return 0;
    let c = dayItems(day).reduce((s, r) => s + dishCost(r), 0);
    if (!day.onepot) c += RICE_PER_PERSON * S.settings.people * price("rice").unit;
    return c;
  }
  function aggregate(plan) {
    const agg = {};
    for (const day of plan.days) {
      if (day.off) continue;
      for (const r of dayItems(day)) for (const [k, q] of r.ing) agg[k] = (agg[k] || 0) + q * scale();
      if (!day.onepot) agg.rice = (agg.rice || 0) + RICE_PER_PERSON * S.settings.people;
    }
    return agg;
  }
  function totals(plan) {
    const agg = aggregate(plan); let fresh = 0, pantryUse = 0, pantryBuy = 0; const rows = [];
    for (const [k, q] of Object.entries(agg)) {
      const it = ING[k], p = price(k);
      if (it.pantry) {
        pantryUse += q * p.unit;
        const packs = Math.max(1, Math.ceil(q / it.pack - 1e-9)), cost = packs * it.pack * p.unit;
        if (S.pantryNeed[k]) pantryBuy += cost;
        rows.push({ k, it, q, buy: packs * it.pack, cost, src: p.src, pantry: true });
      } else {
        const packs = Math.ceil(q / it.pack - 1e-9), cost = packs * it.pack * p.unit;
        fresh += cost; rows.push({ k, it, q, buy: packs * it.pack, cost, src: p.src, pantry: false });
      }
    }
    const nights = plan.days.filter(d => !d.off).length;
    const plates = nights * S.settings.people;
    return { rows, fresh, pantryUse, pantryBuy, toBuy: fresh + pantryBuy, plates, nights,
      perPlate: plates ? (fresh + pantryUse) / plates : 0, tapau: plates * S.settings.tapau };
  }

  // ---------- planner ----------
  function allowed(r) {
    const a = S.settings.avoid;
    if (a.beef && r.protein === "beef") return false;
    if (a.mutton && r.protein === "mutton") return false;
    if (a.seafood && (r.protein === "seafood")) return false;
    if (a.pedas && r.spicy >= 2) return false;
    return true;
  }
  const pool = kind => RECIPES.filter(r => r.kind === kind && allowed(r));
  const rand = arr => arr[Math.floor(Math.random() * arr.length)];
  function randomPlan() {
    const lauk = pool("lauk"), sayur = pool("sayur"), one = pool("onepot");
    const used = new Set(); let prev = null, onepots = 0, red = 0; const days = [];
    for (let i = 0; i < 7; i++) {
      if (!S.settings.nights[i]) { days.push({ off: true }); continue; }
      if (one.length && onepots < 2 && Math.random() < 0.2) {
        const r = rand(one.filter(x => !used.has(x.id)));
        if (r) { used.add(r.id); onepots++; prev = r.protein; days.push({ onepot: r.id }); continue; }
      }
      let c = lauk.filter(x => !used.has(x.id) && x.protein !== prev && !((x.protein === "beef" || x.protein === "mutton") && red >= 2));
      if (!c.length) c = lauk.filter(x => !used.has(x.id));
      const l = rand(c); used.add(l.id); prev = l.protein; if (l.protein === "beef" || l.protein === "mutton") red++;
      const s = rand(sayur.filter(x => !used.has(x.id))) || rand(sayur); used.add(s.id);
      days.push({ lauk: l.id, sayur: s.id });
    }
    return { days };
  }
  function score(plan) {
    const t = totals(plan), b = S.settings.budget;
    const proteins = new Set(plan.days.flatMap(d => dayItems(d).filter(r => r.kind !== "sayur").map(r => r.protein))).size;
    if (t.toBuy > b) return 1000 + (t.toBuy - b);
    return -proteins * 3 + t.toBuy * 0.3 + Math.random() * 4;
  }
  function makePlan() {
    let best = null, bs = Infinity;
    for (let i = 0; i < 250; i++) { const p = randomPlan(), s = score(p); if (s < bs) { bs = s; best = p; } }
    return best;
  }
  function swap(di, slot) {
    const day = S.plan.days[di]; const cur = day[slot]; const kind = slot === "onepot" ? "onepot" : slot;
    const inPlan = new Set(S.plan.days.flatMap(d => [d.lauk, d.sayur, d.onepot]).filter(Boolean));
    const cands = pool(kind).filter(r => !inPlan.has(r.id));
    if (!cands.length) return;
    const order = cands.sort(() => Math.random() - 0.5);
    let pick = order[0];
    for (const r of order) { const t = totals({ days: S.plan.days.map((d, i) => i === di ? { ...d, [slot]: r.id } : d) }); if (t.toBuy <= S.settings.budget) { pick = r; break; } }
    day[slot] = pick.id; save(); render();
  }
  function toggleOff(di) {
    const day = S.plan.days[di];
    if (day.off) {
      const inPlan = new Set(S.plan.days.flatMap(d => [d.lauk, d.sayur, d.onepot]).filter(Boolean));
      S.plan.days[di] = { lauk: (rand(pool("lauk").filter(r => !inPlan.has(r.id))) || rand(pool("lauk"))).id, sayur: (rand(pool("sayur").filter(r => !inPlan.has(r.id))) || rand(pool("sayur"))).id };
    } else S.plan.days[di] = { off: true };
    save(); render();
  }

  // ---------- formatting ----------
  function qty(q, unit, key) {
    if (unit === "pc") {
      const n = key === "egg" ? Math.ceil(q - 1e-9) : Math.max(1, Math.round(q));
      const word = { egg: "eggs", lemongrass: "stalks", curry_leaves: "sprigs", lime: "pcs", tofu: "pcs", tempe: "packs" }[key] || "pcs";
      return `${n} ${word}`;
    }
    const base = unit === "g" ? ["g", "kg"] : ["ml", "L"];
    if (q >= 1000) return `${(Math.round(q / 100) / 10).toString()} ${base[1]}`;
    const r = q >= 50 ? Math.round(q / 10) * 10 : Math.max(1, Math.round(q / 5) * 5);
    return `${r} ${base[0]}`;
  }
  function weekStart() {
    const d = new Date(); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); return d;
  }
  const dateOf = i => { const d = weekStart(); d.setDate(d.getDate() + i); return d; };
  const fmtDate = d => d.toLocaleDateString("en-MY", { day: "numeric", month: "short" });

  // ---------- views ----------
  function viewWeek() {
    const t = totals(S.plan), b = S.settings.budget, diff = b - t.toBuy;
    const max = Math.max(t.toBuy + t.pantryUse, t.tapau, 1);
    const masakW = (t.toBuy + t.pantryUse) / max, tapauW = t.tapau / max;
    const keep = t.tapau - (t.fresh + t.pantryUse);
    const example = S.isExample ? `<div class="note">${ic("info")}<div>This is an example week for ${S.settings.people} people in ${esc(S.settings.district)}. <button class="link" data-go="setup">Set your household and area</button></div></div>` : "";
    const days = S.plan.days.map((d, i) => {
      const dl = `<div class="dlabel"><b>${DAYS[i]}</b>${dateOf(i).getDate()}</div>`;
      if (d.off) return `<div class="day off">${dl}<div class="off-msg"><span>Not cooking</span><button class="btn" data-off="${i}">Plan a dinner</button></div></div>`;
      const row = (r, slot) => `<div class="dish"><button class="dish-main" data-recipe="${r.id}"><span class="n">${esc(r.name)}${r.spicy >= 2 ? ' <span class="pedas" title="Pedas">•</span>' : ""}</span><span class="e">${esc(r.en)}</span></button><span class="c">${rm(dishCost(r))}</span><button class="icon-btn" aria-label="Swap ${esc(r.name)}" data-swap="${i}:${slot}">${ic("swap")}</button></div>`;
      const body = d.onepot ? row(RX[d.onepot], "onepot") : row(RX[d.lauk], "lauk") + row(RX[d.sayur], "sayur");
      return `<div class="day">${dl}<div class="dishes">${body}</div><div class="day-foot"><span>${d.onepot ? "One-pot" : "With rice"} · <span class="num">${rm(dayCost(d) / S.settings.people)}</span>/plate</span><button class="link" data-off="${i}">${ic("utensils", 14)}Skip</button></div></div>`;
    }).join("");
    return `<div class="enter">
      <h1>Week of ${fmtDate(weekStart())}</h1>
      <p class="sub">${t.nights} dinners for ${S.settings.people}, priced at ${esc(priceLabel())}</p>
      ${example}
      <div class="receipt-wrap"><div class="receipt">
        <div class="r-head"><span>MASAKJE · ${esc(S.settings.district.toUpperCase())}</span><span>${t.plates} plates</span></div>
        <div class="lead-row"><span class="l">Groceries to buy</span><span class="dots"></span><span class="v">${rm(t.fresh)}</span></div>
        ${t.pantryBuy ? `<div class="lead-row"><span class="l">Pantry restock</span><span class="dots"></span><span class="v">${rm(t.pantryBuy)}</span></div>` : ""}
        <div class="lead-row"><span class="l">Pantry used, already at home</span><span class="dots"></span><span class="v">${rm(t.pantryUse)}</span></div>
        <hr class="r-rule">
        <div class="r-big"><span class="l">Cost a plate</span><span class="v">${rm(t.perPlate)}</span></div>
        <div class="compare" role="img" aria-label="Cooking ${rm(t.fresh + t.pantryUse)} versus tapau ${rm(t.tapau)}">
          <span>Masak</span><div class="track"><div class="bar masak" style="transform:scaleX(${masakW.toFixed(3)})"></div></div><span class="v">${rm0(t.fresh + t.pantryUse)}</span>
          <span>Tapau</span><div class="track"><div class="bar" style="transform:scaleX(${tapauW.toFixed(3)})"></div></div><span class="v">${rm0(t.tapau)}</span>
        </div>
        <div class="keep">${keep > 0 ? `You keep <b class="num">${rm0(keep)}</b> vs buying ${t.plates} plates at ${rm(S.settings.tapau)}` : `Tapau is cheaper this week at ${rm(S.settings.tapau)} a plate`}</div>
        <div class="budget ${diff < 0 ? "over" : ""}">${diff >= 0 ? `${rm(diff)} under your ${rm0(b)} budget` : `${rm(-diff)} over your ${rm0(b)} budget`}</div>
      </div></div>
      <div class="section-h"><h2>Dinners</h2><button class="btn" id="regen">${ic("swap")}New plan</button></div>
      <div class="days">${days}</div>
    </div>`;
  }

  function viewShop() {
    const t = totals(S.plan);
    const fresh = t.rows.filter(r => !r.pantry), pantry = t.rows.filter(r => r.pantry);
    const groups = {};
    for (const r of fresh) (groups[r.it.aisle] = groups[r.it.aisle] || []).push(r);
    const order = ["Meat & poultry", "Fish & seafood", "Eggs & tofu", "Vegetables", "Onion, garlic & chili", "Noodles", "Dry goods", "Pantry"];
    const srcTag = s => `<span class="tag ${s === "Shop" ? "src-shop" : ""}">${s}</span>`;
    const row = r => {
      const done = !!S.bought[r.k];
      return `<label class="item ${done ? "done" : ""}"><input type="checkbox" id="b-${r.k}" data-bought="${r.k}" ${done ? "checked" : ""}><div><div class="n">${esc(r.it.name)}</div><div class="q"><span class="num">${qty(r.buy, r.it.unit, r.k)}</span>${r.buy - r.q > r.it.pack * 0.25 && r.it.unit !== "pc" ? `<span>· need ${qty(r.q, r.it.unit, r.k)}</span>` : ""}${srcTag(r.src)}</div></div><span class="p">${rm(r.cost)}</span></label>`;
    };
    const sec = order.filter(a => groups[a]).map(a => `<div class="group"><h3><span>${a}</span><span class="num">${rm(groups[a].reduce((s, r) => s + r.cost, 0))}</span></h3><div class="list">${groups[a].sort((x, y) => y.cost - x.cost).map(row).join("")}</div></div>`).join("");
    const prow = r => `<label class="item"><input type="checkbox" id="p-${r.k}" data-need="${r.k}" ${S.pantryNeed[r.k] ? "checked" : ""}><div><div class="n">${esc(r.it.name)}</div><div class="q"><span>uses ${qty(r.q, r.it.unit, r.k)}</span>${srcTag(r.src)}</div></div><span class="p">${S.pantryNeed[r.k] ? rm(r.cost) : '<span style="color:var(--muted)">have</span>'}</span></label>`;
    return `<div class="enter">
      <h1>Shopping list</h1>
      <p class="sub">${fresh.length} items, rounded up to what shops sell. Prices from ${esc(priceLabel())}</p>
      ${sec}
      <div class="group"><h3><span>Pantry check · tick what you need to buy</span></h3><div class="list">${pantry.sort((a, b) => a.it.name.localeCompare(b.it.name)).map(prow).join("")}</div></div>
      <div class="totals"><span>To spend</span><span class="v">${rm(t.toBuy)}</span></div>
      <p class="fine">Shop = this shop's latest PriceCatcher price. District, State and Malaysia = median across shops there. Estimate = not tracked by PriceCatcher, typical price used. Prices are estimates, not quotes.</p>
    </div>`;
  }

  function viewRecipes() {
    const F = [["all", "All"], ["chicken", "Ayam"], ["beef", "Daging"], ["fish", "Ikan"], ["seafood", "Udang & sotong"], ["egg", "Telur & tauhu"], ["sayur", "Sayur"], ["onepot", "One-pot"]];
    const q = S.q.trim().toLowerCase();
    const list = RECIPES.filter(r => {
      const f = S.filter;
      const okF = f === "all" || (f === "sayur" ? r.kind === "sayur" : f === "onepot" ? r.kind === "onepot" : f === "beef" ? (r.protein === "beef" || r.protein === "mutton") && r.kind !== "sayur" : f === "egg" ? (["egg", "tofu", "veg"].includes(r.protein) && r.kind === "lauk") : r.protein === f && r.kind !== "sayur");
      return okF && (!q || (r.name + " " + r.en).toLowerCase().includes(q));
    });
    return `<div class="enter">
      <h1>Recipes</h1>
      <p class="sub">${RECIPES.length} everyday dishes, costed for ${S.settings.people} people</p>
      <div class="search-wrap">${ic("search")}<input class="search" id="q" type="search" placeholder="Search" value="${esc(S.q)}" aria-label="Search recipes"></div>
      <div class="chips" role="group" aria-label="Filter">${F.map(([k, l]) => `<button class="chip" data-filter="${k}" aria-pressed="${S.filter === k}">${l}</button>`).join("")}</div>
      <div class="rlist">${list.map(r => `<button class="rrow" data-recipe="${r.id}"><div><div class="n">${esc(r.name)}${r.spicy >= 2 ? ' <span class="pedas">•</span>' : ""}</div><div class="e">${esc(r.en)}</div></div><div class="m"><div class="num">${rm(dishCost(r) / S.settings.people)}</div><div>${r.mins} min</div></div></button>`).join("") || `<div style="padding:16px;color:var(--muted)">No dishes match</div>`}</div>
    </div>`;
  }

  function viewSetup() {
    const s = S.settings; const states = Object.keys(PR.states).sort();
    const st = PR.states[s.state] || { d: {} }; const dists = Object.keys(st.d).sort();
    const shops = (st.d[s.district] || { shops: [] }).shops;
    const av = [["beef", "Beef"], ["mutton", "Mutton"], ["seafood", "Prawns & squid"], ["pedas", "Very spicy"]];
    return `<div class="enter">
      <h1>Your household</h1>
      <p class="sub">Used to size portions and pick prices near you</p>
      <div class="field"><span class="lbl">People eating dinner</span><div class="seg" role="group">${[1, 2, 3, 4, 5, 6].map(n => `<button data-people="${n}" aria-pressed="${s.people === n}">${n}</button>`).join("")}</div></div>
      <div class="field"><span class="lbl">Nights you cook</span><div class="seg" role="group">${DAYS.map((d, i) => `<button data-night="${i}" aria-pressed="${s.nights[i]}">${d}</button>`).join("")}</div></div>
      <div class="two">
        <div class="field"><label for="budget">Weekly grocery budget</label><div class="money"><span>RM</span><input class="inp" id="budget" type="number" inputmode="decimal" min="20" step="10" value="${s.budget}"></div></div>
        <div class="field"><label for="tapau">Tapau price a plate</label><div class="money"><span>RM</span><input class="inp" id="tapau" type="number" inputmode="decimal" min="3" step="0.5" value="${s.tapau}"></div></div>
      </div>
      <div class="field"><label for="state">State</label><select class="inp" id="state">${states.map(x => `<option ${x === s.state ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></div>
      <div class="field"><label for="district">District</label><select class="inp" id="district">${dists.map(x => `<option ${x === s.district ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></div>
      <div class="field"><label for="shop">Where you shop</label><select class="inp" id="shop"><option value="-1">District average</option>${shops.map((sh, i) => `<option value="${i}" ${i === s.shop ? "selected" : ""}>${esc(sh[0])} · ${esc(sh[1])}</option>`).join("")}</select><div class="hint">Showing the ${shops.length} shops with the most items priced in ${esc(s.district)}</div></div>
      <div class="field"><span class="lbl">Leave out</span><div class="seg" role="group">${av.map(([k, l]) => `<button data-avoid="${k}" aria-pressed="${!!s.avoid[k]}">${l}</button>`).join("")}</div><div class="hint">All dishes are halal</div></div>
      <button class="btn primary big" id="plan">Plan my week</button>
      <p class="fine">Prices: ${esc(PR.source)}, ${PR.shops.toLocaleString()} shops, latest ${PR.date}. Cooked-food prices are no longer collected by PriceCatcher, so the tapau price is your own figure. Recipes are drafts and still need checking by a home cook.</p>
    </div>`;
  }

  function openRecipe(id) {
    const r = RX[id]; if (!r) return;
    const n = S.settings.people;
    const ing = r.ing.map(([k, q]) => { const it = ING[k]; return `<div class="ing"><span>${esc(it.name)}</span><span class="q">${qty(q * scale(), it.unit, k)}</span></div>`; }).join("");
    const root = document.getElementById("sheetRoot");
    root.innerHTML = `<div class="scrim" id="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="sheet-in">
      <div class="grab"></div><button class="icon-btn close" id="shClose" aria-label="Close">${ic("x", 18)}</button>
      <h2 id="sh-t">${esc(r.name)}</h2><div style="color:var(--fg2)">${esc(r.en)}</div>
      <div class="meta"><span class="tag">${ic("clock", 12)}&nbsp;${r.mins} min</span><span class="tag">${esc(r.cuisine)}</span><span class="tag">${r.kind === "lauk" ? "Lauk" : r.kind === "sayur" ? "Sayur" : "One-pot"}</span>${r.spicy >= 2 ? '<span class="tag pedas">Pedas</span>' : r.spicy ? '<span class="tag">Mild heat</span>' : ""}<span class="tag num">${rm(dishCost(r) / n)} a plate</span></div>
      <h3>Ingredients for ${n}</h3>${ing}
      <h3>Method</h3><ol class="steps">${r.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
      <p class="fine">Draft recipe, not yet tested by a home cook</p>
    </div></div>`;
    requestAnimationFrame(() => { document.getElementById("scrim").classList.add("open"); root.querySelector(".sheet").classList.add("open"); });
    const close = () => { root.innerHTML = ""; };
    document.getElementById("scrim").onclick = close; document.getElementById("shClose").onclick = close;
    document.getElementById("shClose").focus();
    root.onkeydown = e => { if (e.key === "Escape") close(); };
  }

  // ---------- render ----------
  const TABS = [["week", "Week", "week"], ["shop", "Shop", "list"], ["recipes", "Recipes", "book"], ["setup", "Setup", "sliders"]];
  function render() {
    if (!S.plan || S.plan.days.length !== 7) S.plan = makePlan();
    const v = document.getElementById("view");
    v.innerHTML = S.tab === "week" ? viewWeek() : S.tab === "shop" ? viewShop() : S.tab === "recipes" ? viewRecipes() : viewSetup();
    document.getElementById("tabs").innerHTML = TABS.map(([k, l, i]) => `<button class="tab" data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ""}>${ic(i, 20)}<span>${l}</span></button>`).join("");
    document.getElementById("where").innerHTML = `${ic("pin", 14)}<span>${esc(S.settings.district)} · ${S.settings.people} ${S.settings.people === 1 ? "person" : "people"}</span>`;
  }
  function go(tab) { S.tab = tab; render(); window.scrollTo({ top: 0 }); }

  document.addEventListener("click", e => {
    const el = e.target.closest("[data-tab],[data-go],[data-swap],[data-off],[data-recipe],[data-filter],[data-people],[data-night],[data-avoid],#regen,#plan,#where");
    if (!el) return;
    const s = S.settings;
    if (el.dataset.tab) return go(el.dataset.tab);
    if (el.dataset.go) return go(el.dataset.go);
    if (el.id === "where") return go("setup");
    if (el.dataset.swap) { const [i, slot] = el.dataset.swap.split(":"); return swap(+i, slot); }
    if (el.dataset.off !== undefined) return toggleOff(+el.dataset.off);
    if (el.dataset.recipe) return openRecipe(el.dataset.recipe);
    if (el.dataset.filter) { S.filter = el.dataset.filter; return render(); }
    if (el.dataset.people) { s.people = +el.dataset.people; return render(); }
    if (el.dataset.night) { s.nights[+el.dataset.night] = !s.nights[+el.dataset.night]; return render(); }
    if (el.dataset.avoid) { s.avoid[el.dataset.avoid] = !s.avoid[el.dataset.avoid]; return render(); }
    if (el.id === "regen") { S.plan = makePlan(); save(); return render(); }
    if (el.id === "plan") { S.isExample = false; S.plan = makePlan(); S.bought = {}; save(); return go("week"); }
  });
  document.addEventListener("change", e => {
    const t = e.target, s = S.settings;
    if (t.dataset.bought) { S.bought[t.dataset.bought] = t.checked; save(); return render(); }
    if (t.dataset.need) { S.pantryNeed[t.dataset.need] = t.checked; save(); return render(); }
    if (t.id === "budget") s.budget = Math.max(20, +t.value || DEFAULTS.budget);
    if (t.id === "tapau") s.tapau = Math.max(1, +t.value || DEFAULTS.tapau);
    if (t.id === "state") { s.state = t.value; s.district = Object.keys(PR.states[s.state].d).sort()[0]; s.shop = -1; return render(); }
    if (t.id === "district") { s.district = t.value; s.shop = -1; return render(); }
    if (t.id === "shop") { s.shop = +t.value; }
  });
  document.addEventListener("input", e => {
    if (e.target.id === "q") { S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById("q"); q.focus(); q.setSelectionRange(pos, pos); }
  });
  if (!PR.states[S.settings.state] || !PR.states[S.settings.state].d[S.settings.district]) S.settings = JSON.parse(JSON.stringify(DEFAULTS));
  render();
})();
</script>
