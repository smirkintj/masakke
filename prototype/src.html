<title>MasakJe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first single column; from 900px a two-column week (dinners left, sticky "next step" and budget right).
   Direction — Product: plans a week of Malaysian home dinners, prices them at shops near you, guides the cooking.
   Character: warm, appetising, encouraging. World: a busy home kitchen, chili and sambal, a Saturday pasar.
   Moment: the "Tonight" card in soft chili tint. Signature: the chili-orange progress line (budget, steps, cooking). */
:root {
  --bg: #ffffff; --surface: #f5f5f4; --card: #ffffff; --raised: #f0efed; --line: rgba(28, 25, 23, 0.10);
  --fg: #1c1917; --fg2: #57534e; --muted: #737373;
  --accent: #c8420c; --accent-bright: #f26a1b; --accent-ink: #ffffff; --accent-soft: #fff1e8; --accent-line: rgba(200, 66, 12, 0.22);
  --pos: #15803d; --neg: #dc2626; --shadow: rgba(28, 25, 23, 0.08);
  --font: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212; --surface: #191919; --card: #1e1e1e; --raised: #2a2a2a; --line: rgba(245, 245, 245, 0.10);
    --fg: #f5f5f5; --fg2: #c2c2c2; --muted: #969696;
    --accent: #ff8a4c; --accent-bright: #ff8a4c; --accent-ink: #1f0e04; --accent-soft: rgba(255, 138, 76, 0.13); --accent-line: rgba(255, 138, 76, 0.35);
    --pos: #4ade80; --neg: #f87171; --shadow: rgba(0, 0, 0, 0.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121212; --surface: #191919; --card: #1e1e1e; --raised: #2a2a2a; --line: rgba(245, 245, 245, 0.10);
  --fg: #f5f5f5; --fg2: #c2c2c2; --muted: #969696;
  --accent: #ff8a4c; --accent-bright: #ff8a4c; --accent-ink: #1f0e04; --accent-soft: rgba(255, 138, 76, 0.13); --accent-line: rgba(255, 138, 76, 0.35);
  --pos: #4ade80; --neg: #f87171; --shadow: rgba(0, 0, 0, 0.5); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body {
  color: var(--fg); font: 400 16px/24px var(--font); font-variant-numeric: tabular-nums;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-font-smoothing: antialiased; overflow-wrap: anywhere;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; opacity: 0.5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.money-v { white-space: nowrap; }
.app { max-width: 600px; margin: 0 auto; padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
.app.bare { padding-bottom: 32px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 60px; }
.logo { font-weight: 600; font-size: 20px; display: flex; align-items: center; gap: 8px; }
.logo svg { color: var(--accent-bright); }
.where { display: inline-flex; align-items: center; gap: 6px; min-width: 0; height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: var(--surface); color: var(--fg2); font-size: 14px; font-weight: 500; transition: background-color 150ms var(--ease); }
.where span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.where:hover { background: var(--raised); }

h1 { font-size: 30px; line-height: 1.15; font-weight: 500; margin: 12px 0 4px; text-wrap: balance; }
.sub { color: var(--fg2); font-size: 15px; margin: 0 0 20px; }
.link { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; background: none; border: 0; padding: 0; font-size: inherit; font-weight: 500; }

/* week layout */
.week-grid { display: grid; gap: 24px; }
.side { display: grid; gap: 16px; align-content: start; }

/* flow + next */
.flow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.flow div { display: grid; gap: 6px; font-size: 13px; font-weight: 500; color: var(--muted); }
.flow i { display: block; height: 4px; border-radius: 2px; background: var(--raised); }
.flow .done i, .flow .now i { background: var(--accent-bright); }
.flow .now { color: var(--accent); }
.flow .done { color: var(--fg2); }
.next { background: var(--accent-soft); border-radius: 20px; padding: 20px; display: grid; gap: 16px; }
.next .k { font-size: 14px; font-weight: 500; color: var(--accent); }
.next .t { font-size: 22px; line-height: 28px; font-weight: 500; margin-top: 4px; }
.next .d { font-size: 15px; color: var(--fg2); margin-top: 6px; }

/* summary */
.summary { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; }
.summary .k { font-size: 14px; color: var(--fg2); }
.summary .big { font-size: 36px; line-height: 1.1; font-weight: 500; margin: 4px 0 16px; white-space: nowrap; }
.meter { height: 8px; border-radius: 4px; background: var(--raised); overflow: hidden; }
.meter div { height: 100%; border-radius: 4px; background: var(--accent-bright); transform-origin: left; transition: transform 400ms var(--ease); }
.meter.over div { background: var(--neg); }
.budget { margin-top: 8px; font-size: 14px; color: var(--fg2); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.budget.over { color: var(--neg); }
.srows { display: grid; gap: 4px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; color: var(--fg2); }
.srows div { display: flex; justify-content: space-between; gap: 12px; }
.srows b { font-weight: 500; color: var(--fg); white-space: nowrap; }

/* days */
.section-h { display: flex; justify-content: space-between; align-items: center; margin: 0 0 12px; gap: 12px; }
.section-h h2 { font-size: 20px; font-weight: 500; margin: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font-size: 15px; font-weight: 500; transition: background-color 150ms var(--ease), transform 120ms var(--ease); white-space: nowrap; }
.btn:hover { background: var(--surface); }
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.big { height: 52px; width: 100%; font-size: 16px; }
.days { display: grid; gap: 12px; }
.day { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 14px 14px 12px 16px; display: grid; gap: 4px; }
.day.off { background: var(--surface); border-color: transparent; }
.day.today { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.dhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 2px; }
.dlabel { font-size: 14px; font-weight: 600; color: var(--fg); }
.dlabel span { color: var(--muted); font-weight: 400; margin-left: 4px; }
.dishes { display: grid; gap: 2px; min-width: 0; }
.dish { display: grid; grid-template-columns: 1fr auto 40px; align-items: center; gap: 8px; min-height: 52px; }
.dish-main { min-width: 0; text-align: left; background: none; border: 0; padding: 4px 0; border-radius: 8px; }
.dish-main .n { display: block; font-weight: 500; font-size: 16px; line-height: 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dish-main .e { display: block; font-size: 14px; line-height: 20px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dish.pickable { grid-template-columns: minmax(0, 1fr) auto; }
.next .dish-main .n, .next .dish-main .e { white-space: normal; }
.dish .c { font-size: 14px; color: var(--fg2); white-space: nowrap; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; border: 0; background: transparent; color: var(--muted); transition: background-color 150ms var(--ease), color 150ms var(--ease); }
.icon-btn:hover { background: var(--surface); color: var(--fg); }
.day-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; font-size: 14px; color: var(--muted); }
.day-foot .acts { display: flex; gap: 20px; }
.day-foot .link { color: var(--fg2); text-decoration: none; display: inline-flex; gap: 6px; align-items: center; min-height: 32px; }
.day-foot .link:hover { color: var(--fg); }
.day-foot .link.go { color: var(--accent); font-weight: 600; }
.off-msg { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted); font-size: 15px; min-height: 44px; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 11px; background: var(--surface); color: var(--fg2); font-size: 12px; font-weight: 500; line-height: 16px; white-space: nowrap; }
.tag.ok { background: var(--accent-soft); color: var(--accent); }
.tag.good { color: var(--pos); }
.pedas { color: var(--neg); }

/* shopping list */
.groups { display: block; }
.group { margin-bottom: 24px; break-inside: avoid; }
.group h3 { font-size: 14px; font-weight: 600; color: var(--fg2); margin: 0 0 8px; display: flex; justify-content: space-between; gap: 12px; }
.list { background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.item { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; min-height: 60px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item input { width: 22px; height: 22px; accent-color: var(--accent); margin: 0; }
.item .n { font-size: 16px; line-height: 22px; font-weight: 500; }
.item .q { font-size: 13px; color: var(--muted); line-height: 18px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
.item .p { font-size: 15px; font-weight: 500; text-align: right; white-space: nowrap; }
.item.done .n, .item.done .p { color: var(--muted); text-decoration: line-through; }
.totals { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 12px 12px 12px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; box-shadow: 0 8px 24px var(--shadow); }
.totals .v { font-size: 22px; font-weight: 600; white-space: nowrap; }
.totals .k { font-size: 13px; color: var(--muted); }

/* recipes */
.search { width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px 0 42px; font-size: 16px; }
.search-wrap { position: relative; margin-bottom: 12px; }
.search-wrap svg { position: absolute; left: 14px; top: 16px; color: var(--muted); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; scrollbar-width: none; }
.chip { flex: none; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--card); color: var(--fg2); font-size: 14px; font-weight: 500; transition: background-color 150ms var(--ease); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.rlist { display: grid; gap: 8px; }
.rrow { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); text-align: left; width: 100%; transition: background-color 150ms var(--ease); }
.rrow:hover { background: var(--surface); }
.rrow .n { font-weight: 500; }
.rrow .e { font-size: 14px; color: var(--muted); }
.rrow .m { text-align: right; font-size: 14px; color: var(--fg2); white-space: nowrap; }

/* forms */
.field { margin-bottom: 24px; }
.field > label, .field > .lbl { display: block; font-size: 15px; font-weight: 600; margin-bottom: 10px; }
.field .hint { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 19px; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button { min-width: 48px; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 15px; font-weight: 500; transition: background-color 150ms var(--ease); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.inp { width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px; font-size: 16px; }
.pc-row { display: grid; grid-template-columns: 140px 1fr; gap: 12px; align-items: center; }
.pc-row .inp { font-size: 20px; font-weight: 600; letter-spacing: 0.04em; }
.pc-place { font-size: 15px; color: var(--fg2); }
.pc-place.bad { color: var(--neg); }
.money { position: relative; }
.money span { position: absolute; left: 14px; top: 12px; color: var(--muted); font-weight: 500; }
.money .inp { padding-left: 48px; font-weight: 600; }
.shops { display: grid; background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.shop { display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; min-height: 60px; border-top: 1px solid var(--line); }
.shop:first-child { border-top: 0; }
.shop input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
.shop .n { font-size: 15px; line-height: 21px; font-weight: 500; }
.shop .q { font-size: 13px; color: var(--muted); line-height: 18px; }
.shop .hrs { margin-top: 2px; }
.shop .hrs.open { color: var(--pos); }
.shop .km { font-size: 14px; color: var(--fg2); text-align: right; white-space: nowrap; }
.shop-more { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
.addshop { margin-top: 12px; background: var(--surface); border-radius: 20px; padding: 16px; display: grid; gap: 12px; }
.addshop .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.addshop .chainmsg { font-size: 14px; color: var(--fg2); }
.lblrow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.lblrow .lbl { font-size: 15px; font-weight: 500; }
.lblrow .link { font-size: 14px; text-decoration: none; }
.fine { font-size: 13px; color: var(--muted); line-height: 20px; margin: 24px 0 0; }
.ob-step { font-size: 13px; color: var(--muted); margin-top: 8px; font-weight: 500; }
.ob-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0 0; }
.ob-bar i { height: 4px; border-radius: 2px; background: var(--raised); }
.ob-bar i.on { background: var(--accent-bright); }
.ob-actions { display: grid; grid-template-columns: auto 1fr; gap: 12px; margin-top: 24px; position: sticky; bottom: 0; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); }
.ob-actions.solo { grid-template-columns: 1fr; }

/* tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs-in { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 500; line-height: 16px; transition: color 150ms var(--ease); }
.tab[aria-current="page"] { color: var(--accent); }

/* recipe sheet */
.scrim { position: fixed; inset: 0; background: rgba(12, 10, 9, 0.45); z-index: 20; opacity: 0; transition: opacity 200ms var(--ease); }
.scrim.open { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 90vh; overflow-y: auto; background: var(--card); border-radius: 28px 28px 0 0; padding: 8px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); transform: translateY(16px); opacity: 0; transition: transform 300ms var(--ease), opacity 300ms var(--ease); }
.sheet.open { transform: none; opacity: 1; }
.sheet-in { max-width: 600px; margin: 0 auto; position: relative; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--raised); margin: 4px auto 16px; }
.sheet h2 { font-size: 26px; line-height: 1.2; font-weight: 500; margin: 0 48px 4px 0; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 20px; }
.sheet h3 { font-size: 17px; font-weight: 600; margin: 24px 0 8px; }
.macros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 4px; }
.macros div { background: var(--surface); border-radius: 12px; padding: 10px 8px; text-align: center; display: grid; gap: 2px; }
.macros b { font-size: 17px; font-weight: 500; }
.macros span { font-size: 12px; color: var(--muted); }
.ing { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
.ing:first-of-type { border-top: 0; }
.ing .up { display: block; font-size: 13px; color: var(--muted); }
.ing .q { font-weight: 500; color: var(--fg); white-space: nowrap; }
.close { position: absolute; right: -8px; top: -4px; }
.toast { position: fixed; left: 0; right: 0; margin-inline: auto; width: max-content; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--fg); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-size: 14px; max-width: calc(100% - 32px); }

/* cooking mode */
.cook { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.cook-in { width: 100%; max-width: 640px; margin: 0 auto; }
.cook-top { display: grid; grid-template-columns: 1fr 40px; gap: 12px; align-items: center; padding: 12px 0 10px; }
.cook-top .n { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cook-top .s { font-size: 13px; color: var(--muted); }
.segs { display: flex; gap: 4px; padding-bottom: 8px; }
.segs i { flex: 1; height: 5px; border-radius: 3px; background: var(--raised); }
.segs i.on { background: var(--accent-bright); }
.cook-body { overflow-y: auto; padding: 20px 0 24px; }
.step-no { font-size: 14px; font-weight: 600; color: var(--accent); margin-bottom: 12px; }
.step-t { font-size: 26px; line-height: 34px; font-weight: 500; margin: 0 0 28px; text-wrap: pretty; }
.need { display: grid; gap: 10px; margin-bottom: 24px; }
.need .lbl { font-size: 14px; font-weight: 600; color: var(--fg2); }
.need-list { display: flex; flex-wrap: wrap; gap: 8px; }
.need-chip { display: inline-flex; align-items: baseline; gap: 8px; padding: 10px 14px; border-radius: 14px; background: var(--accent-soft); font-size: 16px; }
.need-chip b { font-weight: 600; }
.timer { background: var(--surface); border-radius: 20px; padding: 20px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.timer .clock { font-size: 48px; line-height: 1; font-weight: 500; }
.timer .lbl { font-size: 14px; color: var(--muted); margin-top: 8px; }
.timer.ring { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent-line); }
.timer .acts { display: flex; gap: 8px; }
.timer .btn { height: 48px; }
.prep { display: grid; }
.prep label { display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); font-size: 16px; }
.prep label:first-child { border-top: 0; }
.prep input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
.prep .q { font-weight: 600; white-space: nowrap; }
.tip { display: flex; gap: 10px; background: var(--accent-soft); border-radius: 16px; padding: 14px; font-size: 15px; margin-bottom: 20px; }
.tip svg { flex: none; color: var(--accent); margin-top: 3px; }
.cook-foot { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; padding: 12px 0 16px; }
.cook-foot .btn { height: 56px; font-size: 17px; }
.done-t { font-size: 30px; line-height: 1.2; font-weight: 500; margin: 24px 0 8px; }

.no-gsap .enter { animation: rise 360ms var(--ease) both; }
.tstrip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.tchip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 18px; border: 0; background: var(--surface); color: var(--fg2); font-size: 13px; font-weight: 500; }
.tchip b { font-weight: 600; color: var(--fg); margin-left: 2px; }
.tchip.ring { background: var(--accent); color: var(--accent-ink); }
.tchip.ring b { color: var(--accent-ink); }

<script>

    ["fish", "Fish", ["fish_kembung", "fish_selar", "fish_tenggiri", "fish_siakap", "fish_tilapia", "ikan_bilis", "salted_fish", "fish_sauce"]],

  // ---------- icons (lucide, 1.5 stroke) ----------
  const P = {
    swap: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',

    pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
    search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    utensils: '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
    info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
    clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    play: '<polygon points="6 3 20 12 6 21 6 3"/>',
    pause: '<rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/>',
    reset: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    cart: '<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>',
    fridge: '<path d="M5 6a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6Z"/><path d="M5 10h14"/><path d="M15 7v6"/>',
    trash: '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
    sound: '<path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/>',
    mute: '<path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/>',
    plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
    flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  };
  const ic = (n, s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const rm = v => "RM " + (Math.round(v * 100) / 100).toFixed(2);
  const rm0 = v => "RM " + Math.round(v);
  const title = s => s.toLowerCase().replace(/\b([a-z])/g, c => c.toUpperCase()).replace(/\b(Usj|Ss|Pj|Kl|Sdn|Bhd|Ttdi)\b/g, m => m.toUpperCase());

  // ---------- state ----------
  const DEFAULTS = { postcode: "47400", shop: -1, people: 3, nights: [true, true, true, true, true, true, false], budget: 150,
    avoid: { beef: false, mutton: false, pedas: false }, allergy: {}, dislike: {} };
  const clone = o => JSON.parse(JSON.stringify(o));
  let S = { settings: clone(DEFAULTS), plan: null, bought: {}, pantryNeed: {}, flow: { locked: false, shopped: false, cooked: {} }, kitchen: {},
    onboarded: false, ob: 0, tab: "week", filter: "all", q: "" };
  try { const raw = localStorage.getItem(STORE); if (raw) Object.assign(S, JSON.parse(raw), { tab: "week", ob: 0 }); } catch (e) {}
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify({ settings: S.settings, plan: S.plan, bought: S.bought, pantryNeed: S.pantryNeed, flow: S.flow, kitchen: S.kitchen, onboarded: S.onboarded })); } catch (e) {} };

  // ---------- location ----------
  function lookupPostcode(pc) {
    if (!/^\d{5}$/.test(pc)) return null;
    if (PC[pc]) return { lat: PC[pc][0], lng: PC[pc][1], place: PC[pc][2], exact: true };
    const near = Object.keys(PC).filter(k => k.slice(0, 3) === pc.slice(0, 3));
    if (!near.length) return null;
    const k = near.reduce((a, b) => Math.abs(+b - +pc) < Math.abs(+a - +pc) ? b : a);
    return { lat: PC[k][0], lng: PC[k][1], place: PC[k][2], exact: false };
  }
  function km(a, b, c, d) {
    const R = 6371, t = Math.PI / 180, dLat = (c - a) * t, dLng = (d - b) * t;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a * t) * Math.cos(c * t) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  let CTX = null;  // nearby shops + ring medians for the current postcode
  function ctx() {
    const pc = S.settings.postcode;
    if (CTX && CTX.pc === pc) return CTX;
    const loc = lookupPostcode(pc);
    if (!loc) return (CTX = { pc, loc: null, near: [], med: {}, stateIdx: -1 });
    const near = PR.shops.map((s, i) => ({ i, s, d: km(loc.lat, loc.lng, s[2], s[3]) })).filter(x => x.d <= RADII[RADII.length - 1]).sort((a, b) => a.d - b.d);
    const med = {};  // key -> {v, r, n}
    for (const k of PR.keys) {
      const ki = KEYIDX[k];
      for (const r of RADII) {
        const vals = near.filter(x => x.d <= r && x.s[7][ki] > 0).map(x => x.s[7][ki]).sort((a, b) => a - b);
        if (vals.length >= MIN_SHOPS) { const m = vals.length >> 1; med[k] = { v: vals.length % 2 ? vals[m] : (vals[m - 1] + vals[m]) / 2, r, n: vals.length }; break; }
      }
    }
    const stateIdx = near.length ? near[0].s[5] : -1;
    return (CTX = { pc, loc, near, med, stateIdx });
  }
  const shopName = s => title(s[0]);
  const CHAINS = PR.chains.map(([name, pat, idx, n]) => ({ name, re: new RegExp(pat, "i"), idx, n }));
  const chainOf = name => CHAINS.find(c => c.re.test(name || "")) || null;
  const JG = PR.jg && PR.jg.items ? PR.jg : null;
  const OSM = DATA.osm || [];
  // OpenStreetMap opening_hours, common forms: "24/7", "Mo-Fr 09:00-21:00; Sa,Su 10:00-22:00", "Mo-Su 07:00-01:00"
  const DN = ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"];
  function parseHours(h) {
    if (!h) return null;
    if (/^\s*24\/7\s*$/.test(h)) return { always: true };
    const week = Array.from({ length: 7 }, () => null);
    for (const part of h.split(";")) {
      const m = part.trim().match(/^((?:(?:Mo|Tu|We|Th|Fr|Sa|Su)(?:-(?:Mo|Tu|We|Th|Fr|Sa|Su))?,?)+)?\s*(off|closed|(?:\d{1,2}:\d{2}-\d{1,2}:\d{2},?\s*)+)$/i);
      if (!m) { if (/PH|SH|\[|"/.test(part)) continue; return null; }
      const days = new Set();
      if (!m[1]) DN.forEach((_, i) => days.add(i));
      else for (const seg of m[1].split(",").filter(Boolean)) {
        const [a, b] = seg.split("-"); const ia = DN.indexOf(a), ib = b ? DN.indexOf(b) : ia;
        for (let i = ia; ; i = (i + 1) % 7) { days.add(i); if (i === ib) break; }
      }
      const spans = /off|closed/i.test(m[2]) ? [] : m[2].split(",").map(x => x.trim()).filter(Boolean).map(x => { const [f, t] = x.split("-"); const mm = v => { const [hh, mi] = v.split(":"); return +hh * 60 + +mi; }; let e = mm(t); const st = mm(f); if (e <= st) e += 1440; return [st, e]; });
      days.forEach(d => { week[d] = spans; });
    }
    return { week };
  }
  const fmtT = m => { m %= 1440; const h = Math.floor(m / 60), mi = m % 60, ap = h >= 12 ? "pm" : "am", h12 = h % 12 || 12; return `${h12}${mi ? ":" + String(mi).padStart(2, "0") : ""}${ap}`; };
  function openStatus(h) {
    const P = parseHours(h);
    if (!h) return { text: "Hours not listed", cls: "" };
    if (!P) return { text: h, cls: "" };
    if (P.always) return { text: "Open 24 hours", cls: "open" };
    const now = new Date(), d = (now.getDay() + 6) % 7, t = now.getHours() * 60 + now.getMinutes();
    const yest = P.week[(d + 6) % 7] || [];
    for (const [a, b] of yest) if (b > 1440 && t < b - 1440) return { text: `Open · closes ${fmtT(b)}`, cls: "open" };
    for (const [a, b] of P.week[d] || []) if (t >= a && t < b) return { text: `Open · closes ${fmtT(b)}`, cls: "open" };
    for (const [a] of P.week[d] || []) if (a > t) return { text: `Closed · opens ${fmtT(a)}`, cls: "closed" };
    for (let i = 1; i <= 7; i++) { const sp = P.week[(d + i) % 7]; if (sp && sp.length) return { text: `Closed · opens ${i === 1 ? "tomorrow" : DAYS[(d + i) % 7]} ${fmtT(sp[0][0])}`, cls: "closed" }; }
    return { text: "Closed", cls: "closed" };
  }
  const jgDate = JG ? new Date(JG.fetchedAt).toLocaleDateString("en-MY", { day: "numeric", month: "short" }) : "";
  function isJG() {
    const s = S.settings;
    const name = s.shop >= 0 ? PR.shops[s.shop][0] : s.shop === -2 && s.custom ? s.custom.name : s.shop === -3 && OSM[s.osm] ? OSM[s.osm][0] : "";
    const c = chainOf(name); return !!(JG && c && c.name === "Jaya Grocer");
  }
  const pctLabel = idx => { const p = Math.round((idx - 1) * 100); return p === 0 ? "about the same as" : p > 0 ? `${p}% above` : `${-p}% below`; };
  const precisionNote = s => (s[4] === "postcode" || s[4] === "near-postcode") ? "" : "approx. location";

  // ---------- prices ----------
  function price(key) {
    const it = ING[key], ki = KEYIDX[key], c = ctx();
    let per = null, src = "Estimate";
    if (ki !== undefined) {
      const o = S.settings.shop === -3 ? OSM[S.settings.osm] : null;
      const shop = S.settings.shop >= 0 ? PR.shops[S.settings.shop] : o && o[6] >= 0 ? PR.shops[o[6]] : null;
      const custom = S.settings.shop === -2 && S.settings.custom ? chainOf(S.settings.custom.name) : o ? chainOf(o[0]) : null;
      if (shop && shop[7][ki] > 0) { per = shop[7][ki]; src = "This shop"; }
      else if (isJG() && JG.items[key]) { per = JG.items[key].per; src = "Jaya Grocer"; }
      else if (c.med[key]) { per = c.med[key].v * (custom ? custom.idx : 1); src = custom ? `${custom.name} est.` : `Within ${c.med[key].r} km`; }
      else if (c.stateIdx >= 0 && PR.stateMedian[c.stateIdx][ki] > 0) { per = PR.stateMedian[c.stateIdx][ki]; src = "State"; }
      else if (PR.national[ki] > 0) { per = PR.national[ki]; src = "Malaysia"; }
    }
    if (per == null && isJG() && JG.items[key]) { per = JG.items[key].per; src = "Jaya Grocer"; }
    if (per == null) per = it.fallback;
    return { unit: per / it.size, src };
  }
  function unitPrice(key) {
    const it = ING[key], p = price(key), per = p.unit * it.size;
    let u;
    if (it.unit === "pc") u = it.size === 1 ? "each" : `${it.size} ${key === "egg" ? "eggs" : "pcs"}`;
    else if (it.size === 1000) u = it.unit === "g" ? "kg" : "L";
    else u = `${it.size} ${it.unit}`;
    return `${rm(per)}/${u}`;
  }
  function priceLabel() {
    if (S.settings.shop >= 0) return shopName(PR.shops[S.settings.shop]);
    if (S.settings.shop === -2 && S.settings.custom) return S.settings.custom.name;
    if (S.settings.shop === -3 && OSM[S.settings.osm]) return `${OSM[S.settings.osm][0]}, ${OSM[S.settings.osm][5]}`;
    const c = ctx(); return c.loc ? `shops near ${S.settings.postcode}` : "Malaysia average";
  }

  // ---------- costing ----------
  const scale = () => S.settings.people / 4;
  const dishCost = r => r.ing.reduce((s, [k, q]) => s + q * scale() * price(k).unit, 0);
  function dayItems(day) { if (!day || day.off) return []; if (day.onepot) return [RX[day.onepot]]; return [RX[day.lauk], RX[day.sayur]].filter(Boolean); }
  function dayCost(day) {
    if (day.off) return 0;
    let c = dayItems(day).reduce((s, r) => s + dishCost(r), 0);
    if (!day.onepot) c += RICE_PER_PERSON * S.settings.people * price("rice").unit;
    return c;
  }
  function aggregate(plan) {
    const agg = {};
    for (const day of plan.days) {
      if (day.off) continue;
      for (const r of dayItems(day)) for (const [k, q] of r.ing) agg[k] = (agg[k] || 0) + q * scale();
      if (!day.onepot) agg.rice = (agg.rice || 0) + RICE_PER_PERSON * S.settings.people;
    }
    return agg;
  }
  function totals(plan) {
    const agg = aggregate(plan); let fresh = 0, pantryUse = 0, pantryBuy = 0, fromKitchen = 0; const rows = [];
    const stock = haveMap();
    for (const [k, q] of Object.entries(agg)) {
      const it = ING[k], p = price(k);
      const pack = p.src === "Jaya Grocer" ? JG.items[k].size : it.pack;   // real pack size on the shelf
      if (it.pantry) {
        const packs = Math.max(1, Math.ceil(q / pack - 1e-9)), cost = packs * pack * p.unit;
        pantryUse += q * p.unit; if (S.pantryNeed[k]) pantryBuy += cost;
        rows.push({ k, it, q, have: 0, buy: packs * pack, packs, cost, src: p.src, pantry: true });
      } else {
        const have = Math.min(stock[k] || 0, q), need = q - have;
        const packs = need > 1e-6 ? Math.ceil(need / pack - 1e-9) : 0, cost = packs * pack * p.unit;
        fresh += cost; fromKitchen += have * p.unit;
        rows.push({ k, it, q, have, need, buy: packs * pack, packs, cost, src: p.src, pantry: false });
      }
    }
    const nights = plan.days.filter(d => !d.off).length, plates = nights * S.settings.people;
    return { rows, fresh, pantryUse, pantryBuy, fromKitchen, toBuy: fresh + pantryBuy, plates, nights, perPlate: plates ? (fresh + pantryUse) / plates : 0 };
  }

  // ---------- kitchen (fridge / freezer) ----------
  // Before shopping, the list subtracts what's in the kitchen. After "Done shopping" it uses the
  // snapshot taken at that moment, so leftovers added then don't change the list you already bought.
  function haveMap() {
    if (S.flow.shopped && S.flow.have) return S.flow.have;
    return Object.fromEntries(Object.entries(S.kitchen).map(([k, v]) => [k, v.q]));
  }
  function finishShopping() {
    const t = totals(S.plan), have = haveMap(), reserved = {};
    for (const r of t.rows) if (!r.pantry && r.have > 0) reserved[r.k] = r.have;
    S.flow.have = have; S.flow.reserved = reserved;
    for (const r of t.rows) {           // surplus from whole packs goes into the kitchen
      if (r.pantry || !r.buy) continue;
      const extra = r.buy - r.need;
      if (extra > r.it.pack * 0.1) addKitchen(r.k, extra, true);
    }
    S.flow.locked = true; S.flow.shopped = true; save();
  }
  function addKitchen(k, q, leftover) {
    const it = ING[k];
    const cur = S.kitchen[k] || { q: 0, where: /Meat|Fish/.test(it.aisle) ? "freezer" : "fridge", soon: false };
    cur.q += q; if (leftover) cur.leftover = true; S.kitchen[k] = cur;
  }
  function deductCooked(day) {
    const res = S.flow.reserved || {};
    for (const r of dayItems(S.plan.days[day])) for (const [k, q] of r.ing) {
      const used = q * scale(), d = Math.min(res[k] || 0, used, (S.kitchen[k] || { q: 0 }).q);
      if (d > 0) { S.kitchen[k].q -= d; res[k] -= d; if (S.kitchen[k].q < 1e-6) delete S.kitchen[k]; }
    }
  }

  // ---------- planner ----------
  function allowed(r) {
    const s = S.settings, a = s.avoid;
    if ((a.beef && r.protein === "beef") || (a.mutton && r.protein === "mutton") || (a.pedas && r.spicy >= 2)) return false;
    const banned = new Set(Object.keys(s.dislike).filter(k => s.dislike[k]));
    for (const [id, , keys] of ALLERGENS) if (s.allergy[id]) keys.forEach(k => banned.add(k));
    return !r.ing.some(([k]) => banned.has(k));
  }
  const pool = kind => RECIPES.filter(r => r.kind === kind && allowed(r));
  const rand = arr => arr[Math.floor(Math.random() * arr.length)];
  function randomPlan() {
    const lauk = pool("lauk"), sayur = pool("sayur"), one = pool("onepot");
    const used = new Set(); let prev = null, onepots = 0, red = 0; const days = [];
    for (let i = 0; i < 7; i++) {
      if (!S.settings.nights[i]) { days.push({ off: true }); continue; }
      if (one.length && onepots < 2 && Math.random() < 0.2) {
        const r = rand(one.filter(x => !used.has(x.id)));
        if (r) { used.add(r.id); onepots++; prev = r.protein; days.push({ onepot: r.id }); continue; }
      }
      let c = lauk.filter(x => !used.has(x.id) && x.protein !== prev && !((x.protein === "beef" || x.protein === "mutton") && red >= 2));
      if (!c.length) c = lauk.filter(x => !used.has(x.id));
      if (!c.length || !sayur.length) { const o = rand(one.filter(x => !used.has(x.id))); if (o) { used.add(o.id); days.push({ onepot: o.id }); } else days.push({ off: true }); continue; }
      const l = rand(c); used.add(l.id); prev = l.protein; if (l.protein === "beef" || l.protein === "mutton") red++;
      const s = rand(sayur.filter(x => !used.has(x.id))) || rand(sayur); used.add(s.id);
      days.push({ lauk: l.id, sayur: s.id });
    }
    return { days };
  }
  function score(plan) {
    const t = totals(plan), b = S.settings.budget;
    const proteins = new Set(plan.days.flatMap(d => dayItems(d).filter(r => r.kind !== "sayur").map(r => r.protein))).size;
    if (t.toBuy > b) return 1000 + (t.toBuy - b);
    const useK = plan.days.flatMap(d => dayItems(d)).reduce((a, r) => a + r.ing.filter(([k]) => S.kitchen[k] && !ING[k].pantry).reduce((x, [k]) => x + (S.kitchen[k].soon ? 2 : 1), 0), 0);
    return -proteins * 3 + t.toBuy * 0.3 - useK * 2 + Math.random() * 4;
  }
  function makePlan() {
    let best = null, bs = Infinity;
    for (let i = 0; i < 250; i++) { const p = randomPlan(), s = score(p); if (s < bs) { bs = s; best = p; } }
    return best;
  }
  function newWeek() { S.plan = makePlan(); S.bought = {}; S.pantryNeed = {}; S.flow = { locked: false, shopped: false, cooked: {} }; save(); }
  function inPlan() { return new Set(S.plan.days.flatMap(d => [d.lauk, d.sayur, d.onepot]).filter(Boolean)); }
  function swap(di, slot) {
    const day = S.plan.days[di]; const used = inPlan();
    const cands = pool(slot).filter(r => !used.has(r.id)).sort(() => Math.random() - 0.5);
    if (!cands.length) return toast("No other dishes match your preferences");
    let pick = cands[0];
    for (const r of cands) { const t = totals({ days: S.plan.days.map((d, i) => i === di ? { ...d, [slot]: r.id } : d) }); if (t.toBuy <= S.settings.budget) { pick = r; break; } }
    day[slot] = pick.id; save(); render();
  }
  function toggleOff(di) {
    if (S.plan.days[di].off) {
      const used = inPlan();
      S.plan.days[di] = { lauk: (rand(pool("lauk").filter(r => !used.has(r.id))) || rand(pool("lauk"))).id, sayur: (rand(pool("sayur").filter(r => !used.has(r.id))) || rand(pool("sayur"))).id };
    } else S.plan.days[di] = { off: true };
    save(); render();
  }

  // ---------- dates & formatting ----------
  function weekStart() { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; }
  const dateOf = i => { const d = weekStart(); d.setDate(d.getDate() + i); return d; };
  const fmtDate = d => d.toLocaleDateString("en-MY", { day: "numeric", month: "short" });
  const todayIdx = () => (new Date().getDay() + 6) % 7;
  function qty(q, unit, key) {
    if (unit === "pc") {
      const n = key === "egg" ? Math.ceil(q - 1e-9) : Math.max(1, Math.round(q));
      const word = { egg: n === 1 ? "egg" : "eggs", lemongrass: n === 1 ? "stalk" : "stalks", curry_leaves: n === 1 ? "sprig" : "sprigs", tempe: n === 1 ? "pack" : "packs" }[key] || "pcs";
      return `${n} ${word}`;
    }
    const base = unit === "g" ? ["g", "kg"] : ["ml", "L"];
    if (q >= 1000) return `${Math.round(q / 100) / 10} ${base[1]}`;
    const r = q >= 50 ? Math.round(q / 10) * 10 : Math.max(1, Math.round(q / 5) * 5);
    return `${r} ${base[0]}`;
  }
  const fmtClock = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

  // ---------- flow ----------
  function nextCookDay() {
    const t = todayIdx();
    for (let i = t; i < 7; i++) if (!S.plan.days[i].off && !S.flow.cooked[i]) return i;
    return -1;
  }
  function flowStage() { if (!S.flow.locked) return 0; if (!S.flow.shopped) return 1; return 2; }

  // ---------- views ----------
  function viewWeek() {
    const t = totals(S.plan), b = S.settings.budget, diff = b - t.toBuy;
    const fresh = t.rows.filter(r => !r.pantry && r.buy), needP = t.rows.filter(r => r.pantry && S.pantryNeed[r.k]);
    const all = [...fresh, ...needP], left = all.filter(r => !S.bought[r.k]).length;
    const ti = todayIdx(), di = nextCookDay();
    const dishRow = (r, i, slot) => `<div class="dish pickable"><button class="dish-main" data-recipe="${r.id}"><span class="n">${esc(r.name)}${r.spicy >= 2 ? ' <span class="pedas" title="Pedas">•</span>' : ""}</span><span class="e">${esc(r.en)} · ${r.mins} min</span></button><button class="btn" style="height:36px;padding:0 12px" data-pick="${i}:${slot}">Change</button></div>`;
    const dishesOf = (d, i) => d.onepot ? dishRow(RX[d.onepot], i, "onepot") : dishRow(RX[d.lauk], i, "lauk") + dishRow(RX[d.sayur], i, "sayur");
    let hero;
    if (di < 0) hero = `<div class="next"><div><div class="k">This week</div><div class="t">Every dinner is cooked</div><div class="d">Plan next week when you're ready</div></div><button class="btn primary big" id="newweek">Plan next week</button></div>`;
    else {
      const d = S.plan.days[di], items = dayItems(d), mins = items.reduce((a, r) => a + r.mins, 0);
      const when = di === ti ? "Tonight" : DAYS_LONG[di];
      hero = `<div class="next"><div class="k">${when}${di !== ti && !S.plan.days[ti].off ? "" : ""}</div>
        <div class="dishes" style="margin-top:-4px">${dishesOf(d, di)}</div>
        <div class="d" style="margin-top:-4px">${d.onepot ? "One-pot dinner" : "With rice"} · about ${Math.max(...items.map(r => r.mins)) + (d.onepot ? 0 : 10)} min · about ${items.reduce((a, r) => a + r.macro[0], 0) + (d.onepot ? 0 : riceMacro()[0])} kcal and ${items.reduce((a, r) => a + r.macro[1], 0) + (d.onepot ? 0 : riceMacro()[1])} g protein a person</div>
        <button class="btn primary big" data-cookday="${di}">${ic("flame")}Start cooking</button></div>`;
    }
    const shopCard = S.flow.shopped ? `<div class="summary" style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><div class="k">Groceries for the week</div><div style="font-size:18px;font-weight:500;margin-top:2px">${ic("check", 16)} Shopping done</div></div><button class="btn" data-go="shop">View list</button></div>`
      : all.length ? `<div class="summary" style="display:grid;gap:12px">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline"><div><div class="k">Groceries for the week</div><div style="font-size:20px;font-weight:500;margin-top:2px">${left ? `${left} of ${all.length} left to buy` : "All bought"}</div></div><div style="text-align:right"><div class="money-v" style="font-weight:500" data-tw="wktotal" data-v="${t.toBuy.toFixed(2)}">${rm(t.toBuy)}</div><div class="k ${diff < 0 ? "pedas" : ""}" style="font-size:13px">${diff >= 0 ? `${rm(diff)} under budget` : `${rm(-diff)} over budget`}</div></div></div>
        <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="${all.length}" aria-valuenow="${all.length - left}" aria-label="Groceries bought"><div data-tw="grocbar" data-s="${((all.length - left) / all.length).toFixed(3)}" style="transform:scaleX(${((all.length - left) / all.length).toFixed(3)})"></div></div>
        ${left ? `<button class="btn big" data-go="shop">${ic("cart")}${left === all.length ? "Start shopping" : "Continue shopping"}</button>` : ""}
      </div>` : "";
    const days = S.plan.days.map((d, i) => {
      if (i === di) return "";
      const head = `<div class="dhead"><div class="dlabel">${i === ti ? "Today" : DAYS_LONG[i]}<span>${fmtDate(dateOf(i))}</span></div>${S.flow.cooked[i] ? `<span class="tag">${ic("check", 12)}Cooked</span>` : ""}</div>`;
      if (d.off) return `<div class="day off">${head}<div class="off-msg"><span>Not cooking</span><button class="btn" data-off="${i}">Plan a dinner</button></div></div>`;
      return `<div class="day ${S.flow.cooked[i] ? "off" : ""}">${head}<div class="dishes">${dishesOf(d, i)}</div><div class="day-foot"><span>${d.onepot ? "One-pot" : "With rice"}</span><span class="acts">${S.flow.cooked[i] ? "" : `<button class="link go" data-cookday="${i}">${ic("flame", 15)}Cook</button><button class="link" data-off="${i}">Skip</button>`}</span></div></div>`;
    }).join("");
    const pct = Math.min(1, t.toBuy / b);
    return `<div class="enter">
      <h1>${new Date().toLocaleDateString("en-MY", { weekday: "long", day: "numeric", month: "short" })}</h1>
      <p class="sub">Dinner for ${S.settings.people} · prices from ${esc(priceLabel())}</p>
      <div class="week-grid">
        <aside class="side">${hero}${shopCard}
        </aside>
        <section class="week-main"><div class="section-h"><h2>Rest of the week</h2><button class="btn" id="regen">${ic("swap")}New plan</button></div><div class="days">${days}</div></section>
      </div>
    </div>`;
  }

  // ---------- dish picker (replaces random swap) ----------
  function openPicker(di, slot) {
    const cur = RX[S.plan.days[di][slot]];
    const grp = slot === "sayur" ? "all" : cur.protein === "mutton" ? "beef" : ["tofu", "veg"].includes(cur.protein) ? "egg" : cur.protein;
    S.pick = { di, slot, f: grp, q: "" }; renderPicker();
  }
  function renderPicker() {
    const P0 = S.pick; if (!P0) return;
    const day = S.plan.days[P0.di], cur = RX[day[P0.slot]], used = inPlan();
    const base = totals(S.plan).toBuy;
    const fridge = new Set(Object.keys(S.kitchen).filter(k => !ING[k].pantry));
    let list = pool(P0.slot).filter(r => r.id !== cur.id && !used.has(r.id));
    if (P0.slot !== "sayur" && P0.f !== "all") list = list.filter(r => P0.f === "beef" ? (r.protein === "beef" || r.protein === "mutton") : P0.f === "egg" ? ["egg", "tofu", "veg"].includes(r.protein) : r.protein === P0.f);
    if (P0.q) list = list.filter(r => (r.name + " " + r.en).toLowerCase().includes(P0.q.toLowerCase()));
    const rows = list.map(r => {
      const delta = totals({ days: S.plan.days.map((d, i) => i === P0.di ? { ...d, [P0.slot]: r.id } : d) }).toBuy - base;
      const fr = r.ing.filter(([k]) => fridge.has(k)).length;
      return { r, delta, fr };
    }).sort((a, b) => (b.fr - a.fr) || (a.delta - b.delta));
    const F = P0.slot === "sayur" ? [] : [["all", "All"], ["chicken", "Ayam"], ["fish", "Ikan"], ["seafood", "Udang & sotong"], ["beef", "Daging"], ["egg", "Telur & tauhu"]];
    const root = document.getElementById("sheetRoot");
    const html = `<div class="scrim open" id="scrim"></div><div class="sheet open" role="dialog" aria-modal="true" aria-labelledby="pk-t"><div class="sheet-in">
      <div class="grab"></div><button class="icon-btn close" id="shClose" aria-label="Close">${ic("x", 18)}</button>
      <h2 id="pk-t">Change ${P0.slot === "sayur" ? "sayur" : P0.slot === "onepot" ? "one-pot" : "lauk"}</h2>
      <p class="sub" style="margin:4px 0 12px">${DAYS_LONG[P0.di]} · now ${esc(cur.name)}. Price change is for the whole week's shopping.</p>
      <div class="search-wrap">${ic("search")}<input class="search" id="pkq" type="search" placeholder="Search dishes" value="${esc(P0.q)}" aria-label="Search dishes"></div>
      ${F.length ? `<div class="chips" role="group">${F.map(([k, l]) => `<button class="chip" data-pkf="${k}" aria-pressed="${P0.f === k}">${l}</button>`).join("")}</div>` : ""}
      <button class="btn big" id="pkRandom" style="margin-bottom:12px">${ic("swap")}Surprise me</button>
      <div class="rlist" style="grid-template-columns:1fr">${rows.map(({ r, delta, fr }) => `<button class="rrow" data-pkid="${r.id}"><div><div class="n">${esc(r.name)}${r.spicy >= 2 ? ' <span class="pedas">•</span>' : ""}</div><div class="e">${esc(r.en)} · ${r.mins} min · ${r.macro[0]} kcal</div>${fr ? `<div style="margin-top:4px"><span class="tag ok">${ic("fridge", 12)}Uses ${fr} from your fridge</span></div>` : ""}</div><div class="m"><div style="font-weight:600;color:${Math.abs(delta) < 0.005 ? "var(--fg2)" : delta < 0 ? "var(--pos)" : "var(--fg)"}">${Math.abs(delta) < 0.005 ? "Same price" : (delta < 0 ? "−" : "+") + rm(Math.abs(delta))}</div></div></button>`).join("") || `<div class="sub" style="padding:12px 0">No other dishes match</div>`}</div>
    </div></div>`;
    const y = root.querySelector(".sheet") ? root.querySelector(".sheet").scrollTop : 0;
    root.innerHTML = html; root.querySelector(".sheet").scrollTop = y;
    const close = () => { S.pick = null; root.innerHTML = ""; };
    document.getElementById("scrim").onclick = close; document.getElementById("shClose").onclick = close;
    root.querySelectorAll("[data-pkf]").forEach(b => b.onclick = () => { S.pick.f = b.dataset.pkf; renderPicker(); });
    root.querySelectorAll("[data-pkid]").forEach(b => b.onclick = () => { day[P0.slot] = b.dataset.pkid; save(); close(); render(); toast(`Changed to ${RX[b.dataset.pkid].name}`); });
    document.getElementById("pkRandom").onclick = () => { close(); swap(P0.di, P0.slot); };
    const q = document.getElementById("pkq");
    q.oninput = () => { S.pick.q = q.value; const pos = q.selectionStart; renderPicker(); const n = document.getElementById("pkq"); n.focus(); n.setSelectionRange(pos, pos); };
  }

  function viewShop() {
    const t = totals(S.plan);
    const fresh = t.rows.filter(r => !r.pantry), pantry = t.rows.filter(r => r.pantry);
    const needP = pantry.filter(r => S.pantryNeed[r.k]);
    const all = [...fresh.filter(r => r.buy), ...needP];
    const got = all.filter(r => S.bought[r.k]).length;

    };

      const g = groups[a].sort((x, y) => (!!S.bought[x.k] - !!S.bought[y.k]) || y.cost - x.cost);

    const lockNote = "";

        <div class="meter" style="margin-top:12px" role="progressbar" aria-valuemin="0" aria-valuemax="${all.length}" aria-valuenow="${got}" aria-label="Items bought"><div data-tw="shopbar" data-s="${pct.toFixed(3)}" style="transform:scaleX(${pct.toFixed(3)})"></div></div>
      </div>
      <details class="group" ${S.flow.shopped ? "" : "open"}><summary style="cursor:pointer;font-size:14px;font-weight:600;color:var(--fg2);margin-bottom:8px">Before you go: pantry check (${needP.length} to buy)</summary><div class="list">${pantry.sort((a, b) => a.it.name.localeCompare(b.it.name)).map(prow).join("")}</div></details>
      ${covered.length ? `<div class="tip">${ic("fridge")}<div><b>Already at home, not on the list:</b> ${covered.map(r => esc(r.it.name)).join(", ")}</div></div>` : ""}
      <div class="groups">${sec}</div>
      <div class="totals"><div><div class="k">${all.length - got ? `${all.length - got} left to buy` : "Everything bought"}</div><div class="v">${rm(t.toBuy)}</div></div><button class="btn primary" id="shopped" ${S.flow.shopped ? "disabled" : ""}>${S.flow.shopped ? "Shopping done" : "Finish shopping"}</button></div>
      <p class="fine">Each price is the shop's unit price (per kg, per 10 eggs, per bottle) times what you actually buy. This shop = its latest PriceCatcher price. Within N km = typical price of at least 3 shops that close to your postcode. Chain estimate = nearby price adjusted by that chain's price level. Jaya Grocer = its online-store price (Online Store KL, may differ in-store), checked weekly, for personal use. Estimate = PriceCatcher does not track it.</p>
    </div>`;
  }

  function viewKitchen() {
    const K = Object.entries(S.kitchen);
    const q = (S.kq || "").trim().toLowerCase();
    const adds = q ? Object.entries(ING).filter(([k, it]) => !S.kitchen[k] && it.name.toLowerCase().includes(q)).slice(0, 8) : [];
    const row = ([k, v]) => { const it = ING[k];
      return `<div class="item" style="grid-template-columns:1fr auto auto"><div><div class="n">${esc(it.name)}${v.soon ? ' <span class="tag ok">Use soon</span>' : ""}${v.leftover ? ' <span class="tag">Leftover</span>' : ""}</div>
        <div class="q"><button class="link" style="font-weight:500" data-kmove="${k}">Move to ${v.where === "fridge" ? "freezer" : "fridge"}</button><button class="link" style="font-weight:500" data-ksoon="${k}">${v.soon ? "Not urgent" : "Use soon"}</button></div></div>
        <label style="display:flex;align-items:center;gap:6px"><input class="inp" id="kq-${k}" data-kqty="${k}" type="number" inputmode="decimal" min="0" value="${Math.round(v.q)}" style="width:84px;height:40px;padding:0 10px;text-align:right" aria-label="Amount of ${esc(it.name)}"><span class="q" style="margin:0">${it.unit === "pc" ? "pcs" : it.unit}</span></label>
        <button class="icon-btn" data-kdel="${k}" aria-label="Remove ${esc(it.name)}">${ic("trash", 18)}</button></div>`; };
    const sec = where => { const L = K.filter(([, v]) => v.where === where); return `<div class="group"><h3><span>${where === "fridge" ? "Fridge" : "Freezer"}</span><span>${L.length}</span></h3>${L.length ? `<div class="list">${L.map(row).join("")}</div>` : `<div class="list"><div class="item" style="grid-template-columns:1fr;color:var(--muted)">Nothing here yet</div></div>`}</div>`; };
    const fresh = K.filter(([k]) => !ING[k].pantry).map(([k]) => k);
    const can = RECIPES.filter(allowed).map(r => ({ r, n: r.ing.filter(([k]) => fresh.includes(k)).length })).filter(x => x.n).sort((a, b) => b.n - a.n || a.r.mins - b.r.mins).slice(0, 6);
    return `<div class="enter narrow">
      <h1>Fridge & freezer</h1>

    const linked = new Set(OSM.map(o => o[6]).filter(i => i >= 0));
    let cands = OSM.map((o, i) => ({ k: "o", i, name: o[0], type: o[1], area: o[5], hours: o[4], pc: o[6], d: km(loc.lat, loc.lng, o[2], o[3]) }))
      .concat(PR.shops.map((p, i) => linked.has(i) ? null : { k: "p", i, name: shopName(p), type: p[1], area: p[6], hours: "", pc: i, d: km(loc.lat, loc.lng, p[2], p[3]) }).filter(Boolean));
    cands = q ? cands.filter(x => x.name.toLowerCase().includes(q)).sort((a, b) => a.d - b.d).slice(0, 12)
              : cands.filter(x => x.d <= 15).sort((a, b) => a.d - b.d).slice(0, S.nearN || 8);
    const checked = x => x.k === "o" ? s.shop === -3 && s.osm === x.i : s.shop === x.i;
    const ring = c.near.filter(x => x.d <= 5).length;
    const cu = s.custom, cuChain = cu && chainOf(cu.name);
    const row = x => { const pk = priceKind(x.name, x.pc), st = openStatus(x.hours);
      return `<label class="shop"><input type="radio" name="shop" value="${x.k}:${x.i}" ${checked(x) ? "checked" : ""}><div><div class="n">${esc(x.name)}</div><div class="q">${esc(x.type)}${x.area ? " · " + esc(x.area) : ""}</div><div class="q hrs ${st.cls}">${esc(st.text)}</div></div><span class="tag ${pk.ok ? "ok" : ""}" style="white-space:normal;height:auto;padding:2px 8px;max-width:110px;text-align:right">${pk.t}</span></label>`; };
    const rows = [
      `<label class="shop"><input type="radio" name="shop" value="-1" ${s.shop === -1 ? "checked" : ""}><div><div class="n">Any shop near me</div><div class="q">Typical price across ${ring >= MIN_SHOPS ? `${ring} surveyed shops around ${esc(loc.place)}` : "the nearest surveyed shops"}</div></div><span></span></label>`,
      cu ? `<label class="shop"><input type="radio" name="shop" value="-2" ${s.shop === -2 ? "checked" : ""}><div><div class="n">${esc(cu.name)}</div><div class="q">Added by you</div></div><span class="tag ${cuChain && JG && cuChain.name === "Jaya Grocer" ? "ok" : ""}" style="white-space:normal;height:auto;padding:2px 8px;max-width:110px;text-align:right">${priceKind(cu.name, -1).t}</span></label>` : "",

    ].join("");
    const draft = S.shopDraft || "", dChain = chainOf(draft);
    const add = S.adding ? `<div class="addshop"><label for="newshop" style="font-weight:500;font-size:15px">Your shop's name</label>
        <div class="row"><input class="inp" id="newshop" placeholder="e.g. TMG Alam Budiman" value="${esc(draft)}" style="background:var(--card)"><button class="btn primary" id="saveshop" style="height:48px" ${draft.trim().length < 3 ? "disabled" : ""}>Add</button></div>
        <div class="chainmsg">${draft.trim().length < 3 ? "We'll use prices from shops near your postcode." : dChain ? (JG && dChain.name === "Jaya Grocer" ? `Recognised <b>Jaya Grocer</b>. We'll use its online-store prices for ${Object.keys(JG.items).length} ingredients (checked ${jgDate}).` : `Recognised <b>${dChain.name}</b>. Its surveyed branches are ${pctLabel(dChain.idx)} average, so we'll adjust nearby prices by that.`) : "Not a chain we have data for. We'll use typical prices from shops near you."}</div></div>` : "";
    return `<div class="field"><label for="postcode">Your postcode</label><div class="pc-row"><input class="inp" id="postcode" inputmode="numeric" maxlength="5" autocomplete="postal-code" value="${esc(s.postcode)}">${place}</div></div>
      <div class="field"><span class="lbl">Where you usually shop</span>
        <div class="search-wrap">${ic("search")}<input class="search" id="shopq" type="search" placeholder="Search shops" value="${esc(S.shopQ || "")}" aria-label="Search shops"></div>
        <div class="shops" role="radiogroup" aria-label="Where you shop">${rows}${q && !cands.length ? `<div class="shop"><span></span><div class="q">No shop matches "${esc(S.shopQ)}"</div><span></span></div>` : ""}</div>

  }
  function householdBlock() {

      <div class="field"><div class="lblrow"><span class="lbl">Vegetables you don't eat</span>${Object.values(s.dislike).some(Boolean) ? `<button class="link" data-clear="dislike">Clear</button>` : ""}</div><div class="seg" role="group">${VEG.map(k => `<button data-dislike="${k}" aria-pressed="${!!s.dislike[k]}">${esc(ING[k].name.replace(/ \(.*\)/, ""))}</button>`).join("")}</div></div>
      <div class="field"><div class="lblrow"><span class="lbl">Also leave out</span>${Object.values(s.avoid).some(Boolean) ? `<button class="link" data-clear="avoid">Clear</button>` : ""}</div><div class="seg" role="group">${av.map(([k, l]) => `<button data-avoid="${k}" aria-pressed="${!!s.avoid[k]}">${l}</button>`).join("")}</div><div class="hint">All dishes are halal</div></div>

      ${i === 0 ? `<p class="fine">Prices: ${esc(PR.source)}, ${PR.shops.length.toLocaleString()} shops, latest ${PR.date}. Shop locations come from their address postcode or town (GeoNames, CC BY 4.0), so distances are approximate.</p>` : ""}

      <div class="field"><span class="lbl">Sounds</span><div class="seg"><button data-sound aria-pressed="${S.settings.sound !== false}">${ic(S.settings.sound === false ? "mute" : "sound", 18)}&nbsp;${S.settings.sound === false ? "Off" : "On"}</button></div><div class="hint">Ticks when you check things off, a chime when a timer ends</div></div>
      <button class="btn primary big" id="replan">Save and plan a new week</button>
      <p class="fine">Prices: ${esc(PR.source)}, ${PR.shops.length.toLocaleString()} shops, latest ${PR.date}. Shop locations: GeoNames postcodes (CC BY 4.0). Recipes are drafts and still need checking by a home cook.</p>
