  // ---------- nutrition ----------
  const riceMacro = () => { const g = RICE_PER_PERSON, n = [360, 6.6, 79, 0.6]; return n.map(v => Math.round(v * g / 100)); };
  function macroBox(r, withRice) {
    const m = r.macro.slice(); if (withRice) riceMacro().forEach((v, i) => m[i] += v);
    return `<div class="macros" aria-label="Nutrition per serving"><div><b>${m[0]}</b><span>kcal</span></div><div><b>${m[1]} g</b><span>protein</span></div><div><b>${m[2]} g</b><span>carbs</span></div><div><b>${m[3]} g</b><span>fat</span></div></div>
      <p class="fine" style="margin:6px 0 16px">Per serving, approximate${r.kind === "lauk" ? ", without rice (a plate of rice adds about " + riceMacro()[0] + " kcal)" : ""}</p>`;
  }

  // ---------- recipe sheet ----------
  function openRecipe(id) {
    const r = RX[id]; if (!r) return;
    const n = S.settings.people;
    const ing = r.ing.map(([k, q]) => `<div class="ing"><span>${esc(ING[k].name)}<span class="up">${unitPrice(k)}</span></span><span class="q">${qty(q * scale(), ING[k].unit, k)}</span></div>`).join("");
    const root = document.getElementById("sheetRoot");
    root.innerHTML = `<div class="scrim" id="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="sheet-in">
      <div class="grab"></div><button class="icon-btn close" id="shClose" aria-label="Close">${ic("x", 18)}</button>
      <h2 id="sh-t">${esc(r.name)}</h2><div style="color:var(--fg2)">${esc(r.en)}</div>
      <div class="meta"><span class="tag">${ic("clock", 12)}${r.mins} min</span><span class="tag">${r.guide.length} steps</span><span class="tag">${esc(r.cuisine)}</span>${r.spicy >= 2 ? '<span class="tag pedas">Pedas</span>' : r.spicy ? '<span class="tag">Mild heat</span>' : ""}<span class="tag num">${rm(dishCost(r))} for ${n}</span></div>
      ${macroBox(r)}
      <button class="btn primary big" data-cookone="${r.id}">${ic("flame")}Start cooking</button>
      <h3>Ingredients for ${n}</h3>${ing}
      <p class="fine">Draft recipe, not yet tested by a home cook</p>
    </div></div>`;
    requestAnimationFrame(() => { document.getElementById("scrim").classList.add("open"); root.querySelector(".sheet").classList.add("open"); });
    document.getElementById("scrim").onclick = closeSheet; document.getElementById("shClose").onclick = closeSheet;
    document.getElementById("shClose").focus();
  }
  const closeSheet = () => { document.getElementById("sheetRoot").innerHTML = ""; };

  // ---------- sound (Web Audio, no files) ----------
  const SFX = (() => {
    let ctx = null;
    const on = () => S.settings.sound !== false;
    const ac = () => { try { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === "suspended") ctx.resume(); } catch (e) { ctx = null; } return ctx; };
    function tone(f, start, dur, vol = 0.07, type = "sine") {
      const c = ac(); if (!c) return;
      const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + start;
      o.type = type; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
    }
    let alarmTimer = null;
    return {
      unlock: ac,
      tick() { if (on()) { tone(1320, 0, 0.07, 0.05, "triangle"); } },
      untick() { if (on()) { tone(660, 0, 0.06, 0.035, "triangle"); } },
      step() { if (on()) { tone(587, 0, 0.09, 0.05); tone(784, 0.07, 0.12, 0.05); } },
      done() { if (on()) { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.11, 0.35, 0.06)); } },
      alarm(start) {
        if (!start) { clearInterval(alarmTimer); alarmTimer = null; return; }
        if (alarmTimer || !on()) return;
        const ring = () => { tone(880, 0, 0.18, 0.12); tone(1175, 0.2, 0.18, 0.12); tone(880, 0.4, 0.18, 0.12); };
        ring(); alarmTimer = setInterval(ring, 1600);
      },
    };
  })();

  // ---------- motion (GSAP when available, respects reduced motion) ----------
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const G = !reduce && window.gsap ? window.gsap : null;
  const EASE = "power3.out";
  const tweenMem = {};
  function captureTweens() {
    document.querySelectorAll("[data-tw]").forEach(el => { tweenMem[el.dataset.tw] = { s: +el.dataset.s || 0, v: +el.dataset.v || 0 }; });
  }
  function playTweens(enter) {
    if (!G) return;
    if (enter) G.from(".enter > *, .enter .side > *", { y: 8, opacity: 0, duration: 0.4, stagger: { each: 0.05, amount: 0.25 }, ease: EASE, clearProps: "transform,opacity" });
    document.querySelectorAll("[data-tw]").forEach(el => {
      const prev = tweenMem[el.dataset.tw]; if (!prev) return;
      if (el.dataset.s !== undefined && prev.s !== +el.dataset.s) G.fromTo(el, { scaleX: prev.s }, { scaleX: +el.dataset.s, duration: 0.5, ease: EASE });
      if (el.dataset.v !== undefined && prev.v !== +el.dataset.v) {
        const o = { v: prev.v }, fmt = el.dataset.fmt === "int" ? (x => String(Math.round(x))) : (x => rm(x));
        G.to(o, { v: +el.dataset.v, duration: 0.5, ease: EASE, onUpdate: () => { el.textContent = fmt(o.v); } });
      }
    });
  }
  const pop = el => { if (G && el) G.fromTo(el, { scale: 0.9 }, { scale: 1, duration: 0.2, ease: EASE }); };

  // ---------- cooking mode: one combined dinner run ----------
  let C = null; // { ids, day, steps, step (-1 get ready, steps.length done), timers, prepped, started, dir }
  let wakeLock = null;
  function buildRun(ids, day) {
    const n = S.settings.people, sc = scale(), steps = [];
    const withRice = day != null && !S.plan.days[day].onepot;
    if (withRice) steps.push({ dish: "rice", t: `Rinse ${qty(RICE_PER_PERSON * n, "g", "rice")} rice and start the rice cooker`, ing: [["rice", RICE_PER_PERSON * n]], sec: 0 });
    const fromGuide = r => r.guide.map(st => ({ dish: r.id, t: st.t, ing: st.ing.map(k => [k, r.ing.find(x => x[0] === k)[1] * sc]), sec: st.sec }));
    const main = RX[ids[0]], side = ids[1] ? RX[ids[1]] : null;
    const ms = fromGuide(main);
    if (side) {
      const prep = { dish: side.id, parallel: true, t: `While that cooks, wash and cut what you need for the ${side.name.toLowerCase()}`, ing: side.ing.filter(([k]) => !ING[k].pantry).map(([k, q]) => [k, q * sc]), sec: 0 };
      let at = -1, longest = 0; ms.forEach((s, i) => { if (s.sec > longest) { longest = s.sec; at = i; } });
      if (longest >= 300) ms.splice(at + 1, 0, prep); else ms.push(prep);
      steps.push(...ms, ...fromGuide(side));
    } else steps.push(...ms);
    return steps;
  }
  function startCooking(ids, day) {
    closeSheet(); SFX.unlock();
    C = { ids, day, steps: buildRun(ids, day), step: -1, timers: {}, prepped: {}, started: null, dir: 1 };
    C.clock = setInterval(cookTick, 250);
    try { navigator.wakeLock && navigator.wakeLock.request("screen").then(l => { wakeLock = l; }).catch(() => {}); } catch (e) {}
    renderCook();
  }
  function stopCooking() {
    if (C && C.clock) clearInterval(C.clock);
    SFX.alarm(false);
    C = null; document.getElementById("cookRoot").innerHTML = "";
    try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null;
    document.body.style.overflow = "";
  }
  function cookTick() {
    if (!C) return;
    let ringing = false, changed = false;
    for (const [i, t] of Object.entries(C.timers)) {
      if (t.running) {
        t.left = Math.max(0, Math.round((t.end - Date.now()) / 1000));
        if (t.left === 0) { t.running = false; t.rang = true; changed = true; try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {} }
      }
      if (t.rang && !t.acked) ringing = true;
      document.querySelectorAll(`[data-tclock="${i}"]`).forEach(el => { el.textContent = fmtClock(t.left); });
    }
    SFX.alarm(ringing);
    const el = document.getElementById("elapsed"); if (el && C.started) el.textContent = fmtClock(Math.floor((Date.now() - C.started) / 1000));
    if (changed) renderCook(true);
  }
  const dishLabel = s => s.dish === "rice" ? "Rice" : RX[s.dish].name;
  const dishKind = s => s.dish === "rice" ? "rice" : RX[s.dish].kind;
  function renderCook(keep) {
    const root = document.getElementById("cookRoot");
    if (!C) return;
    document.body.style.overflow = "hidden";
    const n = S.settings.people, total = C.steps.length;
    const names = C.ids.map(id => RX[id].name).join(" + ");
    const est = Math.max(...C.ids.map(id => RX[id].mins)) + (C.ids.length > 1 ? 10 : 0);
    const elapsed = C.started ? `<span class="tag ok" style="height:28px;font-size:14px;padding:0 10px">${ic("clock", 14)}<span id="elapsed">${fmtClock(Math.floor((Date.now() - C.started) / 1000))}</span>&nbsp;/ ~${est} min</span>` : `<span class="tag">About ${est} min</span>`;
    const segs = `<div class="segs">${[-1, ...C.steps.map((_, i) => i)].map(i => `<i class="${i <= C.step ? "on" : ""}"></i>`).join("")}</div>`;
    const other = Object.entries(C.timers).filter(([i, t]) => +i !== C.step && (t.running || (t.rang && !t.acked)));
    const strip = other.length ? `<div class="tstrip">${other.map(([i, t]) => `<button class="tchip ${t.rang ? "ring" : ""}" data-jump="${i}">${ic(t.rang ? "flame" : "clock", 14)}${esc(dishLabel(C.steps[i]))} · step ${+i + 1}<b data-tclock="${i}">${fmtClock(t.left)}</b></button>`).join("")}</div>` : "";
    const sound = `<button class="icon-btn" id="ckSound" aria-label="${S.settings.sound === false ? "Turn sound on" : "Mute sound"}" aria-pressed="${S.settings.sound !== false}">${ic(S.settings.sound === false ? "mute" : "sound", 18)}</button>`;
    let body, foot;
    if (C.step === -1) {
      const merged = {};
      C.steps.forEach(s => s.ing.forEach(([k, q]) => { merged[k] = Math.max(merged[k] || 0, 0); }));
      C.ids.forEach(id => RX[id].ing.forEach(([k, q]) => { merged[k] = (merged[k] || 0) + q * scale(); }));
      if (C.steps[0] && C.steps[0].dish === "rice") merged.rice = RICE_PER_PERSON * n;
      const keys = Object.keys(merged), ready = keys.filter(k => C.prepped[k]).length;
      body = `<div class="step-no">Get ready</div><h2 class="step-t">Gather everything for ${n} ${n === 1 ? "person" : "people"}</h2>
        ${C.ids.length > 1 || C.steps[0].dish === "rice" ? `<div class="tip">${ic("info")}<div>MasakJe runs these together: ${C.steps[0].dish === "rice" ? "rice first, then " : ""}${esc(RX[C.ids[0]].name)}${C.ids[1] ? `, and you prep the ${esc(RX[C.ids[1]].name.toLowerCase())} while it cooks so it's served hot` : ""}.</div></div>` : ""}
        <div style="display:flex;justify-content:space-between;font-size:14px;color:var(--fg2);margin-bottom:8px"><span><b style="color:var(--fg)">${ready} of ${keys.length}</b> ready</span>${ready === keys.length ? '<span style="color:var(--pos);font-weight:600">All set</span>' : ""}</div>
        <div class="meter" style="margin-bottom:12px" role="progressbar" aria-valuemin="0" aria-valuemax="${keys.length}" aria-valuenow="${ready}" aria-label="Ingredients ready"><div data-tw="prep" data-s="${(ready / keys.length).toFixed(3)}" style="transform:scaleX(${(ready / keys.length).toFixed(3)})"></div></div>
        <div class="prep">${keys.map(k => `<label><input type="checkbox" data-prep="${k}" ${C.prepped[k] ? "checked" : ""}><span>${esc(ING[k].name)}</span><span class="q">${qty(merged[k], ING[k].unit, k)}</span></label>`).join("")}</div>`;
      foot = `<button class="btn" id="ckBack">Close</button><button class="btn primary" id="ckNext">${ic("play")}Start cooking</button>`;
    } else if (C.step < total) {
      const st = C.steps[C.step], kind = dishKind(st);
      const tag = `<div class="dtag ${kind}">${esc(dishLabel(st))}${st.parallel ? " · at the same time" : ""}</div>`;
      const need = st.ing.length ? `<div class="need"><span class="lbl">You need</span><div class="need-list">${st.ing.map(([k, q]) => `<span class="need-chip">${esc(ING[k].name)} <b>${qty(q, ING[k].unit, k)}</b></span>`).join("")}</div></div>` : "";
      let timer = "";
      if (st.sec) {
        const t = C.timers[C.step] || { left: st.sec, running: false };
        timer = `<div class="timer ${t.rang ? "ring" : ""}"><div><div class="clock" data-tclock="${C.step}">${fmtClock(t.left)}</div><div class="lbl">${t.rang ? "Time's up" : t.running ? "Running. You can go to the next step" : "Timer"}</div></div><div class="acts">${t.rang && !t.acked ? `<button class="btn primary" id="tAck">${ic("check")}Stop alarm</button>` : t.running ? `<button class="btn" id="tPause" aria-label="Pause timer">${ic("pause")}</button>` : `<button class="btn primary" id="tStart">${ic("play")}${t.left === st.sec ? "Start" : "Resume"}</button>`}${t.left !== st.sec && !(t.rang && !t.acked) ? `<button class="btn" id="tReset" aria-label="Reset timer">${ic("reset")}</button>` : ""}</div></div>`;
      }
      body = `<div class="step-no">Step ${C.step + 1} of ${total}</div>${tag}<h2 class="step-t">${esc(st.t)}</h2>${need}${timer}`;
      foot = `<button class="btn" id="ckBack">Back</button><button class="btn primary" id="ckNext">${C.step + 1 < total ? "Next" : "Finish"}</button>`;
    } else {
      const took = C.started ? Math.max(1, Math.round((Date.now() - C.started) / 60000)) : 0;
      body = `<div class="done-mark">${ic("check", 40)}</div><div class="done-t">${C.ids.length > 1 ? "Dinner is ready" : `${esc(RX[C.ids[0]].name)} is ready`}</div><p class="sub">${C.started ? `Cooked in ${took} min. ` : ""}Selamat makan.</p>`;
      foot = `<button class="btn" id="ckBack">Back</button><button class="btn primary" id="ckNext">${C.day != null ? "Mark as cooked" : "Close"}</button>`;
    }
    root.innerHTML = `<div class="cook" role="dialog" aria-modal="true" aria-label="Cooking ${esc(names)}">
      <div class="cook-in"><div class="cook-top"><div style="min-width:0"><div class="n">${esc(names)}</div><div class="s" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px">${elapsed}</div></div><div style="display:flex">${sound}<button class="icon-btn" id="ckClose" aria-label="Close cooking mode">${ic("x", 18)}</button></div></div>${segs}${strip}</div>
      <div class="cook-body"><div class="cook-in" id="ckBody">${body}</div></div>
      <div class="cook-in"><div class="cook-foot">${foot}</div></div>
    </div>`;
    if (G && !keep) G.from("#ckBody", { x: 28 * C.dir, opacity: 0, duration: 0.35, ease: EASE, clearProps: "transform,opacity" });
    if (G && C.step >= total) G.from(".done-mark", { scale: 0.85, opacity: 0, duration: 0.45, ease: EASE });
    playTweens(false);
    const $ = id => document.getElementById(id);
    $("ckClose").onclick = stopCooking;
    $("ckSound").onclick = () => { S.settings.sound = S.settings.sound === false; save(); if (S.settings.sound === false) SFX.alarm(false); renderCook(true); };
    $("ckBack").onclick = () => { if (C.step === -1) return stopCooking(); C.step--; C.dir = -1; SFX.step(); renderCook(); };
    $("ckNext").onclick = () => {
      if (C.step < total) { if (!C.started) C.started = Date.now(); C.step++; C.dir = 1; if (C.step === total) SFX.done(); else SFX.step(); return renderCook(); }
      if (C.day != null) { S.flow.cooked[C.day] = true; deductCooked(C.day); save(); toast("Marked as cooked"); }
      stopCooking(); render();
    };
    const st = C.steps[C.step], t = C.timers[C.step];
    if ($("tStart")) $("tStart").onclick = () => { const cur = C.timers[C.step] || { left: st.sec }; C.timers[C.step] = { left: cur.left, end: Date.now() + cur.left * 1000, running: true }; SFX.step(); renderCook(true); };
    if ($("tPause")) $("tPause").onclick = () => { t.running = false; renderCook(true); };
    if ($("tReset")) $("tReset").onclick = () => { delete C.timers[C.step]; renderCook(true); };
    if ($("tAck")) $("tAck").onclick = () => { t.acked = true; SFX.alarm(false); renderCook(true); };
    root.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => { const i = +b.dataset.jump, tt = C.timers[i]; if (tt.rang) { tt.acked = true; SFX.alarm(false); } C.dir = i > C.step ? 1 : -1; C.step = i; renderCook(); });
    root.querySelectorAll("[data-prep]").forEach(el => el.onchange = () => {
      captureTweens(); C.prepped[el.dataset.prep] = el.checked; el.checked ? SFX.tick() : SFX.untick();
      const y = root.querySelector(".cook-body").scrollTop; renderCook(true); root.querySelector(".cook-body").scrollTop = y;
      pop(root.querySelector(`[data-prep="${el.dataset.prep}"]`));
    });
    if (!keep) $("ckNext").focus();
  }

  function toast(msg) {
    const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = msg;
    document.body.appendChild(el);
    if (G) G.from(el, { y: 12, opacity: 0, duration: 0.3, ease: EASE });
    setTimeout(() => { if (G) G.to(el, { opacity: 0, duration: 0.25, onComplete: () => el.remove() }); else el.remove(); }, 2400);
  }

  // ---------- render ----------
  const TABS = [["week", "Today", "week"], ["shop", "Shop", "list"], ["kitchen", "Kitchen", "fridge"], ["recipes", "Recipes", "book"], ["setup", "Settings", "sliders"]];
  let lastView = "";
  if (!G) document.documentElement.classList.add("no-gsap");
  function render() {
    captureTweens();
    const v = document.getElementById("view");
    const ob = !S.onboarded;
    document.getElementById("app").classList.toggle("bare", ob);
    document.getElementById("tabsNav").hidden = ob;
    document.getElementById("where").hidden = ob;
    if (ob) { v.innerHTML = viewOnboarding(); return; }
    if (!S.plan || S.plan.days.length !== 7) newWeek();
    const viewKey = S.onboarded + S.tab;
    v.innerHTML = S.tab === "week" ? viewWeek() : S.tab === "shop" ? viewShop() : S.tab === "recipes" ? viewRecipes() : S.tab === "kitchen" ? viewKitchen() : viewSetup();
    document.getElementById("tabs").innerHTML = TABS.map(([k, l, i]) => `<button class="tab" data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ""}>${ic(i, 20)}<span>${l}</span></button>`).join("");
    playTweens(viewKey !== lastView); lastView = viewKey;
    document.getElementById("where").innerHTML = `${ic("pin", 14)}<span>${esc(S.settings.postcode)} · ${S.settings.people} ${S.settings.people === 1 ? "person" : "people"}</span>`;
  }
  function go(tab) { S.tab = tab; render(); window.scrollTo({ top: 0 }); }

  document.addEventListener("click", e => {
    const el = e.target.closest("[data-tab],[data-go],[data-swap],[data-off],[data-recipe],[data-filter],[data-people],[data-night],[data-avoid],[data-allergy],[data-dislike],[data-pick],[data-sound],[data-clear],[data-cookday],[data-cookone],#regen,#replan,#where,#lock,#shopped,#newweek,#obNext,#obBack,#moreshops,#addshop,#saveshop,#replanK,[data-kadd],[data-kdel],[data-kmove],[data-ksoon]");
    if (!el) return;
    const s = S.settings;
    if (el.dataset.tab) return go(el.dataset.tab);
    if (el.dataset.go) return go(el.dataset.go);
    if (el.id === "where") return go("setup");
    if (el.dataset.swap) { const [i, slot] = el.dataset.swap.split(":"); return swap(+i, slot); }
    if (el.dataset.off !== undefined) return toggleOff(+el.dataset.off);
    if (el.dataset.recipe) return openRecipe(el.dataset.recipe);
    if (el.dataset.clear) { const k = el.dataset.clear; s[k] = k === "avoid" ? { beef: false, mutton: false, pedas: false } : {}; save(); return render(); }
    if (el.dataset.pick) { const [i, slot] = el.dataset.pick.split(":"); return openPicker(+i, slot); }
    if (el.dataset.sound !== undefined) { S.settings.sound = S.settings.sound === false; save(); if (S.settings.sound !== false) SFX.tick(); return render(); }
    if (el.dataset.cookday !== undefined) { const di = +el.dataset.cookday; return startCooking(dayItems(S.plan.days[di]).map(r => r.id), di); }
    if (el.dataset.cookone) return startCooking([el.dataset.cookone], null);
    if (el.dataset.filter) { S.filter = el.dataset.filter; return render(); }
    if (el.dataset.people) { s.people = +el.dataset.people; return render(); }
    if (el.dataset.night) { s.nights[+el.dataset.night] = !s.nights[+el.dataset.night]; return render(); }
    if (el.dataset.avoid) { s.avoid[el.dataset.avoid] = !s.avoid[el.dataset.avoid]; return render(); }
    if (el.dataset.allergy) { s.allergy[el.dataset.allergy] = !s.allergy[el.dataset.allergy]; return render(); }
    if (el.dataset.dislike) { s.dislike[el.dataset.dislike] = !s.dislike[el.dataset.dislike]; return render(); }
    if (el.id === "regen") { captureTweens(); S.plan = makePlan(); S.flow.shopped = false; save(); render(); toast("New plan for the week"); return; }
    if (el.id === "lock") { S.flow.locked = true; save(); return go("shop"); }
    if (el.id === "shopped") {
      const before = Object.keys(S.kitchen).length; finishShopping(); SFX.done();
      const added = Object.keys(S.kitchen).length - before;
      toast(added > 0 ? `Done. ${added} leftover pack ${added === 1 ? "amount" : "amounts"} saved to your fridge` : "Shopping done"); return go("week");
    }
    if (el.id === "newweek" || el.id === "replan") { newWeek(); return go("week"); }
    if (el.dataset.kadd) { addKitchen(el.dataset.kadd, ING[el.dataset.kadd].pack, false); S.kq = ""; save(); return render(); }
    if (el.dataset.kdel) { delete S.kitchen[el.dataset.kdel]; save(); return render(); }
    if (el.dataset.kmove) { const v = S.kitchen[el.dataset.kmove]; v.where = v.where === "fridge" ? "freezer" : "fridge"; save(); return render(); }
    if (el.dataset.ksoon) { const v = S.kitchen[el.dataset.ksoon]; v.soon = !v.soon; save(); return render(); }
    if (el.id === "replanK") { newWeek(); toast("New plan built around your fridge"); return go("week"); }
    if (el.id === "moreshops") { S.nearN = (S.nearN || 8) + 10; return render(); }
    if (el.id === "addshop") { S.adding = true; render(); const n = document.getElementById("newshop"); n && n.focus(); return; }
    if (el.id === "saveshop") { const name = (S.shopDraft || "").trim(); if (name.length < 3) return; s.custom = { name }; s.shop = -2; S.adding = false; S.shopDraft = ""; save(); return render(); }
    if (el.id === "obBack") { S.ob = Math.max(0, S.ob - 1); render(); return window.scrollTo({ top: 0 }); }
    if (el.id === "obNext") {
      if (S.ob < 3) { S.ob++; render(); return window.scrollTo({ top: 0 }); }
      S.onboarded = true; newWeek(); return go("week");
    }
  });
  document.addEventListener("change", e => {
    const t = e.target, s = S.settings;
    if (t.dataset.bought) { captureTweens(); S.bought[t.dataset.bought] = t.checked; t.checked ? SFX.tick() : SFX.untick(); save(); render(); pop(document.querySelector(`[data-bought="${t.dataset.bought}"]`)); return; }
    if (t.dataset.need) { S.pantryNeed[t.dataset.need] = t.checked; save(); return render(); }
    if (t.name === "shop") { if (t.value.startsWith("o:")) { s.shop = -3; s.osm = +t.value.slice(2); } else if (t.value.startsWith("p:")) { s.shop = +t.value.slice(2); } else s.shop = +t.value; save(); return render(); }
    if (t.dataset.kqty) { const v = +t.value; if (v > 0) S.kitchen[t.dataset.kqty].q = v; else delete S.kitchen[t.dataset.kqty]; save(); return render(); }
    if (t.id === "budget") { s.budget = Math.max(20, +t.value || DEFAULTS.budget); save(); }
  });
  document.addEventListener("input", e => {
    const t = e.target;
    if (t.id === "q") { S.q = t.value; const pos = t.selectionStart; render(); const q = document.getElementById("q"); q.focus(); q.setSelectionRange(pos, pos); }
    if (t.id === "shopq" || t.id === "newshop" || t.id === "kq") {
      if (t.id === "shopq") S.shopQ = t.value; else if (t.id === "kq") S.kq = t.value; else S.shopDraft = t.value;
      const id = t.id, pos = t.selectionStart; render(); const el = document.getElementById(id); el.focus(); el.setSelectionRange(pos, pos); return;
    }
    if (t.id === "postcode") {
      const v = t.value.replace(/\D/g, "").slice(0, 5);
      if (v !== S.settings.postcode) { S.settings.postcode = v; S.settings.shop = -1; save(); render(); const p = document.getElementById("postcode"); p.focus(); p.setSelectionRange(v.length, v.length); }
    }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { if (C) stopCooking(); else closeSheet(); } });
  render();
})();
</script>
