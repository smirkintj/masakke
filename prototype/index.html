<style>
/* Layout: phone-first single column; from 900px a two-column week (dinners left, sticky "next step" and budget right).
   Direction — Product: plans a week of Malaysian home dinners, prices them at shops near you, guides the cooking.
   Character: warm, appetising, encouraging. World: a busy home kitchen, chili and sambal, a Saturday pasar.
   Moment: the "Tonight" card in soft chili tint. Signature: the chili-orange progress line (budget, steps, cooking). */
:root {
  --bg: #ffffff; --surface: #f5f5f4; --card: #ffffff; --raised: #f0efed; --line: rgba(28, 25, 23, 0.10);
  --fg: #1c1917; --fg2: #57534e; --muted: #737373;

}

    --bg: #121212; --surface: #191919; --card: #1e1e1e; --raised: #2a2a2a; --line: rgba(245, 245, 245, 0.10);
    --fg: #f5f5f5; --fg2: #c2c2c2; --muted: #969696;
    --accent: #ff8a4c; --accent-bright: #ff8a4c; --accent-ink: #1f0e04; --accent-soft: rgba(255, 138, 76, 0.13); --accent-line: rgba(255, 138, 76, 0.35);
    --pos: #4ade80; --neg: #f87171; --shadow: rgba(0, 0, 0, 0.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121212; --surface: #191919; --card: #1e1e1e; --raised: #2a2a2a; --line: rgba(245, 245, 245, 0.10);
  --fg: #f5f5f5; --fg2: #c2c2c2; --muted: #969696;
  --accent: #ff8a4c; --accent-bright: #ff8a4c; --accent-ink: #1f0e04; --accent-soft: rgba(255, 138, 76, 0.13); --accent-line: rgba(255, 138, 76, 0.35);

* { box-sizing: border-box; }
[hidden] { display: none !important; }

/* top bar */

.link { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; background: none; border: 0; padding: 0; font-size: inherit; font-weight: 500; }

.btn:hover { background: var(--surface); }

.dish-main .e { display: block; font-size: 14px; line-height: 20px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dish .c { font-size: 14px; color: var(--fg2); white-space: nowrap; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; border: 0; background: transparent; color: var(--muted); transition: background-color 150ms var(--ease), color 150ms var(--ease); }
.icon-btn:hover { background: var(--surface); color: var(--fg); }
.day-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; font-size: 14px; color: var(--muted); }
.day-foot .acts { display: flex; gap: 20px; }

.list { background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }

.tab { height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 500; line-height: 16px; transition: color 150ms var(--ease); }
.tab[aria-current="page"] { color: var(--accent); }

.scrim { position: fixed; inset: 0; background: rgba(12, 10, 9, 0.45); z-index: 20; opacity: 0; transition: opacity 200ms var(--ease); }
.scrim.open { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 90vh; overflow-y: auto; background: var(--card); border-radius: 28px 28px 0 0; padding: 8px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); transform: translateY(16px); opacity: 0; transition: transform 300ms var(--ease), opacity 300ms var(--ease); }

.toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: var(--fg); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-size: 14px; max-width: calc(100% - 32px); }

/* cooking mode */
.cook { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

.tip svg { flex: none; color: var(--accent); margin-top: 3px; }

.cook-foot .btn { height: 56px; font-size: 17px; border-radius: 16px; }
.done-t { font-size: 30px; line-height: 1.2; font-weight: 600; margin: 24px 0 8px; }

.enter { animation: rise 360ms var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

      if (extra > r.it.pack * 0.1) addKitchen(r.k, extra, true);
    }
    S.flow.locked = true; S.flow.shopped = true; save();
  }
  function addKitchen(k, q, leftover) {
    const it = ING[k];
    const cur = S.kitchen[k] || { q: 0, where: /Meat|Fish/.test(it.aisle) ? "freezer" : "fridge", soon: false };
    cur.q += q; if (leftover) cur.leftover = true; S.kitchen[k] = cur;
  }
  function deductCooked(day) {
    const res = S.flow.reserved || {};
    for (const r of dayItems(S.plan.days[day])) for (const [k, q] of r.ing) {
      const used = q * scale(), d = Math.min(res[k] || 0, used, (S.kitchen[k] || { q: 0 }).q);
      if (d > 0) { S.kitchen[k].q -= d; res[k] -= d; if (S.kitchen[k].q < 1e-6) delete S.kitchen[k]; }
    }
  }

  // ---------- planner ----------
  function allowed(r) {
    const s = S.settings, a = s.avoid;
    if ((a.beef && r.protein === "beef") || (a.mutton && r.protein === "mutton") || (a.pedas && r.spicy >= 2)) return false;
    const banned = new Set(Object.keys(s.dislike).filter(k => s.dislike[k]));
    for (const [id, , keys] of ALLERGENS) if (s.allergy[id]) keys.forEach(k => banned.add(k));
    return !r.ing.some(([k]) => banned.has(k));
  }
  const pool = kind => RECIPES.filter(r => r.kind === kind && allowed(r));
  const rand = arr => arr[Math.floor(Math.random() * arr.length)];
  function randomPlan() {
    const lauk = pool("lauk"), sayur = pool("sayur"), one = pool("onepot");
    const used = new Set(); let prev = null, onepots = 0, red = 0; const days = [];
    for (let i = 0; i < 7; i++) {
      if (!S.settings.nights[i]) { days.push({ off: true }); continue; }
      if (one.length && onepots < 2 && Math.random() < 0.2) {
        const r = rand(one.filter(x => !used.has(x.id)));
        if (r) { used.add(r.id); onepots++; prev = r.protein; days.push({ onepot: r.id }); continue; }
      }
      let c = lauk.filter(x => !used.has(x.id) && x.protein !== prev && !((x.protein === "beef" || x.protein === "mutton") && red >= 2));
      if (!c.length) c = lauk.filter(x => !used.has(x.id));
      if (!c.length || !sayur.length) { const o = rand(one.filter(x => !used.has(x.id))); if (o) { used.add(o.id); days.push({ onepot: o.id }); } else days.push({ off: true }); continue; }
      const l = rand(c); used.add(l.id); prev = l.protein; if (l.protein === "beef" || l.protein === "mutton") red++;
      const s = rand(sayur.filter(x => !used.has(x.id))) || rand(sayur); used.add(s.id);
      days.push({ lauk: l.id, sayur: s.id });
    }
    return { days };
  }
  function score(plan) {
    const t = totals(plan), b = S.settings.budget;
    const proteins = new Set(plan.days.flatMap(d => dayItems(d).filter(r => r.kind !== "sayur").map(r => r.protein))).size;
    if (t.toBuy > b) return 1000 + (t.toBuy - b);
    const useK = plan.days.flatMap(d => dayItems(d)).reduce((a, r) => a + r.ing.filter(([k]) => S.kitchen[k] && !ING[k].pantry).reduce((x, [k]) => x + (S.kitchen[k].soon ? 2 : 1), 0), 0);
    return -proteins * 3 + t.toBuy * 0.3 - useK * 2 + Math.random() * 4;
  }
  function makePlan() {
    let best = null, bs = Infinity;
    for (let i = 0; i < 250; i++) { const p = randomPlan(), s = score(p); if (s < bs) { bs = s; best = p; } }
    return best;
  }
  function newWeek() { S.plan = makePlan(); S.bought = {}; S.pantryNeed = {}; S.flow = { locked: false, shopped: false, cooked: {} }; save(); }
  function inPlan() { return new Set(S.plan.days.flatMap(d => [d.lauk, d.sayur, d.onepot]).filter(Boolean)); }
  function swap(di, slot) {
    const day = S.plan.days[di]; const used = inPlan();
    const cands = pool(slot).filter(r => !used.has(r.id)).sort(() => Math.random() - 0.5);
    if (!cands.length) return toast("No other dishes match your preferences");
    let pick = cands[0];
    for (const r of cands) { const t = totals({ days: S.plan.days.map((d, i) => i === di ? { ...d, [slot]: r.id } : d) }); if (t.toBuy <= S.settings.budget) { pick = r; break; } }
    day[slot] = pick.id; save(); render();
  }
  function toggleOff(di) {
    if (S.plan.days[di].off) {
      const used = inPlan();
      S.plan.days[di] = { lauk: (rand(pool("lauk").filter(r => !used.has(r.id))) || rand(pool("lauk"))).id, sayur: (rand(pool("sayur").filter(r => !used.has(r.id))) || rand(pool("sayur"))).id };
    } else S.plan.days[di] = { off: true };
    save(); render();
  }

  // ---------- dates & formatting ----------
  function weekStart() { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; }
  const dateOf = i => { const d = weekStart(); d.setDate(d.getDate() + i); return d; };
  const fmtDate = d => d.toLocaleDateString("en-MY", { day: "numeric", month: "short" });
  const todayIdx = () => (new Date().getDay() + 6) % 7;
  function qty(q, unit, key) {
    if (unit === "pc") {
      const n = key === "egg" ? Math.ceil(q - 1e-9) : Math.max(1, Math.round(q));
      const word = { egg: n === 1 ? "egg" : "eggs", lemongrass: n === 1 ? "stalk" : "stalks", curry_leaves: n === 1 ? "sprig" : "sprigs", tempe: n === 1 ? "pack" : "packs" }[key] || "pcs";
      return `${n} ${word}`;
    }
    const base = unit === "g" ? ["g", "kg"] : ["ml", "L"];
    if (q >= 1000) return `${Math.round(q / 100) / 10} ${base[1]}`;
    const r = q >= 50 ? Math.round(q / 10) * 10 : Math.max(1, Math.round(q / 5) * 5);
    return `${r} ${base[0]}`;
  }
  const fmtClock = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

  // ---------- flow ----------
  function nextCookDay() {
    const t = todayIdx();
    for (let i = t; i < 7; i++) if (!S.plan.days[i].off && !S.flow.cooked[i]) return i;
    return -1;
  }
  function flowStage() { if (!S.flow.locked) return 0; if (!S.flow.shopped) return 1; return 2; }

  // ---------- views ----------
  function viewWeek() {
    const t = totals(S.plan), b = S.settings.budget, diff = b - t.toBuy, stage = flowStage();
    const steps = ["Plan", "Shop", "Cook"].map((l, i) => `<div class="${i < stage ? "done" : i === stage ? "now" : ""}"><i></i>${i + 1}. ${l}</div>`).join("");
    const fresh = t.rows.filter(r => !r.pantry), bought = fresh.filter(r => S.bought[r.k]).length;
    const di = nextCookDay();
    let next;
    if (stage === 0) next = `<div class="next"><div><div class="k">STEP 1 OF 3</div><div class="t">Check this week's dinners</div><div class="d">Swap anything your family won't eat, or skip nights you eat out. Then lock the plan to get your shopping list.</div></div><button class="btn primary big" id="lock">Lock plan and make my list</button></div>`;
    else if (di < 0) next = `<div class="next"><div><div class="k">ALL DONE</div><div class="t">Every dinner this week is cooked</div><div class="d">Plan next week when you're ready.</div></div><button class="btn primary big" id="newweek">Plan next week</button></div>`;
    else {
      const items = dayItems(S.plan.days[di]); const mins = Math.max(...items.map(r => r.mins));
      const when = di === todayIdx() ? "TONIGHT" : DAYS_LONG[di].toUpperCase();
      const shopLine = stage === 1 ? `<div class="d">Shopping list: <b>${bought} of ${fresh.length}</b> bought</div>` : "";
      next = `<div class="next"><div><div class="k">${when}</div><div class="t">${items.map(r => esc(r.name)).join(" + ")}</div><div class="d">About ${mins} min${S.plan.days[di].onepot ? "" : ", with rice"}</div>${shopLine}</div>
        <div style="display:grid;gap:8px">
          ${stage === 1 ? `<button class="btn primary big" data-go="shop">${ic("cart")}I'm at the shop</button><button class="btn big" data-cookday="${di}">${ic("flame")}I'm cooking now</button>`
                        : `<button class="btn primary big" data-cookday="${di}">${ic("flame")}I'm cooking now</button><button class="btn big" data-go="shop">${ic("cart")}Shopping list</button>`}
        </div></div>`;
    }
    const pct = Math.min(1, t.toBuy / b);
    const summary = `<div class="summary">
        <div class="k">To spend this week</div>
        <div class="big">${rm(t.toBuy)}</div>
        <div class="meter ${diff < 0 ? "over" : ""}" role="img" aria-label="${rm(t.toBuy)} of ${rm0(b)} budget"><div style="transform:scaleX(${pct.toFixed(3)})"></div></div>
        <div class="budget ${diff < 0 ? "over" : ""}"><span>${diff >= 0 ? `<b class="money-v">${rm(diff)}</b> left` : `<b class="money-v">${rm(-diff)}</b> over budget`}</span><span>of <span class="money-v">${rm0(b)}</span> budget</span></div>
        <div class="srows">
          <div><span>Groceries</span><b>${rm(t.fresh)}</b></div>
          ${t.pantryBuy ? `<div><span>Pantry restock</span><b>${rm(t.pantryBuy)}</b></div>` : ""}
          <div><span>Pantry you already have</span><b>${rm(t.pantryUse)}</b></div>
          ${t.fromKitchen > 0.01 ? `<div><span>Used from fridge/freezer</span><b>${rm(t.fromKitchen)}</b></div>` : ""}
          <div><span>Priced at</span><b style="text-align:right">${esc(priceLabel())}</b></div>
        </div></div>`;
    const days = S.plan.days.map((d, i) => {
      const head = (extra = "") => `<div class="dhead"><div class="dlabel">${DAYS_LONG[i]}<span>${fmtDate(dateOf(i))}</span></div>${extra}</div>`;
      if (d.off) return `<div class="day off">${head()}<div class="off-msg"><span>Not cooking</span><button class="btn" data-off="${i}">Plan a dinner</button></div></div>`;
      const row = (r, slot) => `<div class="dish"><button class="dish-main" data-recipe="${r.id}"><span class="n">${esc(r.name)}${r.spicy >= 2 ? ' <span class="pedas" title="Pedas">•</span>' : ""}</span><span class="e">${esc(r.en)}</span></button><span class="c">${rm(dishCost(r))}</span><button class="icon-btn" aria-label="Swap ${esc(r.name)}" data-swap="${i}:${slot}">${ic("swap", 18)}</button></div>`;
      const body = d.onepot ? row(RX[d.onepot], "onepot") : row(RX[d.lauk], "lauk") + row(RX[d.sayur], "sayur");
      const cooked = S.flow.cooked[i];
      const isNext = stage > 0 && i === di;
      const tag = cooked ? `<span class="tag ok">${ic("check", 12)}Cooked</span>` : isNext ? `<span class="tag ok">Next up</span>` : "";
      return `<div class="day ${isNext ? "today" : ""}">${head(tag)}<div class="dishes">${body}</div><div class="day-foot"><span>${d.onepot ? "One-pot" : "With rice"}</span><span class="acts">${cooked ? "" : `<button class="link go" data-cookday="${i}">${ic("flame", 15)}Cook</button><button class="link" data-off="${i}">Skip</button>`}</span></div></div>`;
    }).join("");
    return `<div class="enter">
      <h1>Week of ${fmtDate(weekStart())}</h1>
      <p class="sub">${t.nights} dinners for ${S.settings.people}</p>
      <div class="week-grid">
        <aside class="side"><div class="flow" aria-label="Progress">${steps}</div>${next}${summary}</aside>
        <section class="week-main"><div class="section-h"><h2>Dinners</h2><button class="btn" id="regen">${ic("swap")}New plan</button></div><div class="days">${days}</div></section>
      </div>
    </div>`;
  }

  function viewShop() {
    const t = totals(S.plan);
    const fresh = t.rows.filter(r => !r.pantry), pantry = t.rows.filter(r => r.pantry);
    const needP = pantry.filter(r => S.pantryNeed[r.k]);
    const all = [...fresh.filter(r => r.buy), ...needP];
    const got = all.filter(r => S.bought[r.k]).length;
    const spent = all.filter(r => S.bought[r.k]).reduce((s, r) => s + r.cost, 0);
    const groups = {};
    const covered = fresh.filter(r => !r.buy);
    for (const r of [...fresh.filter(r => r.buy), ...needP]) (groups[r.it.aisle] = groups[r.it.aisle] || []).push(r);
    const order = ["Vegetables", "Onion, garlic & chili", "Meat & poultry", "Fish & seafood", "Eggs & tofu", "Noodles", "Dry goods", "Pantry", "Spices"];
    const srcTag = s => `<span class="tag ${s === "This shop" || s === "Jaya Grocer" ? "ok" : ""}">${s}</span>`;
    const jgLine = r => r.src === "Jaya Grocer" ? `<div class="q"><a href="${esc(JG.items[r.k].url)}" target="_blank" rel="noopener" style="color:var(--fg2)">${esc(JG.items[r.k].title)} · RM ${JG.items[r.k].price.toFixed(2)}</a></div>` : "";
    const row = r => {
      const done = !!S.bought[r.k];
      return `<label class="item ${done ? "done" : ""}"><input type="checkbox" id="b-${r.k}" data-bought="${r.k}" ${done ? "checked" : ""}><div><div class="n">${esc(r.it.name)}</div><div class="q"><b style="font-weight:600;color:var(--fg2)">${r.src === "Jaya Grocer" ? `${r.packs} × ${r.it.unit === "pc" && JG.items[r.k].size % 1 ? "pack" : qty(JG.items[r.k].size, r.it.unit, r.k)}` : qty(r.buy, r.it.unit, r.k)}</b><span>· ${unitPrice(r.k)}</span>${srcTag(r.src)}</div>${jgLine(r)}${r.have ? `<div class="q">${qty(r.have, r.it.unit, r.k)} already in your ${S.kitchen[r.k] ? S.kitchen[r.k].where : "kitchen"}</div>` : ""}${r.buy - r.need > r.it.pack * 0.25 && r.it.unit !== "pc" ? `<div class="q">Recipes use ${qty(r.need, r.it.unit, r.k)}, the rest goes to your fridge</div>` : ""}</div><span class="p">${rm(r.cost)}</span></label>`;
    };
    const sec = order.filter(a => groups[a]).map(a => {
      const g = groups[a].sort((x, y) => (!!S.bought[x.k] - !!S.bought[y.k]) || y.cost - x.cost);
      const gd = g.filter(r => S.bought[r.k]).length;
      return `<div class="group"><h3><span>${a}</span><span>${gd}/${g.length}</span></h3><div class="list">${g.map(row).join("")}</div></div>`;
    }).join("");
    const prow = r => `<label class="item"><input type="checkbox" id="p-${r.k}" data-need="${r.k}" ${S.pantryNeed[r.k] ? "checked" : ""}><div><div class="n">${esc(r.it.name)}</div><div class="q"><span>uses ${qty(r.q, r.it.unit, r.k)}</span><span>· ${unitPrice(r.k)}</span></div></div><span class="p">${S.pantryNeed[r.k] ? "Need" : '<span style="color:var(--muted)">Have</span>'}</span></label>`;
    const lockNote = !S.flow.locked ? `<div class="tip">${ic("info")}<div>This list follows your current plan. <button class="link" id="lock">Lock the plan</button> so it stops changing.</div></div>` : "";
    const pct = all.length ? got / all.length : 0;
    return `<div class="enter">
      <h1>Shopping list</h1>
      <p class="sub">Prices from ${esc(priceLabel())}. Rounded up to what shops sell.</p>

      <div class="summary" style="margin-bottom:24px">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline"><div class="k"><b style="color:var(--fg);font-size:18px">${got} of ${all.length}</b> items bought</div><div class="k">${rm(spent)} of ${rm(t.toBuy)}</div></div>
        <div class="meter" style="margin-top:12px" role="progressbar" aria-valuemin="0" aria-valuemax="${all.length}" aria-valuenow="${got}" aria-label="Items bought"><div style="transform:scaleX(${pct.toFixed(3)})"></div></div>
      </div>
      <details class="group" ${S.flow.locked ? "" : "open"}><summary style="cursor:pointer;font-size:14px;font-weight:600;color:var(--fg2);margin-bottom:8px">Before you go: pantry check (${needP.length} to buy)</summary><div class="list">${pantry.sort((a, b) => a.it.name.localeCompare(b.it.name)).map(prow).join("")}</div></details>
      ${covered.length ? `<div class="tip">${ic("fridge")}<div><b>Already at home, not on the list:</b> ${covered.map(r => esc(r.it.name)).join(", ")}</div></div>` : ""}
      <div class="groups">${sec}</div>

      <p class="fine">Each price is the shop's unit price (per kg, per 10 eggs, per bottle) times what you actually buy. This shop = its latest PriceCatcher price. Within N km = typical price of at least 3 shops that close to your postcode. Chain estimate = nearby price adjusted by that chain's price level. Jaya Grocer = its online-store price (Online Store KL, may differ in-store), checked weekly, for personal use. Estimate = PriceCatcher does not track it.</p>
    </div>`;
  }

      return `<div class="item" style="grid-template-columns:1fr auto auto"><div><div class="n">${esc(it.name)}${v.soon ? ' <span class="tag ok">Use soon</span>' : ""}${v.leftover ? ' <span class="tag">Leftover</span>' : ""}</div>
        <div class="q"><button class="link" style="font-weight:500" data-kmove="${k}">Move to ${v.where === "fridge" ? "freezer" : "fridge"}</button><button class="link" style="font-weight:500" data-ksoon="${k}">${v.soon ? "Not urgent" : "Use soon"}</button></div></div>

        ${adds.length ? `<div class="shops">${adds.map(([k, it]) => `<button class="shop" style="grid-template-columns:1fr auto;width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left" data-kadd="${k}"><span class="n">${esc(it.name)}</span><span class="tag ok">${ic("plus", 12)}Add ${qty(it.pack, it.unit, k)}</span></button>`).join("")}</div>` : ""}</div>
      ${sec("fridge")}${sec("freezer")}
      ${can.length ? `<div class="group"><h3><span>Dishes that use what you have</span></h3><div class="rlist">${can.map(({ r, n }) => `<button class="rrow" data-recipe="${r.id}"><div><div class="n">${esc(r.name)}</div><div class="e">Uses ${n} of your items</div></div><div class="m">${r.mins} min</div></button>`).join("")}</div></div>
      <button class="btn primary big" id="replanK">${ic("swap")}Replan the week around these</button>` : ""}
      <p class="fine">After you finish shopping, the unused part of each pack (say 470 g of a 1 kg pack of beef) is added here automatically. Cooking a planned dinner takes out what came from here.</p>

  }

      <div class="rlist">${list.map(r => `<button class="rrow" data-recipe="${r.id}"><div><div class="n">${esc(r.name)}${r.spicy >= 2 ? ' <span class="pedas">•</span>' : ""}</div><div class="e">${esc(r.en)}</div></div><div class="m"><div>${r.mins} min</div></div></button>`).join("") || `<div style="padding:16px;color:var(--muted)">No dishes match</div>`}</div>

  // location block, shared by onboarding and setup
  function locationBlock() {
    const s = S.settings, c = ctx(), loc = c.loc;
    const place = !/^\d{5}$/.test(s.postcode) ? `<span class="pc-place">Enter a 5-digit postcode</span>` : loc ? `<span class="pc-place">${esc(loc.place)}${loc.exact ? "" : " area"}</span>` : `<span class="pc-place bad">Postcode not found</span>`;
    if (!loc) return `<div class="field"><label for="postcode">Your postcode</label><div class="pc-row"><input class="inp" id="postcode" inputmode="numeric" maxlength="5" autocomplete="postal-code" value="${esc(s.postcode)}">${place}</div></div>`;
    const q = (S.shopQ || "").trim().toLowerCase();
    const pool = q ? PR.shops.map((sh, i) => ({ i, s: sh, d: km(loc.lat, loc.lng, sh[2], sh[3]) })).filter(x => x.s[0].toLowerCase().includes(q)).sort((a, b) => a.d - b.d).slice(0, 10)
                   : c.near.slice(0, S.nearN || 8);
    const kmTxt = x => x.d < 1 ? "<1 km" : `${precisionNote(x.s) ? "~" : ""}${x.d < 10 ? x.d.toFixed(1) : Math.round(x.d)} km`;
    const ring = c.near.filter(x => x.d <= 5).length;
    const cu = s.custom, cuChain = cu && chainOf(cu.name);
    const rows = [
      `<label class="shop"><input type="radio" name="shop" value="-1" ${s.shop === -1 ? "checked" : ""}><div><div class="n">Any shop near me</div><div class="q">Typical price across ${ring >= MIN_SHOPS ? `${ring} shops within 5 km` : "the nearest shops"}</div></div><span class="km"></span></label>`,
      cu ? `<label class="shop"><input type="radio" name="shop" value="-2" ${s.shop === -2 ? "checked" : ""}><div><div class="n">${esc(cu.name)}</div><div class="q">Your shop · ${cuChain && JG && cuChain.name === "Jaya Grocer" ? `Jaya Grocer online prices, checked ${jgDate}` : cuChain ? `${cuChain.name} prices are ${pctLabel(cuChain.idx)} average` : "priced like shops near you"}</div></div><span class="km">yours</span></label>` : "",
      ...pool.map(x => `<label class="shop"><input type="radio" name="shop" value="${x.i}" ${s.shop === x.i ? "checked" : ""}><div><div class="n">${esc(shopName(x.s))}</div><div class="q">${esc(x.s[1])}${precisionNote(x.s) ? " · approx. location" : ""}</div></div><span class="km">${kmTxt(x)}</span></label>`),
    ].join("");
    const draft = S.shopDraft || "", dChain = chainOf(draft);
    const add = S.adding ? `<div class="addshop"><label for="newshop" style="font-weight:600;font-size:15px">Your shop's name</label>
        <div class="row"><input class="inp" id="newshop" placeholder="e.g. Jaya Grocer Bukit Jelutong" value="${esc(draft)}" style="background:var(--card)"><button class="btn primary" id="saveshop" style="height:48px" ${draft.trim().length < 3 ? "disabled" : ""}>Add</button></div>
        <div class="chainmsg">${draft.trim().length < 3 ? "We'll use prices from shops near your postcode." : dChain ? (JG && dChain.name === "Jaya Grocer" ? `Recognised <b>Jaya Grocer</b>. We'll use its online-store prices for ${Object.keys(JG.items).length} ingredients (checked ${jgDate}), and nearby prices +${Math.round((dChain.idx - 1) * 100)}% for the rest.` : `Recognised <b>${dChain.name}</b>. KPDN surveys ${dChain.n} of its branches; they are ${pctLabel(dChain.idx)} average, so we'll adjust nearby prices by that.`) : "Not a chain we have data for. We'll use typical prices from shops near you."}</div></div>` : "";
    return `<div class="field"><label for="postcode">Your postcode</label><div class="pc-row"><input class="inp" id="postcode" inputmode="numeric" maxlength="5" autocomplete="postal-code" value="${esc(s.postcode)}">${place}</div></div>
      <div class="field"><span class="lbl">Where you usually shop</span>
        <div class="search-wrap">${ic("search")}<input class="search" id="shopq" type="search" placeholder="Search shops by name" value="${esc(S.shopQ || "")}" aria-label="Search shops"></div>
        <div class="shops" role="radiogroup" aria-label="Where you shop">${rows}${q && !pool.length ? `<div class="shop"><span></span><div class="q">No surveyed shop matches "${esc(S.shopQ)}"</div><span></span></div>` : ""}</div>
        <div class="shop-more">${!q && c.near.length > (S.nearN || 8) ? `<button class="link" id="moreshops">Show more nearby</button>` : ""}${S.adding ? "" : `<button class="link" id="addshop">My shop isn't listed</button>`}</div>
        ${add}
        <div class="hint">Listed shops report prices to KPDN PriceCatcher, nearest first. KPDN surveys about 2,100 shops nationwide, so many branches are missing. Add yours and we'll estimate.</div></div>`;
  }
  function householdBlock() {
    const s = S.settings;
    return `<div class="field"><span class="lbl">People eating dinner</span><div class="seg" role="group">${[1, 2, 3, 4, 5, 6].map(n => `<button data-people="${n}" aria-pressed="${s.people === n}">${n}</button>`).join("")}</div></div>
      <div class="field"><span class="lbl">Nights you cook</span><div class="seg" role="group">${DAYS.map((d, i) => `<button data-night="${i}" aria-pressed="${s.nights[i]}">${d}</button>`).join("")}</div></div>`;
  }
  function budgetBlock() {
    const s = S.settings;
    return `<div class="field"><label for="budget">Weekly grocery budget</label><div class="money"><span>RM</span><input class="inp" id="budget" type="number" inputmode="decimal" min="20" step="10" value="${s.budget}"></div><div class="hint">MasakJe keeps the plan under this</div></div>`;
  }
  function prefsBlock() {
    const s = S.settings;
    const av = [["beef", "Beef"], ["mutton", "Mutton"], ["pedas", "Very spicy"]];
    const left = RECIPES.filter(allowed).length;
    return `<div class="field"><span class="lbl">Allergies</span><div class="seg" role="group">${ALLERGENS.map(([k, l]) => `<button data-allergy="${k}" aria-pressed="${!!s.allergy[k]}">${l}</button>`).join("")}</div><div class="hint">Removes every dish with that ingredient, including sauces (oyster sauce and belacan count as shellfish, kicap as soy and wheat). Always check product labels.</div></div>
      <div class="field"><span class="lbl">Vegetables you don't eat</span><div class="seg" role="group">${VEG.map(k => `<button data-dislike="${k}" aria-pressed="${!!s.dislike[k]}">${esc(ING[k].name.replace(/ \(.*\)/, ""))}</button>`).join("")}</div></div>
      <div class="field"><span class="lbl">Also leave out</span><div class="seg" role="group">${av.map(([k, l]) => `<button data-avoid="${k}" aria-pressed="${!!s.avoid[k]}">${l}</button>`).join("")}</div><div class="hint">All dishes are halal</div></div>
      <p class="sub" style="margin:0"><span class="num">${left}</span> of ${RECIPES.length} dishes match${left < 15 ? ". That's few, so expect repeats" : ""}</p>`;
  }

  function viewOnboarding() {
    const i = S.ob;
    const heads = [["Where do you shop?", "We price your list with real unit prices from shops near you"], ["Who's eating?", "Portions and nights to plan for"], ["Food preferences", "Allergies and things your family won't eat"], ["Your budget", "We'll plan dinners that fit it"]];
    const body = [locationBlock, householdBlock, prefsBlock, budgetBlock][i]();
    const canNext = i !== 0 || !!ctx().loc;
    return `<div class="enter narrow" style="margin:0 auto">
      <div class="ob-bar">${[0, 1, 2, 3].map(k => `<i class="${k <= i ? "on" : ""}"></i>`).join("")}</div>
      <div class="ob-step">Step ${i + 1} of 4</div>
      <h1>${heads[i][0]}</h1><p class="sub">${heads[i][1]}</p>
      ${body}
      <div class="ob-actions ${i === 0 ? "solo" : ""}">${i > 0 ? `<button class="btn big" id="obBack" style="width:auto;padding:0 20px">Back</button>` : ""}<button class="btn primary big" id="obNext" ${canNext ? "" : "disabled"}>${i < 3 ? "Next" : "Plan my week"}</button></div>
      ${i === 0 ? `<p class="fine">Prices: ${esc(PR.source)}, ${PR.shops.length.toLocaleString()} shops, latest ${PR.date}. Shop locations come from their address postcode or town (GeoNames, CC BY 4.0), so distances are approximate.</p>` : ""}
    </div>`;
  }

  function viewSetup() {
    return `<div class="enter narrow">
      <h1>Settings</h1>
      <p class="sub">Changes apply when you replan</p>
      ${locationBlock()}${householdBlock()}<h2 style="font-size:17px;font-weight:500;margin:28px 0 12px">Food preferences</h2>${prefsBlock()}<div style="height:20px"></div>${budgetBlock()}
      <button class="btn primary big" id="replan">Save and plan a new week</button>
      <p class="fine">Prices: ${esc(PR.source)}, ${PR.shops.length.toLocaleString()} shops, latest ${PR.date}. Shop locations: GeoNames postcodes (CC BY 4.0). Recipes are drafts and still need checking by a home cook.</p>
    </div>`;
  }

  // ---------- recipe sheet ----------
  function openRecipe(id) {
    const r = RX[id]; if (!r) return;
    const n = S.settings.people;
    const ing = r.ing.map(([k, q]) => `<div class="ing"><span>${esc(ING[k].name)}<span class="up">${unitPrice(k)}</span></span><span class="q">${qty(q * scale(), ING[k].unit, k)}</span></div>`).join("");
    const root = document.getElementById("sheetRoot");
    root.innerHTML = `<div class="scrim" id="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="sheet-in">
      <div class="grab"></div><button class="icon-btn close" id="shClose" aria-label="Close">${ic("x", 18)}</button>
      <h2 id="sh-t">${esc(r.name)}</h2><div style="color:var(--fg2)">${esc(r.en)}</div>
      <div class="meta"><span class="tag">${ic("clock", 12)}${r.mins} min</span><span class="tag">${r.guide.length} steps</span><span class="tag">${esc(r.cuisine)}</span>${r.spicy >= 2 ? '<span class="tag pedas">Pedas</span>' : r.spicy ? '<span class="tag">Mild heat</span>' : ""}<span class="tag num">${rm(dishCost(r))} for ${n}</span></div>
      <button class="btn primary big" data-cookone="${r.id}">${ic("flame")}Start cooking</button>
      <h3>Ingredients for ${n}</h3>${ing}
      <p class="fine">Draft recipe, not yet tested by a home cook</p>
    </div></div>`;
    requestAnimationFrame(() => { document.getElementById("scrim").classList.add("open"); root.querySelector(".sheet").classList.add("open"); });
    document.getElementById("scrim").onclick = closeSheet; document.getElementById("shClose").onclick = closeSheet;
    document.getElementById("shClose").focus();
  }
  const closeSheet = () => { document.getElementById("sheetRoot").innerHTML = ""; };

  // ---------- cooking mode ----------
  let C = null; // {queue:[ids], qi, step (-1 = get ready), day, timers:{}, ticking}
  let wakeLock = null;
  function startCooking(queue, day) {
    closeSheet();
    C = { queue, qi: 0, step: -1, day, timers: {}, ticking: null, prepped: {}, started: null };
    C.clock = setInterval(() => { const el = document.getElementById("elapsed"); if (el && C && C.started) el.textContent = fmtClock(Math.floor((Date.now() - C.started) / 1000)); }, 1000);
    try { navigator.wakeLock && navigator.wakeLock.request("screen").then(l => { wakeLock = l; }).catch(() => {}); } catch (e) {}
    renderCook();
  }
  function stopCooking() {
    if (C && C.ticking) clearInterval(C.ticking);
    if (C && C.clock) clearInterval(C.clock);
    C = null; document.getElementById("cookRoot").innerHTML = "";
    try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null;
    document.body.style.overflow = "";
  }
  function timerKey() { return `${C.qi}:${C.step}`; }
  function tick() {
    let any = false;
    for (const [k, t] of Object.entries(C.timers)) {
      if (!t.running) continue;
      t.left = Math.max(0, Math.round((t.end - Date.now()) / 1000)); any = true;
      if (t.left === 0) { t.running = false; t.rang = true; try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {} }
    }
    const el = document.getElementById("clock"), t = C.timers[timerKey()];
    if (el && t) { el.textContent = fmtClock(t.left); }
    if (!any) { clearInterval(C.ticking); C.ticking = null; }
    if (t && t.rang && !document.querySelector(".timer.ring")) renderCook();
  }
  function renderCook() {
    const root = document.getElementById("cookRoot");
    if (!C) return;
    document.body.style.overflow = "hidden";
    const r = RX[C.queue[C.qi]], n = S.settings.people, total = r.guide.length;
    const multi = C.queue.length > 1 ? ` · dish ${C.qi + 1} of ${C.queue.length}` : "";
    const est = C.queue.reduce((a, id) => a + RX[id].mins, 0);
    const elapsed = C.started ? `<span class="tag ok" style="height:28px;font-size:14px;padding:0 10px">${ic("clock", 14)}<span id="elapsed">${fmtClock(Math.floor((Date.now() - C.started) / 1000))}</span>&nbsp;/ ~${est} min</span>` : `<span class="tag">~${est} min total</span>`;
    const segs = `<div class="segs">${[-1, ...r.guide.map((_, i) => i)].map(i => `<i class="${i <= C.step ? "on" : ""}"></i>`).join("")}</div>`;
    let body, foot;
    if (C.step === -1) {
      const rice = C.qi === 0 && C.day != null && !S.plan.days[C.day].onepot
        ? `<div class="tip">${ic("info")}<div>Start the rice first: <b class="num">${qty(RICE_PER_PERSON * n, "g", "rice")}</b> rice for ${n}. It will be ready when the lauk is.</div></div>` : "";
      const ready = r.ing.filter(([k]) => C.prepped[k]).length;
      body = `<div class="step-no">Get ready</div><h2 class="step-t">Gather these for ${n} ${n === 1 ? "person" : "people"}</h2>${rice}
        <div style="display:flex;justify-content:space-between;font-size:14px;color:var(--fg2);margin-bottom:8px"><span><b style="color:var(--fg)">${ready} of ${r.ing.length}</b> ready</span>${ready === r.ing.length ? '<span style="color:var(--pos);font-weight:600">All set</span>' : ""}</div>
        <div class="meter" style="margin-bottom:12px" role="progressbar" aria-valuemin="0" aria-valuemax="${r.ing.length}" aria-valuenow="${ready}" aria-label="Ingredients ready"><div style="transform:scaleX(${(ready / r.ing.length).toFixed(3)})"></div></div>
        <div class="prep">${r.ing.map(([k, q]) => `<label><input type="checkbox" data-prep="${k}" ${C.prepped[k] ? "checked" : ""}><span>${esc(ING[k].name)}</span><span class="q">${qty(q * scale(), ING[k].unit, k)}</span></label>`).join("")}</div>`;
      foot = `<button class="btn" id="ckBack">${C.qi > 0 ? "Back" : "Close"}</button><button class="btn primary" id="ckNext">${C.started ? "Start step 1" : `${ic("play")}Start cooking`}</button>`;
    } else if (C.step < total) {
      const st = r.guide[C.step];
      const need = st.ing.length ? `<div class="need"><span class="lbl">You need</span><div class="need-list">${st.ing.map(k => { const q = r.ing.find(x => x[0] === k)[1]; return `<span class="need-chip">${esc(ING[k].name)} <b>${qty(q * scale(), ING[k].unit, k)}</b></span>`; }).join("")}</div></div>` : "";
      let timer = "";
      if (st.sec) {
        const t = C.timers[timerKey()] || { left: st.sec, running: false };
        timer = `<div class="timer ${t.rang ? "ring" : ""}"><div><div class="clock" id="clock">${fmtClock(t.left)}</div><div class="lbl">${t.rang ? "Time's up" : t.running ? "Timer running" : "Timer"}</div></div><div class="acts">${t.running ? `<button class="btn" id="tPause" aria-label="Pause timer">${ic("pause")}</button>` : `<button class="btn primary" id="tStart">${ic("play")}${t.left === st.sec ? "Start" : "Resume"}</button>`}${t.left !== st.sec ? `<button class="btn" id="tReset" aria-label="Reset timer">${ic("reset")}</button>` : ""}</div></div>`;
      }
      body = `<div class="step-no">Step ${C.step + 1} of ${total}</div><h2 class="step-t">${esc(st.t)}</h2>${need}${timer}`;
      foot = `<button class="btn" id="ckBack">Back</button><button class="btn primary" id="ckNext">${C.step + 1 < total ? "Next" : "Finish"}</button>`;
    } else {
      const more = C.qi + 1 < C.queue.length;
      const took = C.started ? Math.round((Date.now() - C.started) / 60000) : 0;
      body = `<div class="step-no">${ic("check")}</div><div class="done-t">${esc(r.name)} is ready</div>${C.started ? `<p class="sub">Cooking time so far: ${took} min</p>` : ""}<p class="sub">${more ? `Next: ${esc(RX[C.queue[C.qi + 1]].name)}` : C.day != null ? "Dinner is done. Selamat makan." : "Selamat makan."}</p>`;
      foot = `<button class="btn" id="ckBack">Back</button><button class="btn primary" id="ckNext">${more ? `Cook ${esc(RX[C.queue[C.qi + 1]].name)}` : "Finish"}</button>`;
    }
    root.innerHTML = `<div class="cook" role="dialog" aria-modal="true" aria-label="Cooking ${esc(r.name)}">
      <div class="cook-in"><div class="cook-top"><div style="min-width:0"><div class="n">${esc(r.name)}</div><div class="s" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px">${elapsed}<span>${r.mins} min dish${multi}</span></div></div><button class="icon-btn" id="ckClose" aria-label="Close cooking mode">${ic("x", 18)}</button></div>${segs}</div>
      <div class="cook-body"><div class="cook-in enter">${body}</div></div>
      <div class="cook-in"><div class="cook-foot">${foot}</div></div>
    </div>`;
    const $ = id => document.getElementById(id);
    $("ckClose").onclick = stopCooking;
    $("ckBack").onclick = () => {
      if (C.step >= 0) C.step--;
      else if (C.qi > 0) { C.qi--; C.step = RX[C.queue[C.qi]].guide.length; }
      else return stopCooking();
      renderCook();
    };
    $("ckNext").onclick = () => {
      if (C.step < total) { if (!C.started) C.started = Date.now(); C.step++; return renderCook(); }
      if (C.qi + 1 < C.queue.length) { C.qi++; C.step = -1; return renderCook(); }
      if (C.day != null) { S.flow.cooked[C.day] = true; deductCooked(C.day); save(); }
      stopCooking(); render();
    };
    const t = C.timers[timerKey()], st = r.guide[C.step];
    if ($("tStart")) $("tStart").onclick = () => { const cur = C.timers[timerKey()] || { left: st.sec }; C.timers[timerKey()] = { left: cur.left, end: Date.now() + cur.left * 1000, running: true }; if (!C.ticking) C.ticking = setInterval(tick, 250); renderCook(); };
    if ($("tPause")) $("tPause").onclick = () => { t.running = false; renderCook(); };
    if ($("tReset")) $("tReset").onclick = () => { delete C.timers[timerKey()]; renderCook(); };
    root.querySelectorAll("[data-prep]").forEach(el => el.onchange = () => { C.prepped[el.dataset.prep] = el.checked; const y = root.querySelector(".cook-body").scrollTop; renderCook(); root.querySelector(".cook-body").scrollTop = y; });
    $("ckNext").focus();
  }

  function toast(msg) {
    const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = msg;
    document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
  }

  // ---------- render ----------
  const TABS = [["week", "Week", "week"], ["shop", "Shop", "list"], ["kitchen", "Kitchen", "fridge"], ["recipes", "Recipes", "book"], ["setup", "Settings", "sliders"]];
  function render() {
    const v = document.getElementById("view");
    const ob = !S.onboarded;
    document.getElementById("app").classList.toggle("bare", ob);
    document.getElementById("tabsNav").hidden = ob;
    document.getElementById("where").hidden = ob;
    if (ob) { v.innerHTML = viewOnboarding(); return; }
    if (!S.plan || S.plan.days.length !== 7) newWeek();
    v.innerHTML = S.tab === "week" ? viewWeek() : S.tab === "shop" ? viewShop() : S.tab === "recipes" ? viewRecipes() : S.tab === "kitchen" ? viewKitchen() : viewSetup();
    document.getElementById("tabs").innerHTML = TABS.map(([k, l, i]) => `<button class="tab" data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ""}>${ic(i, 20)}<span>${l}</span></button>`).join("");
    document.getElementById("where").innerHTML = `${ic("pin", 14)}<span>${esc(S.settings.postcode)} · ${S.settings.people} ${S.settings.people === 1 ? "person" : "people"}</span>`;
  }
  function go(tab) { S.tab = tab; render(); window.scrollTo({ top: 0 }); }

  document.addEventListener("click", e => {
    const el = e.target.closest("[data-tab],[data-go],[data-swap],[data-off],[data-recipe],[data-filter],[data-people],[data-night],[data-avoid],[data-allergy],[data-dislike],[data-cookday],[data-cookone],#regen,#replan,#where,#lock,#shopped,#newweek,#obNext,#obBack,#moreshops,#addshop,#saveshop,#replanK,[data-kadd],[data-kdel],[data-kmove],[data-ksoon]");
    if (!el) return;
    const s = S.settings;
    if (el.dataset.tab) return go(el.dataset.tab);
    if (el.dataset.go) return go(el.dataset.go);
    if (el.id === "where") return go("setup");
    if (el.dataset.swap) { const [i, slot] = el.dataset.swap.split(":"); return swap(+i, slot); }
    if (el.dataset.off !== undefined) return toggleOff(+el.dataset.off);
    if (el.dataset.recipe) return openRecipe(el.dataset.recipe);
    if (el.dataset.cookday !== undefined) { const di = +el.dataset.cookday; return startCooking(dayItems(S.plan.days[di]).map(r => r.id), di); }
    if (el.dataset.cookone) return startCooking([el.dataset.cookone], null);
    if (el.dataset.filter) { S.filter = el.dataset.filter; return render(); }
    if (el.dataset.people) { s.people = +el.dataset.people; return render(); }
    if (el.dataset.night) { s.nights[+el.dataset.night] = !s.nights[+el.dataset.night]; return render(); }
    if (el.dataset.avoid) { s.avoid[el.dataset.avoid] = !s.avoid[el.dataset.avoid]; return render(); }
    if (el.dataset.allergy) { s.allergy[el.dataset.allergy] = !s.allergy[el.dataset.allergy]; return render(); }
    if (el.dataset.dislike) { s.dislike[el.dataset.dislike] = !s.dislike[el.dataset.dislike]; return render(); }
    if (el.id === "regen") { S.plan = makePlan(); S.flow.locked = false; S.flow.shopped = false; save(); return render(); }
    if (el.id === "lock") { S.flow.locked = true; save(); return go("shop"); }
    if (el.id === "shopped") { finishShopping(); toast("Leftover pack amounts added to your kitchen"); return go("week"); }
    if (el.id === "newweek" || el.id === "replan") { newWeek(); return go("week"); }
    if (el.dataset.kadd) { addKitchen(el.dataset.kadd, ING[el.dataset.kadd].pack, false); S.kq = ""; save(); return render(); }
    if (el.dataset.kdel) { delete S.kitchen[el.dataset.kdel]; save(); return render(); }
    if (el.dataset.kmove) { const v = S.kitchen[el.dataset.kmove]; v.where = v.where === "fridge" ? "freezer" : "fridge"; save(); return render(); }
    if (el.dataset.ksoon) { const v = S.kitchen[el.dataset.ksoon]; v.soon = !v.soon; save(); return render(); }
    if (el.id === "replanK") { newWeek(); toast("New plan built around your fridge"); return go("week"); }
    if (el.id === "moreshops") { S.nearN = (S.nearN || 8) + 10; return render(); }
    if (el.id === "addshop") { S.adding = true; render(); const n = document.getElementById("newshop"); n && n.focus(); return; }
    if (el.id === "saveshop") { const name = (S.shopDraft || "").trim(); if (name.length < 3) return; s.custom = { name }; s.shop = -2; S.adding = false; S.shopDraft = ""; save(); return render(); }
    if (el.id === "obBack") { S.ob = Math.max(0, S.ob - 1); render(); return window.scrollTo({ top: 0 }); }
    if (el.id === "obNext") {
      if (S.ob < 3) { S.ob++; render(); return window.scrollTo({ top: 0 }); }
      S.onboarded = true; newWeek(); return go("week");
    }
  });
  document.addEventListener("change", e => {
    const t = e.target, s = S.settings;
    if (t.dataset.bought) { S.bought[t.dataset.bought] = t.checked; save(); return render(); }
    if (t.dataset.need) { S.pantryNeed[t.dataset.need] = t.checked; save(); return render(); }
    if (t.name === "shop") { s.shop = +t.value; save(); return render(); }
    if (t.dataset.kqty) { const v = +t.value; if (v > 0) S.kitchen[t.dataset.kqty].q = v; else delete S.kitchen[t.dataset.kqty]; save(); return render(); }
    if (t.id === "budget") { s.budget = Math.max(20, +t.value || DEFAULTS.budget); save(); }
  });
  document.addEventListener("input", e => {
    const t = e.target;
    if (t.id === "q") { S.q = t.value; const pos = t.selectionStart; render(); const q = document.getElementById("q"); q.focus(); q.setSelectionRange(pos, pos); }
    if (t.id === "shopq" || t.id === "newshop" || t.id === "kq") {
      if (t.id === "shopq") S.shopQ = t.value; else if (t.id === "kq") S.kq = t.value; else S.shopDraft = t.value;
      const id = t.id, pos = t.selectionStart; render(); const el = document.getElementById(id); el.focus(); el.setSelectionRange(pos, pos); return;
    }
    if (t.id === "postcode") {
      const v = t.value.replace(/\D/g, "").slice(0, 5);
      if (v !== S.settings.postcode) { S.settings.postcode = v; S.settings.shop = -1; save(); render(); const p = document.getElementById("postcode"); p.focus(); p.setSelectionRange(v.length, v.length); }
    }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { if (C) stopCooking(); else closeSheet(); } });
  render();
})();
</script>
